tion": "Welche Fischarten dürfen in Deutschland nicht in offenen Gewässern besetzt werden?", "answers": ["Hecht, Wolgazander, Aal.", "Sonnenbarsch, Schwarzmeergrundeln, Forellenbarsch.", "Regenbogenforelle, Giebel, Schleie."], "correct": [1], "page": 22, "lesson": 15}, {"id": 220, "section": "2. Gewässerökologie (GeÖ)", "number": 64, "question": "Welche Fischarten leben u.a. typischerweise neben den Leitfischarten in der Forellenregion?", "answers": ["Koppe, Bachneunauge.", "Äsche, Döbel, Flussbarsch.", "Döbel, Bachneunauge, Zander."], "correct": [0], "page": 22, "lesson": 11}, {"id": 221, "section": "2. Gewässerökologie (GeÖ)", "number": 65, "question": "Welche Fischarten leben u.a. typischerweise neben den Leitfischarten in der Äschenregion?", "answers": ["Wels, Bachforelle, Aal.", "Schmerle, Hasel, Elritze.", "Koppe, Giebel, Strömer."], "correct": [1], "page": 22, "lesson": 11}, {"id": 222, "section": "2. Gewässerökologie (GeÖ)", "number": 66, "question": "Welche Fischarten leben u.a. typischerweise neben den Leitfischarten in der Barbenregion?", "answers": ["Bachforelle, Koppe, Flussneunauge.", "Nase, Aland, Döbel (Aitel).", "Äsche, Döbel, Flussbarsch."], "correct": [1], "page": 22, "lesson": 11}, {"id": 223, "section": "2. Gewässerökologie (GeÖ)", "number": 67, "question": "Welche Fischarten leben u.a. typischerweise neben den Leitfischarten in der Brassen- bzw. Bleiregion?", "answers": ["Güster, Rapfen (Schied), Wels.", "Wels, Bachforelle, Aal.", "Äsche, Döbel, Flussbarsch."], "correct": [0], "page": 22, "lesson": 11}, {"id": 224, "section": "2. Gewässerökologie (GeÖ)", "number": 68, "question": "Welche Fischarten leben u.a. typischerweise neben den Leitfischarten in der Kaulbarsch-/ Flunderregion?", "answers": ["Koppe, Giebel, Strömer.", "Finte, Stint, Zander.", "Karausche, Aal, Barbe."], "correct": [1], "page": 22, "lesson": 11}, {"id": 225, "section": "2. Gewässerökologie (GeÖ)", "number": 69, "question": "Welche Fischarten sollten in einem Gewässer durch Hegemaßnahmen gefördert werden?", "answers": ["Alle vorkommenden Fischarten", "Alle standorttypischen heimischen Arten.", "Nur Arten der Roten Liste."], "correct": [1], "page": 22, "lesson": 15}, {"id": 226, "section": "2. Gewässerökologie (GeÖ)", "number": 70, "question": "Welche Fischnährtiere (Zeigerorganismen) kommen in der Äschenregion häufig vor?", "answers": ["Wasserläufer, Egel, Zwergdeckelschnecken.", "Bachflohkrebse, Köcherfliegen-, Eintagsfliegenlarven.", "Libellen-, Stechmücken-, Schlammfliegenlarven."], "correct": [1], "page": 22, "lesson": 11}, {"id": 227, "section": "2. Gewässerökologie (GeÖ)", "number": 71, "question": "Welche Fischnährtiere (Zeigerorganismen) kommen in der Barbenregion häufig vor?", "answers": ["Flohkrebse, Wasserasseln, Köcherfliegenlarven.", "Libellen-, Stechmücken-, Schlammfliegenlarven.", "Wasserläufer, Egel, Zwergdeckelschnecken."], "correct": [0], "page": 22, "lesson": 11}, {"id": 228, "section": "2. Gewässerökologie (GeÖ)", "number": 72, "question": "Welche Fischnährtiere (Zeigerorganismen) kommen in der Brassen- bzw. Bleiregion häufig vor?", "answers": ["Steinkrebse, Egel, Strudelwürmer.", "Steinfliegen-, Eintagsfliegen-, Köcherfliegenlarven.", "Schlammröhrenwürmer, rote Zuckmückenlarven."], "correct": [2], "page": 23, "lesson": 11}, {"id": 229, "section": "2. Gewässerökologie (GeÖ)", "number": 73, "question": "Welche Fischnährtiere (Zeigerorganismen) kommen in der Kaulbarsch-/Flunderregion häufig vor?", "answers": ["Borstenwürmer, Garnelen und Zooplankton.", "Steinkrebse, Egel, Strudelwürmer.", "Steinfliegen-, Eintagsfliegen-, Köcherfliegenlarven."], "correct": [0], "page": 23, "lesson": 11}, {"id": 230, "section": "2. Gewässerökologie (GeÖ)", "number": 74, "question": "Welche Flusskrebse dürfen in Deutschland nicht in Gewässer besetzt werden?", "answers": ["Signalkrebs, Steinkrebs, Kamberkrebs", "Kamberkrebs, Signalkrebs, Roter Amerikanischer Sumpfkrebs.", "Roter Amerikanischer Sumpfkrebs, Edelkrebs, Marmorkrebs"], "correct": [1], "page": 23, "lesson": 15}, {"id": 231, "section": "2. Gewässerökologie (GeÖ)", "number": 75, "question": "Welche Folgen haben weggeworfene Angelschnurreste für die Umwelt?", "answers": ["Angelschnüre lösen sich unter Freisetzung von Giftstoffen auf, die Gewässer belasten.", "Angelschnüre verrotten schnell, der Zersetzungsprozess verbraucht Sauerstoff, der im Gewässer lebenden Organismen fehlt.", "Die Angelschnüre verrotten nicht und können zur Gefahr für Tiere werden."], "correct": [2], "page": 23, "lesson": 14}, {"id": 232, "section": "2. Gewässerökologie (GeÖ)", "number": 76, "question": "Welche Folgen hat die Einleitung organischer Abwässer für ein Gewässer?", "answers": ["Organische Abwässer enthalten viele Nährstoffe als Nahrungsgrundlage für Plankton, höher entwickelte Lebewesen und damit letztlich für Fische.", "Die Zersetzung organischer Abwässer verbraucht große Mengen Sauerstoff, und es kann zu Fischsterben kommen.", "Organische Abwässer enthalten viel Sauerstoff und verbessern die Lebensbedingungen im Gewässer."], "correct": [1], "page": 23, "lesson": 9}, {"id": 233, "section": "2. Gewässerökologie (GeÖ)", "number": 77, "question": "Welche Folgen hat ein Überbesatz für ein Gewässer?", "answers": ["Es kommt zu einer erhöhten Nahrungskonkurrenz, die zu Unterernährung oder Verbuttung von Beständen oder Abwanderung führt.", "Gute Fangerfolge", "Bestandsgrößen und Artenvielfalt werden sich dauerhaft erhöhen."], "correct": [0], "page": 23, "lesson": 15}, {"id": 234, "section": "2. Gewässerökologie (GeÖ)", "number": 78, "question": "Welche Folgen hat verloren gegangenes Blei für die Umwelt?", "answers": ["Blei löst sich im Wasser nach mehreren Monaten auf, wodurch es über Nahrung von Organismen aufgenommen wird und diese schädigt.", "Blei ist ein Schwermetall, das schädlich für Tiere, Pflanzen und Menschen ist, wenn es von ihnen aufgenommen wird.", "Tiere können Blei für Nahrung halten. Im Magen wird es nicht abgebaut, weshalb die Tiere keine andere Nahrung mehr aufnehmen und verhungern."], "correct": [1], "page": 23, "lesson": 14}, {"id": 235, "section": "2. Gewässerökologie (GeÖ)", "number": 79, "question": "Welche Folgen kann das Aussetzen oder Anpflanzen nicht heimischer Tier- oder Pflanzenarten haben?", "answers": ["Keine, sie sind auf den neuen Lebensraum nicht vorbereitet und werden bald von heimischen Arten verdrängt oder aufgefressen.", "Sie können heimische Arten verdrängen und das ökologische Gleichgewicht beeinträchtigen.", "Sie steigern die Artenvielfalt und bereichern damit den Lebensraum."], "correct": [1], "page": 23, "lesson": 15}, {"id": 236, "section": "2. Gewässerökologie (GeÖ)", "number": 80, "question": "Welche Folgen kann ein falscher, dem Gewässer nicht angepasster Fischbesatz haben?", "answers": ["Wenn möglich muss das Gewässer abgefischt werden.", "Die Fischartenzusammensetzung und die Altersstruktur in einem Gewässer können aus dem Gleichgewicht gebracht werden.", "Es können lediglich finanzielle Schäden auftreten."], "correct": [1], "page": 23, "lesson": 15}, {"id": 237, "section": "2. Gewässerökologie (GeÖ)", "number": 81, "question": "Welche Frösche, Unken, Kröten, Salamander und Molche stehen unter Naturschutz?", "answers": ["Keine, sie unterliegen alle dem Fischereirecht.", "Alle aufgeführten Amphibienarten.", "Nur Laubfrosch, Gelbbauchunke, Rotbauchunke, Feuersalamander, Kammmolch und Teichmolch."], "correct": [1], "page": 24, "lesson": 14}, {"id": 238, "section": "2. Gewässerökologie (GeÖ)", "number": 82, "question": "Welche Funktion hat ein Uferrandstreifen?", "answers": ["Es ist die Fläche, auf der sich Angler über das Uferbetretungsrecht auch ohne besondere Erlaubnis aufhalten dürfen.", "Er verhindert, dass fischfressende Vögel wie Reiher, Rohrdommel und Eisvögel Jungfische in sensiblen Flachwasserbereichen jagen können.", "Er verringert den Eintrag von Agrarchemikalien, Düngestoffen und Feinsedimenten in das Gewässer."], "correct": [2], "page": 24, "lesson": 14}, {"id": 239, "section": "2. Gewässerökologie (GeÖ)", "number": 83, "question": "Welche Gefahren können mit einer Fischbesatzmaßnahme verbunden sein?", "answers": ["Das Einschleppen von Fischkrankrankheiten oder nicht heimischen Fischarten.", "Plötzliches hohes Aufkommen von fischfressenden Räubern.", "Die Fischbestände reagieren mit einer verringerten natürlichen Vermehrung."], "correct": [0], "page": 24, "lesson": 15}, {"id": 240, "section": "2. Gewässerökologie (GeÖ)", "number": 84, "question": "Welche Gewässerzone ist häufig am sauerstoffärmsten?", "answers": ["Die Bodenzone eines Gewässers.", "Die Wasseroberfläche und Uferzonen.", "Die Kieslückenräume (Interstitial)."], "correct": [0], "page": 24, "lesson": 9}, {"id": 241, "section": "2. Gewässerökologie (GeÖ)", "number": 85, "question": "Welche Gewässerzonen sind am sauerstoffreichsten?", "answers": ["Die Bodenzone eines Gewässers.", "Die Wasseroberfläche und Uferzonen.", "Die Kieslückenräume (Interstitial)."], "correct": [1], "page": 24, "lesson": 9}, {"id": 242, "section": "2. Gewässerökologie (GeÖ)", "number": 86, "question": "Welche Gründe rechtfertigen eine Fischbesatzmaßnahme?", "answers": ["Wenn die natürliche Reproduktion des Bestandes nicht ausreicht, um diesen zu erhalten, zur Wiederansiedelung bedrohter Fischarten und nach einem Fischsterben.", "Um den Fangerfolg zu steigern müssen zur Entnahme geeignete Fische besetzt werden.", "Die Erhöhung der Artenvielfalt ist der einzige Grund, der eine Besatzmaßnahme rechtfertigt."], "correct": [0], "page": 24, "lesson": 15}, {"id": 243, "section": "2. Gewässerökologie (GeÖ)", "number": 87, "question": "Welche Hegemaßnahmen können an stehenden Gewässern unternommen werden, um den Aufwuchs von Jungfischen zu fördern?", "answers": ["Die Bejagung von Fischottern und Kormoranen.", "Die gezielte Einbringung von Futter für Jungfische in Flachwasserbereichen.", "Die Flachwasserbereiche in den Uferzonen können erweitert werden, um mehr Lebensraum und Nahrungsgrundlage für Jungfische zu schaffen."], "correct": [2], "page": 24, "lesson": 14}, {"id": 244, "section": "2. Gewässerökologie (GeÖ)", "number": 88, "question": "Welche Hegemaßnahmen können zur Förderung der Biotopverbesserung unternommen werden?", "answers": ["Förderung oder Schaffung von Laichplätzen. Einbringen von Totholz als Unterstand und zur Förderung der Strukturvielfalt.", "Die Begradigung von Fließgewässern.", "Entfernen von Wasserpflanzen, um einfachere Befischung zu ermöglichen."], "correct": [0], "page": 24, "lesson": 14}, {"id": 245, "section": "2. Gewässerökologie (GeÖ)", "number": 89, "question": "Welche Hegemaßnahmen können zur nachhaltigen Förderung des Zanderbestandes unternommen werden?", "answers": ["Das Schonmaß des Zanders verringern.", "Besatz mit fangfähigen Zandern.", "Das Einbringen von Zanderlaichnestern."], "correct": [2], "page": 24, "lesson": 15}, {"id": 246, "section": "2. Gewässerökologie (GeÖ)", "number": 90, "question": "Welche Hegemaßnahmen sollten unternommen werden, um einen hohen Weißfischbestand zu verringern?", "answers": ["Die Verringerung des Angeldrucks auf Raubfische sowie intensive Befischung der Weißfische.", "Das Anfüttern sollte untersagt werden.", "Die Elektrofischerei"], "correct": [0], "page": 25, "lesson": 15}, {"id": 247, "section": "2. Gewässerökologie (GeÖ)", "number": 91, "question": "Welche künstlichen Gewässer gibt es?", "answers": ["Kanäle, Seen, Weiher.", "Teiche, Baggerseen, Kanäle.", "Kanäle, Teiche, kleine Bäche."], "correct": [1], "page": 25, "lesson": 14}, {"id": 248, "section": "2. Gewässerökologie (GeÖ)", "number": 92, "question": "Welche negativen Auswirkungen kann der Biber auf natürliche Fließgewässer haben?", "answers": ["Durch Dammbau wird die Fischwanderung behindert oder unterbunden.", "Wegen des für den Dammbau eingebrachten Totholzes ist es meistens nicht mehr möglich, das Gewässer zu befischen.", "Er frisst viele Wasserpflanzen und nimmt Fischen damit Nahrung."], "correct": [0], "page": 25, "lesson": 14}, {"id": 249, "section": "2. Gewässerökologie (GeÖ)", "number": 93, "question": "Welche ökologische Bedeutung haben Altarme für ein Fließgewässer?", "answers": ["Sie sind konstant an den Hauptarm angeschlossen und senken dadurch den Wasserspiegel.", "Bei Hochwasser entnehmen sie dem Hauptarm Wasser und schaden dadurch den dort lebenden Organismen.", "Sie sind Kinderstube, Laichplätze sowie Rückzugsgebiet bei Hochwasser für viele Fischarten."], "correct": [2], "page": 25, "lesson": 14}, {"id": 250, "section": "2. Gewässerökologie (GeÖ)", "number": 94, "question": "Welche Organismen werden als Verbraucher/ Konsumenten in einem Gewässer bezeichnet?", "answers": ["Kleinkrebse, Fische, Vögel, Säugetiere.", "Wasserpflanzen und Algen.", "Bakterien und Pilze."], "correct": [0], "page": 25, "lesson": 12}, {"id": 251, "section": "2. Gewässerökologie (GeÖ)", "number": 95, "question": "Welche Organismen werden als Zersetzer/Destruenten in einem Gewässer bezeichnet?", "answers": ["Wasserpflanzen und Algen.", "Kleinkrebse, Fische, Vögel, Säugetiere.", "Bakterien und Pilze."], "correct": [2], "page": 25, "lesson": 12}, {"id": 252, "section": "2. Gewässerökologie (GeÖ)", "number": 96, "question": "Welche Pflanze findet man überwiegend in der Forellenregion?", "answers": ["Quellmoos", "Sumpfdotterblume", "Schilf"], "correct": [0], "page": 25, "lesson": 11}, {"id": 253, "section": "2. Gewässerökologie (GeÖ)", "number": 97, "question": "Welche positiven Auswirkungen kann der Biber auf natürliche Fließgewässer haben?", "answers": ["Der Biber kann Fressfeinde wie Kormorane und Otter vom Gewässer fernhalten und damit den Fischbestand schützen.", "Der Biber kann zur Strukturvielfalt beitragen.", "Durch Dammbau wird die Wassertemperatur im Fließgewässer erhöht, was die Lebensbedingungen von Forellen verbessert."], "correct": [1], "page": 25, "lesson": 14}, {"id": 254, "section": "2. Gewässerökologie (GeÖ)", "number": 98, "question": "Welche positiven Folgen kann ein Hochwasser für ein Fließgewässer haben?", "answers": ["Der Abtransport von Sediment schafft mehr Platz für Fische.", "Schaffung von neuen Strukturen durch Transport von Totholz und Sedimenten.", "Der Abtransport von Totholz säubert das Gewässer."], "correct": [1], "page": 25, "lesson": 14}, {"id": 255, "section": "2. Gewässerökologie (GeÖ)", "number": 99, "question": "Welche Probleme verursachen Wasserkraftanlagen in Fließgewässern?", "answers": ["Die Auswirkungen von Wasserkraftanlagen sind noch nicht ausreichend erforscht.", "Fehlende Durchgängigkeit, unzureichende Restwassermengen, Fischschädigungen bei Turbinenpassage.", "Durch Wasserkraftanlagen wird zwar der Wasserhaushalt beeinträchtigt, aber nicht die Fischbestände"], "correct": [1], "page": 25, "lesson": 14}, {"id": 256, "section": "2. Gewässerökologie (GeÖ)", "number": 100, "question": "Welche Ursachen sind hauptsächlich für das Verschwinden vieler Fischnährtiere verantwortlich?", "answers": ["Zu hohe Nährstoff- und Sauerstoffgehalte, steigende Wassertemperatur.", "Insektizide, Gewässerausbau und -verschmutzung.", "Höhere Strömungsgeschwindigkeit und Hochwasser in Fließgewässern nach häufigen Starkregenereignissen."], "correct": [1], "page": 26, "lesson": 14}, {"id": 257, "section": "2. Gewässerökologie (GeÖ)", "number": 101, "question": "Welche Vogelarten legen Bruthöhlen in steilen Uferabbrüchen an?", "answers": ["Rauchschwalbe, Schwarzspecht.", "Mehlschwalbe, Rohrdommel.", "Uferschwalbe, Eisvogel."], "correct": [2], "page": 26, "lesson": 14}, {"id": 258, "section": "2. Gewässerökologie (GeÖ)", "number": 102, "question": "Welche Zeigerorganismen kommen häufig in Fließgewässern mit hohem Nährstoffgehalt vor?", "answers": ["Wasserasseln", "Steinfliegenlarven", "Steinkrebse"], "correct": [0], "page": 26, "lesson": 13}, {"id": 259, "section": "2. Gewässerökologie (GeÖ)", "number": 103, "question": "Welche Zeigerorganismen kommen häufig in Fließgewässern mit übermäßigen Nährstoffgehalt vor?", "answers": ["Steinfliegenlarven", "Steinkrebse", "Rote Zuckmückenlarven"], "correct": [2], "page": 26, "lesson": 13}, {"id": 260, "section": "2. Gewässerökologie (GeÖ)", "number": 104, "question": "Welche Zeigerorganismen kommen häufig in sehr sauberen Fließgewässern vor?", "answers": ["Schlammröhrenwürmer", "Steinfliegenlarven", "Wasserasseln"], "correct": [1], "page": 26, "lesson": 13}, {"id": 261, "section": "2. Gewässerökologie (GeÖ)", "number": 105, "question": "Welchem Zweck dient die fischereiliche Hege?", "answers": ["Ausschließliche Erhaltung fischereilich nutzbarer Raubfischbestände.", "Ordnung und Sauberkeit am Gewässer", "Erhaltung der natürlichen Ertrags- und Reproduktionsfähigkeit der Gewässer und der Fischbestände."], "correct": [2], "page": 26, "lesson": 15}, {"id": 262, "section": "2. Gewässerökologie (GeÖ)", "number": 106, "question": "Welchen Einfluss haben Querbauwerke (z. B. Wehre) auf die Fischbestände eines Fließgewässers?", "answers": ["Sie verhindern Laichwanderungen, isolieren dadurch Fischbestände und verändern den Lebensraum.", "Durch den Rückstau werden die Strömungsgeschwindigkeiten verringert, wodurch sich Fische besser erholen und besser abwachsen können.", "Die Auswirkungen von Querbauwerken auf Fischbestände sind noch nicht ausreichend erforscht."], "correct": [0], "page": 26, "lesson": 14}, {"id": 263, "section": "2. Gewässerökologie (GeÖ)", "number": 107, "question": "Welchen Einfluss haben Querbauwerke (z.B. Wehre) auf Fließgewässer-Lebensräume?", "answers": ["Durch den Rückhalt von Schwemmgut werden die flussabgelegenen Bereiche weniger stark verschmutzt.", "Sie verlangsamen die Fließgeschwindigkeit des Gewässers. Dadurch verschlammt der Gewässergrund und die Wassertemperatur steigt.", "Die Auswirkungen von Querbauwerken sind noch nicht ausreichend erforscht."], "correct": [1], "page": 26, "lesson": 14}, {"id": 264, "section": "2. Gewässerökologie (GeÖ)", "number": 108, "question": "Welchen Einfluss können Kormorane auf einen intakten Fischbestand in einem natürlichen Gewässer haben?", "answers": ["Sie fressen nur kranke Fische und fördern so den Fischbestand.", "Der Fischbestand kann ernsthaft gefährdet werden.", "Sie vernichten meist eine bestimmte Fischart."], "correct": [1], "page": 26, "lesson": 14}, {"id": 265, "section": "2. Gewässerökologie (GeÖ)", "number": 109, "question": "Welchen Einfluss können landwirtschaftliche Flächen im Bereich von Gewässern haben?", "answers": ["Bei Starkregen können Bodensubstrat und Dünger in das Gewässer eingetragen werden.", "Der häufige Aufenthalt von Menschen und Fahrzeugen auf landwirtschaftlichen Flächen vergrämt Fischfresser wie Kormorane und Eisvögel, wodurch der Fischbestand steigt.", "Landwirtschaftliche Flächen sind frei von Bäumen als Ansitzplätze, wodurch weniger Fischfresser wie Kormorane und Eisvögel den Fischbestand reduzieren."], "correct": [0], "page": 27, "lesson": 14}, {"id": 266, "section": "2. Gewässerökologie (GeÖ)", "number": 110, "question": "Welchen Nährstoffgehalt hat ein eutrophes Gewässer?", "answers": ["Nährstoffgehalt hoch.", "Nährstoffgehalt nicht bestimmbar.", "Nährstoffgehalt gering."], "correct": [0], "page": 27, "lesson": 13}, {"id": 267, "section": "2. Gewässerökologie (GeÖ)", "number": 111, "question": "Welchen Nährstoffgehalt hat ein oligotrophes Gewässer?", "answers": ["Nährstoffgehalt hoch.", "Nährstoffgehalt nicht bestimmbar.", "Nährstoffgehalt gering."], "correct": [2], "page": 27, "lesson": 13}, {"id": 268, "section": "2. Gewässerökologie (GeÖ)", "number": 112, "question": "Welchen Zweck hat das Schonmaß/Mindestmaß in Bezug auf die fischereiliche Hege?", "answers": ["Die Fische sollen eine Größe erreichen, die sicherstellt, dass sie sich mindestens einmal in ihrem Leben fortgepflanzt haben.", "Jungfische sollen im Familienverband aufwachsen können.", "Es sollen viele große Fische im Gewässer vorkommen."], "correct": [0], "page": 27, "lesson": 15}, {"id": 269, "section": "2. Gewässerökologie (GeÖ)", "number": 113, "question": "Welchen Zweck hat die Führung einer Fangstatistik?", "answers": ["Eine Fangstatistik ermöglicht eine Einschätzung des Fischbestandes und der erfolgten Entnahmen.", "Als Berechnungsgrundlage für den Wert des Fischereirechts.", "Die Fangstatistik dient zur Kontrolle, wer die meisten Fische gefangen hat."], "correct": [0], "page": 27, "lesson": 15}, {"id": 270, "section": "2. Gewässerökologie (GeÖ)", "number": 114, "question": "Welchen Zweck hat die Schonzeit in Bezug auf die fischereiliche Hege?", "answers": ["Diese Zeit soll gewährleisten, dass die Fische sich nicht an bestimmte Köder gewöhnen.", "Die Schonzeit einer Fischart soll die ungestörte Fortpflanzung gewährleisten.", "Die Schonzeit ist eine Ruhezeit für die Angler."], "correct": [1], "page": 27, "lesson": 15}, {"id": 271, "section": "2. Gewässerökologie (GeÖ)", "number": 115, "question": "Welcher Umweltfaktor beeinflusst die Wasserorganismen in den Flussmündungen am Meer besonders?", "answers": ["Die stark schwankenden Windverhältnisse.", "Der stark schwankende Salzgehalt.", "Konstant niedrige Wassertemperaturen."], "correct": [1], "page": 27, "lesson": 11}, {"id": 272, "section": "2. Gewässerökologie (GeÖ)", "number": 116, "question": "Welches Besatzmaterial sollte für Fischbesatzmaßnahmen gewählt werden, sofern die Besatzmaßnahme sinnvoll ist?", "answers": ["Es sollten viele unterschiedliche Arten besetzt werden.", "Es sollten fangfähige Fische besetzt werden.", "Es sollten nur Fische besetzt werden, die der Fischpopulation im Besatzgewässer möglichst nahestehen."], "correct": [2], "page": 27, "lesson": 15}, {"id": 273, "section": "2. Gewässerökologie (GeÖ)", "number": 117, "question": "Wer darf Fischbesatzmaßnahmen durchführen, sofern die Besatzmaßnahme sinnvoll ist?", "answers": ["Immer der Gewässereigentümer.", "Nur der Fischereiberechtigte / Fischereirechtsinhaber / Fischereipächter.", "Jeder Erlaubnisscheininhaber"], "correct": [1], "page": 27, "lesson": 15}, {"id": 274, "section": "2. Gewässerökologie (GeÖ)", "number": 118, "question": "Weshalb sind Bisam und Nutria als gebietsfremde und invasive Art so problematisch?", "answers": ["Sie ernähren sich teilweise von geschützten Großmuscheln und Amphibien.", "Sie ernähren sich von Fischen und Fischlaich, wodurch die Bestände gefährdet werden können.", "Sie ernähren sich von Pflanzen und tragen bei deren Zersetzung erhebliche Mengen an Nährstoffen ein."], "correct": [0], "page": 27, "lesson": 14}, {"id": 275, "section": "2. Gewässerökologie (GeÖ)", "number": 119, "question": "Wie lautet die richtige Reihenfolge der Regionen in einem Fließgewässer von der Quelle aus gesehen?", "answers": ["Forellen-, Äschen-, Barben-, Brassen-(Blei, Brachsen), Kaulbarsch- /Flunderregion.", "Forellen-, Äschen-, Barben-, Kaulbarsch-/Flunderregion, Brassen-(Blei, Brachsen)", "Forellen-, Barben-, Äschen-, Brassen-(Blei, Brachsen), Kaulbarsch-/Flunderregion."], "correct": [0], "page": 28, "lesson": 11}, {"id": 276, "section": "2. Gewässerökologie (GeÖ)", "number": 120, "question": "Wie lautet vereinfachend die richtige Reihenfolge der Nahrungskette in einem Gewässer?", "answers": ["Raubfische und andere Räuber - Fried- und Jungfische - Phytoplankton - Zooplankton", "Phytoplankton – Zooplankton – Fried- und Jungfische – Raubfische und andere Räuber", "Zooplankton – Phytoplankton – Fried- und Jungfische – Raubfische und andere Räuber"], "correct": [1], "page": 28, "lesson": 12}, {"id": 277, "section": "2. Gewässerökologie (GeÖ)", "number": 121, "question": "Wie sollte sinnvoll angefüttert werden, ohne dass negative Folgen für die Gewässer entstehen?", "answers": ["An mehreren Stellen in erreichbarer Entfernung und in ausreichender Menge, um von Fischen wahrgenommen zu werden.", "In kleinen, dosierten Mengen.", "In möglichst kurzer Zeit, unabhängig von der Menge."], "correct": [1], "page": 28, "lesson": 15}, {"id": 278, "section": "2. Gewässerökologie (GeÖ)", "number": 122, "question": "Worauf sollte beim Watangeln geachtet werden?", "answers": ["Man muss darauf achten, flache Uferbereiche generell nicht zu betreten.", "Lebensräume heimischer Großmuscheln sollten nicht betreten werden.", "Man sollte bevorzugt auf Kiesbänken bleiben, um durch die Trittbewegungen den Kies zu bewegen und so zu reinigen."], "correct": [1], "page": 28, "lesson": 14}, {"id": 279, "section": "2. Gewässerökologie (GeÖ)", "number": 123, "question": "Worauf sollten Besatzfische vor der Besatzmaßnahme kontrolliert werden?", "answers": ["Auf ihre Färbung und Gewicht.", "Auf ihr Geschlecht.", "Auf ihre Art und äußerlich erkennbare Krankheitsmerkmale."], "correct": [2], "page": 28, "lesson": 15}, {"id": 280, "section": "2. Gewässerökologie (GeÖ)", "number": 124, "question": "Woraus besteht die Nahrung des Fischotters?", "answers": ["Aus karpfenartigen Fischen.", "Aus Fischen, Flusskrebsen, Amphibien und kleinen Wasservögeln.", "Aus Fischen aller Arten bis etwa 25 cm Länge."], "correct": [1], "page": 28, "lesson": 12}, {"id": 281, "section": "2. Gewässerökologie (GeÖ)", "number": 125, "question": "Wovon ernähren sich Graureiher?", "answers": ["Fische, Muscheln, Schnecken und großblättrige Wasserpflanzen.", "Fische, Amphibien und kleinere Nagetiere.", "Fische aller Arten bis etwa 15 cm Länge."], "correct": [1], "page": 28, "lesson": 12}, {"id": 282, "section": "2. Gewässerökologie (GeÖ)", "number": 126, "question": "Wovon ernähren sich Kormorane?", "answers": ["Fische aller Arten bis etwa 25 cm Länge.", "Fische, Flusskrebse, Amphibien und kleine Wasservögel.", "Fische aller Art und Größe."], "correct": [2], "page": 28, "lesson": 12}, {"id": 283, "section": "2. Gewässerökologie (GeÖ)", "number": 127, "question": "Nur eine Antwort ist richtig", "answers": ["Die Artenvielfalt der Fische nimmt von der Quelle zur Mündung ab", "Die Artenvielfalt der Fische nimmt von der Quelle zur Mündung zu", "Die Artenvielfalt der Fische ist von der Quelle zur Mündung gleich"], "correct": [1], "page": 28, "lesson": 11}, {"id": 284, "section": "2. Gewässerökologie (GeÖ)", "number": 128, "question": "Häufige Kleintiere der Forellenregion sind ...?", "answers": ["Tubifex und Köcherfliegenlarven", "Bachflohkrebs, Steinfliegenlarven und Eintagsfliegenlarven", "Schlammröhrenwürmer, Wasserasseln und Wasserflöhe"], "correct": [1], "page": 28, "lesson": 11}, {"id": 285, "section": "2. Gewässerökologie (GeÖ)", "number": 129, "question": "Den sich von der Quelle aus der Forellenregion anschließende Fließgewässerbereich nennt man ...?", "answers": ["Barbenregion", "Äschenregion", "Brassenregion"], "correct": [1], "page": 29, "lesson": 11}, {"id": 286, "section": "2. Gewässerökologie (GeÖ)", "number": 130, "question": "Bis zu welcher Tiefe in Seen können grüne Pflanzen dauernd leben?", "answers": ["Der Pflanzenwuchs ist unabhängig von der Tiefe", "Soweit der Wasserdruck nicht zu stark ist", "Soweit genügend Licht eindringt"], "correct": [2], "page": 29, "lesson": 10}, {"id": 287, "section": "2. Gewässerökologie (GeÖ)", "number": 131, "question": "Was wird zur Bestimmung der Fischregion (nach Huet) herangezogen?", "answers": ["Anzahl der Gumpen und Kolke", "Gefälle und Gewässerbreite", "Gewässertiefe und Gewässertrübung"], "correct": [1], "page": 29, "lesson": 11}, {"id": 288, "section": "2. Gewässerökologie (GeÖ)", "number": 132, "question": "Können eingebrachte Laichhilfen als sinnvoll angesehen werden?", "answers": ["Nein, sie werden von den Fischen grundsätzlich nicht angenommen", "Nein, sie verrotten und belasten das Gewässer mit fäulnisfähigen Stoffen", "Ja, bei einem Mangel an natürlichen Laichplätzen in strukturarmen Gewässern"], "correct": [2], "page": 29, "lesson": 15}, {"id": 289, "section": "2. Gewässerökologie (GeÖ)", "number": 133, "question": "Sauerstoff ist auch im Wasser sehr wichtig für die Atmung der Lebewesen. Wie gelangt ausreichend Sauerstoff ins Wasser?", "answers": ["Durch heftige Regenfälle", "Durch Wasserbewegung und am Tag durch Pflanzen", "Durch das Grundwasser"], "correct": [1], "page": 29, "lesson": 9}, {"id": 290, "section": "2. Gewässerökologie (GeÖ)", "number": 134, "question": "Welche Faktoren können sich auf den Sauerstoffgehalt im Wasser sehr ungünstig auswirken?", "answers": ["Schlamm und hohe Wassertemperaturen", "Starker Lichteinfall", "Niedrige Wassertemperaturen im Winter"], "correct": [0], "page": 29, "lesson": 9}, {"id": 291, "section": "2. Gewässerökologie (GeÖ)", "number": 135, "question": "Was geschieht bei der Selbstreinigung des Gewässers?", "answers": ["Im Wasser befindlicher Unrat wird an Hindernissen zurückgehalten", "Im Wasser befindliche Schwebstoffe setzen sich in den ruhigen Zonen ab (Sedimentation)", "Organische Verbindungen werden durch verschiedene Organismen bei Sauerstoffverbrauch abgebaut"], "correct": [2], "page": 29, "lesson": 9}, {"id": 292, "section": "2. Gewässerökologie (GeÖ)", "number": 136, "question": "Bei einem pH-Wert von 7,0 reagiert das Wasser ...?", "answers": ["Schwach sauer", "Neutral", "Schwach alkalisch (basisch)"], "correct": [1], "page": 29, "lesson": 13}, {"id": 293, "section": "2. Gewässerökologie (GeÖ)", "number": 137, "question": "Pflanzen benötigen zum Wachsen ...?", "answers": ["Keine Nährstoffe", "Anorganische Nährstoffe", "Organische Nährstoffe"], "correct": [1], "page": 29, "lesson": 12}, {"id": 294, "section": "2. Gewässerökologie (GeÖ)", "number": 138, "question": "Bei welcher Wassertemperatur hat das Wasser die größte Dichte (das höchste spezifische Gewicht)?", "answers": ["Bei + 4 °C", "Bei 0 °C", "Bei -1 °C"], "correct": [0], "page": 29, "lesson": 10}, {"id": 295, "section": "2. Gewässerökologie (GeÖ)", "number": 139, "question": "Warum soll man in Krebsgewässer keine Aale einsetzen?", "answers": ["Weil sie Nahrungskonkurrenten für die Krebse sind", "Weil sie schlecht abwachsen", "Weil sie unter anderem die \"Butterkrebse\" fressen"], "correct": [2], "page": 29, "lesson": 15}, {"id": 296, "section": "2. Gewässerökologie (GeÖ)", "number": 140, "question": "Welcher Fisch lebt vorzugsweise in der Freiwasserzone eines Sees?", "answers": ["Brachsen", "Renke", "Hecht"], "correct": [1], "page": 30, "lesson": 10}, {"id": 297, "section": "2. Gewässerökologie (GeÖ)", "number": 141, "question": "Durch welche natürlichen Vorgänge kann der Sauerstoffgehalt in stehenden Gewässern unter das für Fische erträgliche Maß absinken?", "answers": ["Durch massenhaftes Ausschlüpfen von Wasserinsekten", "Durch Sauerstoffverbrauch bei Nacht infolge starker Pflanzenatmung (Dissimilation)", "Durch erhöhten Sauerstoffverbrauch beim Ablaichen der Fische"], "correct": [1], "page": 30, "lesson": 9}, {"id": 298, "section": "2. Gewässerökologie (GeÖ)", "number": 142, "question": "Welche Maßnahmen sind u. a. für den Schutz des Eisvogels erforderlich?", "answers": ["Besatz aller Gewässer mit kleinen Goldorfen", "Einbringen von Pfählen ins Wasser, damit der Vogel dort auf Beute lauern kann", "Erhaltung von Steilufern und weiträumiger Schutz der Nistbereiche"], "correct": [2], "page": 30, "lesson": 14}, {"id": 299, "section": "2. Gewässerökologie (GeÖ)", "number": 143, "question": "Beeinflusst die Wassertemperatur die Löslichkeit für Sauerstoff?", "answers": ["Nein", "Ja, kaltes Wasser nimmt mehr Sauerstoff auf als warmes Wasser", "Ja, warmes Wasser enthält mehr Sauerstoff auf als kaltes Wasser"], "correct": [1], "page": 30, "lesson": 9}, {"id": 300, "section": "2. Gewässerökologie (GeÖ)", "number": 144, "question": "Was zeigt das Vorkommen von Steinfliegenlarven in einem Fließgewässer an?", "answers": ["Geringen Sauerstoffgehalt und starke organische Belastung", "Niedrigen pH-Wert", "Hohe Gewässergüte"], "correct": [2], "page": 30, "lesson": 13}, {"id": 301, "section": "2. Gewässerökologie (GeÖ)", "number": 145, "question": "Welcher pH-Bereich ist für einheimische Fische gut geeignet?", "answers": ["3,5 bis 4,5", "6,5 bis 8,5", "9,5 bis 12"], "correct": [1], "page": 30, "lesson": 13}, {"id": 302, "section": "2. Gewässerökologie (GeÖ)", "number": 146, "question": "Welche Organismen reichern das Wasser mit Sauerstoff an?", "answers": ["Das pflanzliche Plankton (Phytoplankton)", "Muscheln und Schnecken", "Das tierische Plankton (Zooplankton)"], "correct": [0], "page": 30, "lesson": 9}, {"id": 303, "section": "2. Gewässerökologie (GeÖ)", "number": 147, "question": "Was bewirkt bei gleicher Temperatur des Wasserkörpers seine Umwälzung?", "answers": ["Sonnenstrahlung", "Die Eigendynamik des Wassers", "Der Wind"], "correct": [2], "page": 30, "lesson": 10}, {"id": 304, "section": "2. Gewässerökologie (GeÖ)", "number": 148, "question": "Welche Wasseruntersuchungen sollte ein Fischereiverein mindestens durchführen können?", "answers": ["Gesamt-Phosphor-Gehalt, Eisengehalt", "pH-Wert, Sauerstoffgehalt, Temperatur", "Stickstoff-, Chrom- und Ammoniakgehalt"], "correct": [1], "page": 30, "lesson": 13}, {"id": 305, "section": "2. Gewässerökologie (GeÖ)", "number": 149, "question": "Was ist als Erstes zu tun, wenn ein Fischsterben bemerkt wird?", "answers": ["Der Gewässereigentümer ist mit Einschreibebrief zu benachrichtigen", "Wasserproben entnehmen, Polizei und zuständige Wasserbehörde benachrichtigen", "Gar nichts, denn nur die Behörden sind berechtigt zu handeln"], "correct": [1], "page": 30, "lesson": 13}, {"id": 306, "section": "2. Gewässerökologie (GeÖ)", "number": 150, "question": "Welche Gewässer sind durch natürliche Säuren gefährdet?", "answers": ["Gewässer mit Zuflüssen aus kalkarmen Gebieten, Fichtenbeständen oder Mooren", "Steinbruchgewässer und Kiesgruben", "Zu stark mit Fischen besetzte Gewässer"], "correct": [0], "page": 30, "lesson": 13}, {"id": 307, "section": "2. Gewässerökologie (GeÖ)", "number": 151, "question": "Was versteht man unter dem Begriff der Gewässereutrophierung?", "answers": ["Die Anreicherung eines Gewässers mit Nährstoffen", "Die Temperaturschichtung von eisbedeckten Seen im Winter", "Einen wachsenden Überbestand an Weißfischen in einem Gewässer"], "correct": [0], "page": 30, "lesson": 13}, {"id": 308, "section": "2. Gewässerökologie (GeÖ)", "number": 152, "question": "Welches Wasser ist meist sauerstoffarm?", "answers": ["Quellwasser", "Teichwasser", "Flusswasser"], "correct": [0], "page": 31, "lesson": 9}, {"id": 309, "section": "2. Gewässerökologie (GeÖ)", "number": 153, "question": "Wann können pH-Werte über 9,0 in einem stehenden Gewässer auftreten?", "answers": ["Während der \"Wasserblüte\"", "Im Winter unter Eis", "Während der Vollzirkulation"], "correct": [0], "page": 31, "lesson": 13}, {"id": 310, "section": "2. Gewässerökologie (GeÖ)", "number": 154, "question": "Wodurch kann das biologische Gleichgewicht in Gewässern u. a. gestört werden?", "answers": ["Durch das Vorkommen von Raubfischen", "Durch einseitigen Fischbesatz", "Durch Verbot des Angelns mit Köderfischen"], "correct": [1], "page": 31, "lesson": 15}, {"id": 311, "section": "2. Gewässerökologie (GeÖ)", "number": 155, "question": "Womit beginnt die Nahrungskette in Gewässern?", "answers": ["Mit einzelligen Algen, mehrzelligen Algen und Unterwasserpflanzen", "Mit kleinen Fischarten", "Mit den Insektenlarven der Forellenregion"], "correct": [0], "page": 31, "lesson": 12}, {"id": 312, "section": "2. Gewässerökologie (GeÖ)", "number": 156, "question": "Ein Gewässer soll auf Säuregehalt, Sauerstoffgehalt, auf Nitrate und Phosphate untersucht werden. Ist das heute auch für den Laien möglich?", "answers": ["Nein, es sind erhebliche chemische Kenntnisse erforderlich", "Ja, u. a. Teststreifen und Indikatorpapiere ermöglichen einfachste Handhabung", "Nein, nur Sauerstoff lässt sich für Laien leicht nachweisen"], "correct": [1], "page": 31, "lesson": 13}, {"id": 313, "section": "2. Gewässerökologie (GeÖ)", "number": 157, "question": "Ist das Einbringen großer Mengen Anfuttermittel schädlich?", "answers": ["Nein, die Fische wachsen dadurch besser ab", "Nein, es wird ohne Folgen für das Gewässer zersetzt", "Ja, es fördert die Eutrophierung des Gewässers"], "correct": [2], "page": 31, "lesson": 15}, {"id": 314, "section": "2. Gewässerökologie (GeÖ)", "number": 158, "question": "Sauerstoff ist im Wasser für Fische, aber auch für andere Tiere und Pflanzen ein lebenswichtiger Grundstoff, der ständig benötigt wird, weil er ständig gebunden wird. Der Fachmann spricht von Sauerstoffzehrung. Was \"verbraucht\" denn ständig den Sauerstoff im Wasser?", "answers": ["Sauerstoff wird im Wasser gar nicht \"verbraucht\"", "Sauerstoff benötigen viele Tiere im Wasser zum Atmen, Bakterien zur Zersetzung", "Sauerstoff benötigen nur die Pflanzen"], "correct": [1], "page": 31, "lesson": 9}, {"id": 315, "section": "2. Gewässerökologie (GeÖ)", "number": 159, "question": "Haben die Pflanzennährstoffe in Gewässern fischereibiologische Bedeutung?", "answers": ["Ja, als Vorbedingung der Pflanzenentwicklung, diese ist Grundlage der Tierernährung", "Nein, sie haben keine Bedeutung, da sie für die Fische wertlos sind", "Ja, sie wirken auch in geringer Konzentration auf Fische nachteilig"], "correct": [0], "page": 31, "lesson": 12}, {"id": 316, "section": "2. Gewässerökologie (GeÖ)", "number": 160, "question": "In einem Gewässer stellen Sie in großen Mengen den rötlich aussehenden, kaum fünf Zentimeter langen Schlammröhrenwurm (Tubifex) fest. Welchen Schluss ziehen Sie daraus?", "answers": ["Das Wasser ist sauerstoffreich; es steht viel Nahrung zur Verfügung", "Belastung durch Verunreinigungen; nur dann tritt Tubifex in großen Mengen auf", "Daraus lässt sich kein Rückschluss auf die Wasserqualität ziehen"], "correct": [1], "page": 31, "lesson": 13}, {"id": 317, "section": "2. Gewässerökologie (GeÖ)", "number": 161, "question": "Eines der aufgeführten Gewässer ist als deutlich sauerstoffarm zu bewerten. Es ist ...?", "answers": ["Ein schattiger, verschlammter Tümpel ohne Wasserpflanzen", "Ein schnell fließender klarer Gebirgsbach", "Ein flacher Teich mit gutem Pflanzenwuchs, sandigem Untergrund und klarem Wasser"], "correct": [0], "page": 31, "lesson": 9}, {"id": 318, "section": "2. Gewässerökologie (GeÖ)", "number": 162, "question": "Gelangen Nährstoffe auch auf natürlichem Wege in das Wasser?", "answers": ["Ja, u. a. durch Nährsalze aus dem Boden und durch Zersetzung von Pflanzen", "Nein, Nährsalze sind auch nicht notwendig", "Nein, deshalb ist stets eine künstliche Düngung erforderlich"], "correct": [0], "page": 31, "lesson": 12}, {"id": 319, "section": "3. Rechtskunde (Rk)", "number": 1, "question": "An welchen wasserbaulichen Anlagen darf aufgrund fischereilicher Vorschriften grundsätzlich nicht geangelt werden?", "answers": ["An Schleusen und Anlegestellen.", "An künstlichen Ufern mit einem Höhenunterschied von mehr als 1 m zur Wasseroberfläche.", "An und in Fischwanderhilfen."], "correct": [2], "page": 33, "lesson": 18}, {"id": 320, "section": "3. Rechtskunde (Rk)", "number": 2, "question": "Dürfen Eingeweide geschlachteter Fische in das Gewässer geworfen werden?", "answers": ["Ja, dadurch wird der Nährstoffgehalt des Wassers angereichert.", "Nein, sie sind Abfall und müssen ordnungsgemäß entsorgt werden.", "Ja, sie erhöhen das Nahrungsangebot für Raubfische."], "correct": [1], "page": 33, "lesson": 19}, {"id": 321, "section": "3. Rechtskunde (Rk)", "number": 3, "question": "Dürfen Flusskrebse vorübergehend lebend aufbewahrt oder transportiert werden?", "answers": ["Ja, auf einer trockenen Unterlage in einem dunklen Behältnis.", "Ja, auf einer feuchten Unterlage in einem Transportbehältnis.", "Nein, sie sind stets unverzüglich zu töten."], "correct": [1], "page": 33, "lesson": 19}, {"id": 322, "section": "3. Rechtskunde (Rk)", "number": 4, "question": "Dürfen gemäß Waffengesetz beim Angeln stehende Messer mit mehr als 12 cm Klingenlänge mitgeführt werden?", "answers": ["Ja, das Waffengesetz enthält keine Vorschriften zu stehenden Messern.", "Nein, außerhalb von Gebäuden und umfriedeten Grundstücken sind stehende Messer nur bis zu einer Klingenlänge von 8,5 cm erlaubt.", "Ja, solche Messer dürfen bei Fischerei und Jagd geführt werden, sonst nur in verschlossenen Behältnissen."], "correct": [2], "page": 33, "lesson": 18}, {"id": 323, "section": "3. Rechtskunde (Rk)", "number": 5, "question": "Gelten in den Bundesländern einheitliche Mindestmaße und Schonzeiten?", "answers": ["Die Bundesländer können unterschiedliche Mindestmaße und Schonzeiten regeln.", "Schonzeiten gelten bundesweit einheitlich, Mindestmaße bestimmen die Bundesländer.", "Aus Gründen des Artenschutzes sind Mindestmaße und Schonzeiten überall in Deutschland einheitlich."], "correct": [0], "page": 33, "lesson": 17}, {"id": 324, "section": "3. Rechtskunde (Rk)", "number": 6, "question": "Ist Wettfischen verboten?", "answers": ["Ja, weil der „vernünftige Grund“ nach dem Tierschutzgesetz nicht gegeben ist.", "Nein, Wettfischen ist nur eine andere Bezeichnung für Gemeinschaftsfischen.", "Ja, weil die Ergebnisse zu Streit im Verein führen können."], "correct": [0], "page": 33, "lesson": 19}, {"id": 325, "section": "3. Rechtskunde (Rk)", "number": 7, "question": "Können Fische Schmerzen und Leid empfinden?", "answers": ["Fische können Leid empfinden. Ob Fische bewusst Schmerzen wahrnehmen können, ist nicht abschließend wissenschaftlich geklärt.", "Fische sind empfindungslos, sie kennen weder Schmerzen noch Leid oder Stress.", "Fische können Leid empfinden. Schmerzen nehmen sie gemäß den Ergebnissen der abgeschlossenen wissenschaftlichen Forschung überhaupt nicht wahr."], "correct": [0], "page": 33, "lesson": 16}, {"id": 326, "section": "3. Rechtskunde (Rk)", "number": 8, "question": "Können Fische Stress empfinden?", "answers": ["Fische empfinden Stress erheblich intensiver als andere Tiere, insbesondere Säugetiere.", "Fische können Stress empfinden, etwa beim Drill und bei der Hälterung.", "Fische sind empfindungslos, sie kennen weder Schmerzen noch Leid oder Stress."], "correct": [1], "page": 33, "lesson": 16}, {"id": 327, "section": "3. Rechtskunde (Rk)", "number": 9, "question": "Nach welchen Gesichtspunkten soll Angelgerät zusammengestellt werden?", "answers": ["Nach Zweckmäßigkeit und Tierschutz.", "Nach Fischereirecht und Kosten.", "Nach Zweckmäßigkeit und Kosten."], "correct": [0], "page": 33, "lesson": 16}, {"id": 328, "section": "3. Rechtskunde (Rk)", "number": 10, "question": "Wann soll der Anhieb beim Biss erfolgen?", "answers": ["Zwischen fünf und zehn Sekunden nach dem Biss, damit der Köder tief geschluckt wird.", "Der günstigste Zeitpunkt ist je nach Fischart verschieden.", "Unmittelbar nach dem Biss, um das zu tiefe Verschlucken des Köders zu vermeiden."], "correct": [2], "page": 34, "lesson": 16}, {"id": 329, "section": "3. Rechtskunde (Rk)", "number": 11, "question": "Warum ist die Kenntnis über die Lage des Fischgehirns notwendig?", "answers": ["Um den Schlag auf den Kopf bzw. Schädelknochen ausführen zu können und den Fisch tierschutzgerecht zu betäuben.", "Um den Fisch mit dem ersten Schlag tierschutzgerecht zu töten.", "Um mit einem gezielten Stich in den Kopf das schnelle Entbluten einzuleiten."], "correct": [0], "page": 34, "lesson": 16}, {"id": 330, "section": "3. Rechtskunde (Rk)", "number": 12, "question": "Warum kann bei dem Zurücksetzen aller gefangenen Fische ein Verstoß gegen das Tierschutzgesetz vorliegen?", "answers": ["Weil es zur guten anglerischen Praxis gehört, Fische mit tief geschlucktem Haken zu entnehmen und zu verwerten, unabhängig von der Größe und einer eventuellen Schonzeit.", "Weil gegebenenfalls kein vernünftiger Grund für die Ausübung der Angelfischerei nach dem Tierschutzgesetz vorliegt.", "Weil nur der Hegepflichtige darüber entscheiden darf, welche Fische zurückgesetzt werden."], "correct": [1], "page": 34, "lesson": 19}, {"id": 331, "section": "3. Rechtskunde (Rk)", "number": 13, "question": "Warum müssen ausgelegte Angeln ständig überwacht werden?", "answers": ["Um sicherzustellen, dass der Köder an der gewünschten Stelle im Gewässer bleibt.", "Damit die Rute in ihrer Position bleibt und ein gehakter Fisch ungehindert Schnur von der Rolle ziehen kann.", "Damit dem gehakten Fisch durch vergebliche Fluchtversuche unnötiges Leiden erspart bleibt."], "correct": [2], "page": 34, "lesson": 16}, {"id": 332, "section": "3. Rechtskunde (Rk)", "number": 14, "question": "Warum soll ein Fisch auf keinen Fall länger als notwendig lebend an der Luft gehalten werden?", "answers": ["Weil der Fisch sonst Stresshormone ausschüttet, die seine Verwertbarkeit als Lebensmittel herabsetzen.", "Weil Parasiten oder Krankheitserreger an und in den Fisch gelangen können.", "Weil der Fisch dabei unnötigen Stress erleidet und im schlimmsten Fall erstickt."], "correct": [2], "page": 34, "lesson": 16}, {"id": 333, "section": "3. Rechtskunde (Rk)", "number": 15, "question": "Warum soll ein gefangener Fisch nur mit nassen Händen angefasst werden?", "answers": ["Damit möglichst keine Krankheitserreger oder Parasiten auf den Fisch übertragen werden.", "Damit die schützende Schleimhaut des Fisches nicht geschädigt wird.", "Damit man den Fisch sicherer halten kann."], "correct": [1], "page": 34, "lesson": 16}, {"id": 334, "section": "3. Rechtskunde (Rk)", "number": 16, "question": "Was bedeutet Biotopschutz im Sinne des BNatSchG?", "answers": ["Als Biotopschutz bezeichnet man die generelle Pflicht, Natur und Landschaft zu schützen.", "Biotopschutz führt zu einem Verbot, in Brut- und Setzzeiten Wälder, naturnahe Wiesen und Gewässerrandstreifen zu betreten.", "Der Schutz von bestimmten Teilen der Natur und Landschaft, die besondere Bedeutung als Lebensraum haben."], "correct": [2], "page": 34, "lesson": 19}, {"id": 335, "section": "3. Rechtskunde (Rk)", "number": 17, "question": "Was bedeutet Hegepflicht?", "answers": ["Die Pflicht, die Vielfalt an Tier- und Pflanzenarten im Gewässer und am Ufer zu erhöhen.", "Die Pflicht, einen größtmöglichen Ertrag zu gewährleisten, der dem Bestand einer Art über einen unbestimmten Zeitraum entnommen werden kann.", "Die Pflicht zur Erhaltung und Förderung eines der Größe, Beschaffenheit und Ertragsfähigkeit des Gewässers angepassten artenreichen und gesunden standortgerechten Fischbestandes."], "correct": [2], "page": 34, "lesson": 19}, {"id": 336, "section": "3. Rechtskunde (Rk)", "number": 18, "question": "Was besagt § 1 Tierschutzgesetz?", "answers": ["Niemand darf einem Tier ohne einen vernünftigen Grund Schmerzen, Leiden oder Schäden zufügen.", "Niemand darf ohne Sachkunde ein Tier töten.", "Niemand darf ohne vernünftigen Grund Pflanzen, Tiere oder Lebensräume beeinträchtigen."], "correct": [0], "page": 35, "lesson": 16}, {"id": 337, "section": "3. Rechtskunde (Rk)", "number": 19, "question": "Was ist beim Fischen an Bundeswasserstraßen zu beachten?", "answers": ["Das Fischen ist nur von Booten mit Elektro- oder Verbrennungsmotor sowie vom Ufer aus gestattet.", "Die Schifffahrt darf durch das Fischen nicht beeinträchtigt werden.", "Das Fischen ist nur von verankerten oder sonst befestigten Booten sowie vom Ufer aus gestattet."], "correct": [1], "page": 35, "lesson": 18}, {"id": 338, "section": "3. Rechtskunde (Rk)", "number": 20, "question": "Was ist ein Fischereipachtvertrag?", "answers": ["Der Vertrag zwischen jedem einzelnen Angler oder Fischer mit dem Fischereiberechtigten, über den das Recht zum Fischfang für einen bestimmten Zeitraum übertragen wird.", "Im Gegensatz zu einem Fischereivertrag regelt ein Fischereipachtvertrag auch die Nutzung der Ufer und angrenzenden Landflächen.", "Ein Vertrag zur befristeten Übertragung eines Fischereirechts auf einen Pächter."], "correct": [2], "page": 35, "lesson": 18}, {"id": 339, "section": "3. Rechtskunde (Rk)", "number": 21, "question": "Was ist vor dem Befahren von Gewässern mit Wasserfahrzeugen zu beachten?", "answers": ["Es können Rechtsvorschriften bestehen, die das Befahren einschränken oder untersagen.", "Das Fischen ist nur von verankerten oder sonst befestigten Booten aus gestattet.", "Nur für Boote mit Elektro- oder Verbrennungsmotor benötigt man eine Erlaubnis des Gewässereigentümers oder Fischereipächters."], "correct": [0], "page": 35, "lesson": 18}, {"id": 340, "section": "3. Rechtskunde (Rk)", "number": 22, "question": "Was muss neben den fischereirechtlichen Vorschriften beim Fischen ggf. besonders berücksichtigt werden?", "answers": ["Bestimmungen zum Artenschutz und Tierschutz, um geschützte Arten zu erkennen und gefangene Fische sachgerecht zu behandeln.", "Die landwirtschaftliche Nutzung der gewässerangrenzenden Flächen, um Schäden insbesondere im Pflanzenbau zu vermeiden.", "Bestimmungen zum Jagdrecht, weil jedes Gewässer zu einem Jagdbezirk gehört."], "correct": [0], "page": 35, "lesson": 16}, {"id": 341, "section": "3. Rechtskunde (Rk)", "number": 23, "question": "Was müssen Angler und Fischer beachten?", "answers": ["Das Töten von Tieren ist in der Öffentlichkeitswahrnehmung ein sensibles und kontrovers diskutiertes Thema und sollte stets verantwortungsvoll erfolgen.", "Ein jüngerer Angler sollte sich immer am Verhalten älterer Angler mit mehr Erfahrung orientieren.", "Andere Personen sollten nicht erkennen können, wie viele Fische man gefangen hat und dem Gewässer entnimmt."], "correct": [0], "page": 35, "lesson": 16}, {"id": 342, "section": "3. Rechtskunde (Rk)", "number": 24, "question": "Was sind Tagesfangbegrenzungen (Baglimits)?", "answers": ["Begrenzung der Fangmenge in Kilogramm je Tag und Angler für eine bestimmte Fischart.", "Begrenzung der Stückzahl je Tag und Angler für eine bestimmte Fischart.", "Begrenzung der Fangtage je Angler für eine bestimmte Fischart."], "correct": [1], "page": 35, "lesson": 17}, {"id": 343, "section": "3. Rechtskunde (Rk)", "number": 25, "question": "Was verlangt die Wasserrahmenrichtlinie (Richtlinie 2000/60/EG) der EU?", "answers": ["Die Erreichung eines guten ökologischen und chemischen Zustands von natürlichen Oberflächengewässern bzw. des guten ökologischen Potenzials in stark veränderten oder künstlichen Oberflächengewässern.", "Oberflächengewässer sauerstoff- und nährstoffreich zu halten, um so die Artenvielfalt zu erhöhen.", "Einen dem Gewässer angepassten artenreichen, heimischen und gesunden Tier- und Pflanzenbestand aufzubauen und zu erhalten."], "correct": [0], "page": 35, "lesson": 19}, {"id": 344, "section": "3. Rechtskunde (Rk)", "number": 26, "question": "Was versteht man im Fischereirecht unter dem Begriff ganzjährige Schonzeit?", "answers": ["Zum Schutz der Pflanzen- und Tierwelt darf das Ufer eines Gewässers nicht betreten werden.", "Die Fischart darf nicht gezielt befischt werden.", "Das Gewässer darf nicht befischt werden."], "correct": [1], "page": 36, "lesson": 17}, {"id": 345, "section": "3. Rechtskunde (Rk)", "number": 27, "question": "Was versteht man im Fischereirecht unter dem Begriff Mindestmaß?", "answers": ["Die Größe, die eine Fischart erreicht haben muss, um nicht mehr entnommen werden zu dürfen.", "Die Größe, die eine Fischart erreicht haben muss, um entnommen werden zu dürfen.", "Die Größe, die eine Fischart erreicht haben muss, um besetzt werden zu dürfen."], "correct": [1], "page": 36, "lesson": 17}, {"id": 346, "section": "3. Rechtskunde (Rk)", "number": 28, "question": "Was versteht man im Fischereirecht unter dem Begriff Schonzeit?", "answers": ["Die Zeit, in der ein Gewässer nicht befischt werden darf.", "Die Zeit, in der aus Hegegründen keine Erlaubnisscheine ausgegeben werden.", "Die Zeit, in der eine Fischart nicht gezielt befischt werden darf."], "correct": [2], "page": 36, "lesson": 17}, {"id": 347, "section": "3. Rechtskunde (Rk)", "number": 29, "question": "Was versteht man im Wasserrecht unter dem Begriff Gemeingebrauch?", "answers": ["Das allen zustehende Recht, Gewässer ohne besondere Erlaubnis in einem bestimmten Ausmaß zu nutzen.", "Der Begriff umfasst alle in dem Gewässer verbotenen Handlungen.", "Gemeingebrauch sind Handlungen, die erlaubt sind, wenn ein gültiger Fischereischein und ein Erlaubnisschein vorliegen."], "correct": [0], "page": 36, "lesson": 18}, {"id": 348, "section": "3. Rechtskunde (Rk)", "number": 30, "question": "Was versteht man unter nachhaltiger Fischerei?", "answers": ["Die Abschöpfung des natürlichen Fischertrages ohne Beeinträchtigung der Erhaltungsfähigkeit der Bestände.", "Eine übermäßige Fischerei, die ohne Besatz zum Zusammenbruch der Bestände führt.", "Eine Fischerei, bei der genau die Menge entnommener Fisch durch Besatz wieder aufgefüllt wird."], "correct": [0], "page": 36, "lesson": 19}, {"id": 349, "section": "3. Rechtskunde (Rk)", "number": 31, "question": "Welche Anforderungen sind an das Betäuben und Töten von Fischen gestellt?", "answers": ["Fische betäuben und töten darf nur, wer seit mindestens sechs Monaten einen Fischereischein besitzt.", "Der Nachweis der Sachkunde (Kenntnisse und Fähigkeiten).", "Fische betäuben und töten darf nur, wer einen gültigen Fischereischein besitzt."], "correct": [1], "page": 36, "lesson": 16}, {"id": 350, "section": "3. Rechtskunde (Rk)", "number": 32, "question": "Welche Art des Angelns ist verboten?", "answers": ["Wettfischen", "Hegefischen.", "Gemeinschaftsfischen."], "correct": [0], "page": 36, "lesson": 19}, {"id": 351, "section": "3. Rechtskunde (Rk)", "number": 33, "question": "Welche Auswirkungen hat ein Schutzgebiet auf die Fischerei?", "answers": ["Fischereierlaubnisscheine sind wegen höherer Kosten für Naturschutz in der Regel teurer.", "Die Fischereiausübung kann eingeschränkt oder verboten sein.", "In Schutzgebieten ist stets jegliche Form der Fischerei verboten."], "correct": [1], "page": 36, "lesson": 19}, {"id": 352, "section": "3. Rechtskunde (Rk)", "number": 34, "question": "Welche Eigentumsverhältnisse liegen bei Fischen in offenen Gewässern vor?", "answers": ["Sie gehören dem Grundstückseigentümer.", "Sie sind herrenlos.", "Sie gehören dem Grundstückseigentümer, wenn das Gewässer höchstens 3 Hektar groß ist. Bei größeren Wasserflächen sind sie herrenlos."], "correct": [1], "page": 36, "lesson": 18}, {"id": 353, "section": "3. Rechtskunde (Rk)", "number": 35, "question": "Welche Einschränkungen bei Freischneidearbeiten an Gewässern und auf anderen Flächen sind gemäß BNatSchG zu beachten?", "answers": ["Das Gebot, in der Zeit vom 1. März bis 31. August nur handbetriebene Werkzeuge oder Maschinen mit Elektromotoren zu nutzen.", "Das Gebot, in der Zeit vom 1. Oktober bis 31. März die geschützten Flächen höchstens in Kleingruppen bis drei Personen zu betreten.", "Das grundsätzliche Verbot, Gehölze sowie Röhrichte in der Zeit vom 1. März bis 30. September zu schneiden oder zu beseitigen."], "correct": [2], "page": 37, "lesson": 19}, {"id": 354, "section": "3. Rechtskunde (Rk)", "number": 36, "question": "Welche Fanggeräte sind nach dem Fischereirecht grundsätzlich verboten?", "answers": ["Schlepp- und Zugnetze.", "Reusen und Langleinen.", "Schlingen, Reißangeln, Harpunen."], "correct": [2], "page": 37, "lesson": 18}, {"id": 355, "section": "3. Rechtskunde (Rk)", "number": 37, "question": "Welche Fische dürfen ohne vorherige Betäubung getötet werden?", "answers": ["Alle Karpfenartigen.", "Aale und Plattfische.", "Nur Aale."], "correct": [1], "page": 37, "lesson": 16}, {"id": 356, "section": "3. Rechtskunde (Rk)", "number": 38, "question": "Welche Flächen sind geschützte Biotope im Sinne des BNatSchG?", "answers": ["Naturnahe Bereiche fließender und stehender Binnengewässer einschließlich ihrer Vegetation.", "Kiesgruben und andere gewerbliche Flächen, von denen Teilbereiche zur Entwicklung einer Tier- und Pflanzenwelt aus der Nutzung genommen werden müssen.", "Dauerhaft nicht mehr genutzte landwirtschaftliche Flächen, die sich naturnah entwickeln sollen."], "correct": [0], "page": 37, "lesson": 19}, {"id": 357, "section": "3. Rechtskunde (Rk)", "number": 39, "question": "Welche Pflicht ist mit dem Fischereirecht verbunden?", "answers": ["Die Pflicht, regelmäßig Raubfische aus dem Gewässer zu entnehmen.", "Die Hegepflicht.", "Die Pflicht, regelmäßig den Fischfang auszuüben."], "correct": [1], "page": 37, "lesson": 19}, {"id": 358, "section": "3. Rechtskunde (Rk)", "number": 40, "question": "Welche rechtlichen Folgen kann das Veröffentlichen von Fotos lebender Fische z.B. über soziale Netzwerke haben, auf denen der Augendrehreflex sichtbar ist?", "answers": ["Es kann als Verstoß gegen das Tierschutzgesetz angezeigt werden.", "Es kann zu einem Bußgeld führen, weil das Fotografieren lebender Fische nach dem Fischereigesetz nur unter Wasser erlaubt ist.", "Es kann zu einer Nachfrage des Kreisveterinäramtes führen, weil der Augendrehreflex Hinweis auf eine Fischkrankheit ist."], "correct": [0], "page": 37, "lesson": 16}, {"id": 359, "section": "3. Rechtskunde (Rk)", "number": 41, "question": "Welche Reihenfolge der Hilfsmittel ist bei der waidgerechten Entnahme zur Verwertung richtig?", "answers": ["Landehilfe (z.B. Kescher), Hakenlöser/Hakenlösezange, Maßband, Schlagholz, scharfes Messer", "Landehilfe (z.B. Kescher), Schlagholz, scharfes Messer, Waage, Hakenlöser/Hakenlösezange", "Landehilfe (z. B. Kescher), Maßband, Schlagholz, scharfes Messer, Hakenlöser/Hakenlösezange"], "correct": [2], "page": 37, "lesson": 16}, {"id": 360, "section": "3. Rechtskunde (Rk)", "number": 42, "question": "Welche Reihenfolge ist beim Töten eines Fisches richtig?", "answers": ["Betäuben durch einen Schlag und Entbluten des Fisches durch einen Kiemenrundschnitt oder einen Herzstich (außer Aale und Plattfische).", "Betäuben durch einen Schlag, einen die Wirbelsäule durchtrennenden Stich setzen und den Fisch sofort ausnehmen.", "Kiemenrundschnitt oder Herzstich zum Betäuben und Entbluten setzen (außer Aale und Neunaugen)"], "correct": [0], "page": 37, "lesson": 16}, {"id": 361, "section": "3. Rechtskunde (Rk)", "number": 43, "question": "Welche Verordnung muss beim Betäuben und Töten von Fischen beachtet werden?", "answers": ["Bundeswildschutzverordnung", "Bundesartenschutzverordnung", "Tierschutz-Schlachtverordnung."], "correct": [2], "page": 38, "lesson": 16}, {"id": 362, "section": "3. Rechtskunde (Rk)", "number": 44, "question": "Welchen Hintergrund hat die Einführung von Tagesfangbegrenzungen (Baglimits)?", "answers": ["Hegemethode zur nachhaltigen anglerischen Nutzung von Fischbeständen", "Methode zur Festlegung bestimmter Arten, die an einem Tag in dem Gewässer gefangen werden dürfen.", "Methode zur Begrenzung der Zahl an Anglern je Gewässer."], "correct": [0], "page": 38, "lesson": 17}, {"id": 363, "section": "3. Rechtskunde (Rk)", "number": 45, "question": "Welcher tierschutzrechtliche Grundsatz gilt für die Fischerei?", "answers": ["Über einen Erlaubnisschein können die Vorschriften des Tierschutzgesetzes eingeschränkt werden.", "Keinem Tier dürfen ohne vernünftigen Grund Schmerzen, Leiden oder Schäden zugefügt werden.", "Das Tierschutzgesetz gilt nur für Säugetiere."], "correct": [1], "page": 38, "lesson": 16}, {"id": 364, "section": "3. Rechtskunde (Rk)", "number": 46, "question": "Welches Hilfsmittel wird zum waidgerechten Betäuben des Fisches benutzt?", "answers": ["Ein scharfkantiger Gegenstand.", "Ein möglichst schwerer Gegenstand jeglicher Art.", "Ein geeigneter stumpfer Gegenstand wie ein Schlagholz."], "correct": [2], "page": 38, "lesson": 16}, {"id": 365, "section": "3. Rechtskunde (Rk)", "number": 47, "question": "Welches Hilfsmittel wird zur waidgerechten Tötung des Fisches benutzt?", "answers": ["Jeder scharfkantige Gegenstand ist geeignet.", "Ein möglichst schweres Schlagholz.", "Ein geeignetes scharfes Messer."], "correct": [2], "page": 38, "lesson": 16}, {"id": 366, "section": "3. Rechtskunde (Rk)", "number": 48, "question": "Wie müssen Aale getötet werden?", "answers": ["Durch einen Stich in das Gehirn.", "Durch einen die Wirbelsäule durchtrennenden Stich direkt hinter dem Kopf und sofortiges Herausnehmen der Eingeweide einschließlich des Herzens.", "Durch Kiemenrundschnitt oder Herzstich."], "correct": [1], "page": 38, "lesson": 16}, {"id": 367, "section": "3. Rechtskunde (Rk)", "number": 49, "question": "Wie müssen Plattfische tierschutzgerecht getötet werden?", "answers": ["Durch einen kräftigen Schlag auf das Nachhirn.", "Durch einen schnellen Schnitt, der die Kehle und die Wirbelsäule durchtrennt.", "Durch einen Stich in das Gehirn."], "correct": [1], "page": 38, "lesson": 16}, {"id": 368, "section": "3. Rechtskunde (Rk)", "number": 50, "question": "Wie soll das Anlanden mittlerer und großer Fische erfolgen?", "answers": ["Mit einem Senknetz (Senke).", "Mit einem Wurfnetz.", "Mit einem Unterfangkescher."], "correct": [2], "page": 38, "lesson": 16}, {"id": 369, "section": "3. Rechtskunde (Rk)", "number": 51, "question": "Wie soll der Drill eines Fisches erfolgen?", "answers": ["Angelschnur möglichst lose lassen, um die Gefahr eines Schnurbruches gering zu halten.", "Angelschnur stets unter Spannung und den Drill so kurz wie möglich halten, ohne dass die Schnur reißt.", "Angelschnur abwechselnd lose und unter Spannung halten, um den Drill abwechslungsreich zu gestalten."], "correct": [1], "page": 38, "lesson": 16}, {"id": 370, "section": "3. Rechtskunde (Rk)", "number": 52, "question": "Wie soll ein Fisch, der nicht entnommen wird, behandelt werden?", "answers": ["Der Fisch muss mit möglichst trockenen Händen sicher ergriffen, abgehakt, bis zum Ende des Fangtages gehältert und dann zurückgesetzt werden.", "Der Fisch muss zügig abgehakt und für die Fangstatistik gemessen, gewogen sowie möglichst fotografiert werden.", "Der Fisch muss vorsichtig mit nassen Händen abgehakt und wieder in das Fanggewässer zurückgesetzt werden."], "correct": [2], "page": 38, "lesson": 16}, {"id": 371, "section": "3. Rechtskunde (Rk)", "number": 53, "question": "Wo sind die Schonmaße rechtlich geregelt?", "answers": ["Innerhalb des Hoheitsgebietes in Fischereiverordnungen der Bundesländer, außerhalb in unmittelbar geltenden EU-Verordnungen.", "Für heimische Arten im Fischereigesetz, für nichtheimische Arten in der Artenschutzverordnung.", "In den jeweiligen Fischereigesetzen und Fischereiverordnungen der Länder oder im unmittelbar geltenden EU-Recht."], "correct": [2], "page": 39, "lesson": 17}, {"id": 372, "section": "3. Rechtskunde (Rk)", "number": 54, "question": "Wo sind die Schonzeiten rechtlich geregelt?", "answers": ["Vorrangig in den Fischereigesetzen und Fischereiverordnungen der Bundesländer, ergänzend in unmittelbar geltenden Vorschriften der EU und des Bundes", "Für heimische Arten im Fischereigesetz, für nichtheimische Arten in der Artenschutzverordnung.", "Innerhalb des Hoheitsgebietes in Fischereiverordnungen der Bundesländer, außerhalb in unmittelbar geltenden EU-Verordnungen."], "correct": [0], "page": 39, "lesson": 17}, {"id": 373, "section": "3. Rechtskunde (Rk)", "number": 55, "question": "Wo soll der Fischfang aus Gründen des Tierschutzes unterbleiben?", "answers": ["An Orten, an denen das sichere Anlanden eines Fisches nicht möglich ist.", "An sehr flachen Stellen.", "An Stellen mit hohem Wellengang."], "correct": [0], "page": 39, "lesson": 16}, {"id": 374, "section": "3. Rechtskunde (Rk)", "number": 56, "question": "Woran ist zu erkennen, dass ein Fisch tierschutzgerecht betäubt ist?", "answers": ["Am Ausbleiben des Augendrehreflexes.", "An unregelmäßigen oder fehlenden Bewegungen der Kiemendeckel.", "An nur schwachen oder fehlenden Bewegungen der Flossen."], "correct": [0], "page": 39, "lesson": 16}, {"id": 375, "section": "3. Rechtskunde (Rk)", "number": 57, "question": "Worüber muss man sich vor dem Fischfang unbedingt informieren?", "answers": ["Über die in dem Gewässer sowie am Ufer lebenden geschützten Tier- und Pflanzenarten.", "Über das Wetter, insbesondere Windstärke und Niederschlagsmenge, sowie die Gewässerstruktur.", "Über die vor Ort geltenden fischereirechtlichen und sonstigen Rechtsvorschriften, insbesondere Schonbestimmungen für Fische."], "correct": [2], "page": 39, "lesson": 17}, {"id": 376, "section": "3. Rechtskunde (Rk)", "number": 58, "question": "Wozu ermächtigt das Fischereirecht?", "answers": ["Zur Aneignung an zuvor herrenlosen Fischen.", "Zur Aneignung an Fischen, Muscheln, Schnecken und Wasserpflanzen im Rahmen des Erlaubnisscheines.", "Zur Aneignung von Fischen, die zuvor dem Grundstückseigentümer gehörte"], "correct": [0], "page": 39, "lesson": 18}, {"id": 377, "section": "3. Rechtskunde (Rk)", "number": 59, "question": "Bedarf ein Fischereipachtvertrag der Schriftform?", "answers": ["Nein", "Ja", "Nur wenn er für mehr als 12 Monate abgeschlossen wird"], "correct": [1], "page": 39, "lesson": 18}, {"id": 378, "section": "3. Rechtskunde (Rk)", "number": 60, "question": "Darf ein Angler mit einem PKW generell an seinen Angelplatz fahren?", "answers": ["Ja, wenn es sich um eine für den allgemeinen Straßenverkehr gewidmete Straße handelt", "Ja immer, da ein Fischer wie ein Landwirt auch gesperrte Wege befahren darf", "Nein, da niemand näher als 10 m an ein Gewässer fahren darf"], "correct": [0], "page": 39, "lesson": 18}, {"id": 379, "section": "3. Rechtskunde (Rk)", "number": 61, "question": "Wer darf auf überfluteten Grundstücken fischen?", "answers": ["Der Grundstückseigentümer und seine direkten Nachbarn", "Alle Bewohner der betreffenden Gemeinde", "Der Fischereiausübungsberechtigte und seine Helfer"], "correct": [2], "page": 39, "lesson": 18}, {"id": 380, "section": "3. Rechtskunde (Rk)", "number": 62, "question": "Welche Fischart darf das ganze Jahr gefangen und entnommen werden?", "answers": ["Die Schleie", "Der Kaulbarsch", "Die Nase"], "correct": [1], "page": 39, "lesson": 17}, {"id": 381, "section": "3. Rechtskunde (Rk)", "number": 63, "question": "Welches Entnahmemaß gilt für Hechte?", "answers": ["50 - 90 cm", "60 - 100 cm", "35 - 85 cm"], "correct": [0], "page": 40, "lesson": 17}, {"id": 382, "section": "3. Rechtskunde (Rk)", "number": 64, "question": "In welcher Breite darf ein Fließgewässer durch Aalreusen abgesperrt werden?", "answers": ["In nicht mehr als halber Breite", "In ganzer Breite", "Aalreusen dürfen in Fließgewässern überhaupt nicht aufgestellt werden"], "correct": [0], "page": 40, "lesson": 18}, {"id": 383, "section": "3. Rechtskunde (Rk)", "number": 65, "question": "Dürfen Fische aus dem Setzkescher wieder zurück ins Wasser gesetzt werden?", "answers": ["Nur Weißfische", "Ja", "Nein"], "correct": [2], "page": 40, "lesson": 19}, {"id": 384, "section": "3. Rechtskunde (Rk)", "number": 66, "question": "Wann darf der Edelkrebs / Flusskrebs gefangen werden?", "answers": ["Vom 01.12. bis 31.01.", "Wenn er sich häutet", "Gar nicht, er unterliegt einem Fang- und Entnahmeverbot"], "correct": [2], "page": 40, "lesson": 17}, {"id": 385, "section": "3. Rechtskunde (Rk)", "number": 67, "question": "Darf der Angler eine am 01.11. gefangene, 24 cm große Regenbogenforelle entnehmen?", "answers": ["Ja", "Nein", "Nur aus einem Baggersee"], "correct": [0], "page": 40, "lesson": 17}, {"id": 386, "section": "3. Rechtskunde (Rk)", "number": 68, "question": "Darf man in Fließgewässern der Forellenregion Bachsaiblinge besetzen?", "answers": ["Nein, der Besatz von Bachsaiblingen in Fließgewässern der Forellenregion ist verboten", "Ja, wenn dort keine Groppen vorkommen", "Ja, wenn man keine Aale besetzt"], "correct": [0], "page": 40, "lesson": 19}, {"id": 387, "section": "3. Rechtskunde (Rk)", "number": 69, "question": "Welches Alter muss ein Jugendlicher haben, um ohne Fischereischein, aber mit gezahlter Fischereiabgabe fischen zu dürfen?", "answers": ["Jugendliche zwischen 10 und 16 Jahren", "Jugendliche zwischen 6 und 14 Jahren", "Jugendliche zwischen 12 und 18 Jahren"], "correct": [0], "page": 40, "lesson": 18}, {"id": 388, "section": "3. Rechtskunde (Rk)", "number": 70, "question": "Darf ein Angler grundsätzlich Kormorane, die sein Fischereirecht beeinträchtigen, mit der Schrotflinte abschießen?", "answers": ["Ja, immer", "Nur in der Zeit vom 15.08. bis 15.10.", "Nein"], "correct": [2], "page": 40, "lesson": 18}, {"id": 389, "section": "3. Rechtskunde (Rk)", "number": 71, "question": "Sind gemeinschaftliche Fischen zur Erzielung von Geldpreisen verboten?", "answers": ["Nur an Fließgewässern", "An allen Gewässern", "Nur an Angelteichen"], "correct": [1], "page": 40, "lesson": 18}, {"id": 390, "section": "3. Rechtskunde (Rk)", "number": 72, "question": "Welcher Fisch hat in Hessen ein Entnahmemaß von 30 bis 45 cm?", "answers": ["Die Äsche", "Die Bachforelle", "Der Bachsaibling"], "correct": [0], "page": 40, "lesson": 17}, {"id": 391, "section": "3. Rechtskunde (Rk)", "number": 73, "question": "Welche fischereiliche Maßnahme bedarf der behördlichen Genehmigung?", "answers": ["Das Aufstellen von Reusen", "Das Fischen mit Zugnetzen", "Die Elektrofischerei"], "correct": [2], "page": 40, "lesson": 18}, {"id": 392, "section": "3. Rechtskunde (Rk)", "number": 74, "question": "Wie ist ein Krebs tierschutzgerecht zu töten?", "answers": ["Durch Betäuben und sofortiges Ausnehmen", "Durch einzelnes Einwerfen in stark kochendes Wasser", "Durch Einwerfen in kaltes Wasser und dessen langsame Erhitzung"], "correct": [1], "page": 40, "lesson": 16}, {"id": 393, "section": "3. Rechtskunde (Rk)", "number": 75, "question": "Hechte ernähren sich auch von Fröschen. Dürfen Sie Teich- oder Wasserfrösche als Köder verwenden?", "answers": ["Nein, alle einheimischen Froscharten sind in allen Stadien besonders geschützt", "Ja, aber nur Wasserfrösche und keine Frösche, die an Land gefangen werden", "Ja, aber da Frösche Wirbeltiere sind, nur als tote Köderfrösche"], "correct": [0], "page": 41, "lesson": 19}, {"id": 394, "section": "3. Rechtskunde (Rk)", "number": 76, "question": "Wie hoch kann die Geldbuße ausfallen, wenn ein Angler im Juli einen Gründling fängt und entnimmt?", "answers": ["Gar keine Geldbuße", "Bis zu 3.000 EUR", "Bis zu 10.000 EUR"], "correct": [0], "page": 41, "lesson": 17}, {"id": 395, "section": "3. Rechtskunde (Rk)", "number": 77, "question": "Was sind verbotene Fangmittel?", "answers": ["Senknetze", "Aalreusen", "Harpunen"], "correct": [2], "page": 41, "lesson": 18}, {"id": 396, "section": "3. Rechtskunde (Rk)", "number": 78, "question": "Wie wird ein Fisch fischwaidgerecht getötet?", "answers": ["Am besten gar nicht, der Fisch zappelt sich schon tot", "Durch einen gezielten Schlag auf den Hinterkopf", "Durch einen Schlag auf den Gehirnschädel und Herzstich"], "correct": [2], "page": 41, "lesson": 16}, {"id": 397, "section": "3. Rechtskunde (Rk)", "number": 79, "question": "Ein Aquarienhändler kann seine Fische nicht mehr füttern und verbringt sie in den nächsten Fluss. Darf er das?", "answers": ["Nein", "Ja", "Nur mit Zustimmung des Angelvereins"], "correct": [0], "page": 41, "lesson": 19}, {"id": 398, "section": "3. Rechtskunde (Rk)", "number": 80, "question": "Darf der Fischereiausübungsberechtigte das Ufer an einem Campingplatz betreten?", "answers": ["Ja", "Nein", "Nur mit Genehmigung des Campingplatzbetreibers"], "correct": [0], "page": 41, "lesson": 18}, {"id": 399, "section": "3. Rechtskunde (Rk)", "number": 81, "question": "Wann ist ein Eigentumsfischereirecht gegeben?", "answers": ["Wenn das Fischereirecht dem Gewässereigentümer zusteht", "Wenn der Angelverein Pächter ist", "Wenn das Fischereirecht nicht dem Gewässereigentümer zusteht"], "correct": [0], "page": 41, "lesson": 18}, {"id": 400, "section": "3. Rechtskunde (Rk)", "number": 82, "question": "Welche Fangbeschränkungen gelten für den Barsch?", "answers": ["Schonzeit 01.03. bis 15.05.", "Entnahmemaß 20 - 50 cm", "Keine"], "correct": [2], "page": 41, "lesson": 17}, {"id": 401, "section": "3. Rechtskunde (Rk)", "number": 83, "question": "Gemeinschaftliches Fischen ist eine Veranstaltung, deren Zeitpunkt, Ort und Dauer durch Ausschreibung, Aushang oder sonstige Bekanntmachung vom Veranstalter festgelegt wird.", "answers": ["Mindestens 5 Personen", "Mindestens 100 Personen", "Mindestens 7 Personen"], "correct": [2], "page": 41, "lesson": 18}, {"id": 402, "section": "3. Rechtskunde (Rk)", "number": 84, "question": "Der amtlich verpflichtete Fischereiaufseher darf …?", "answers": ["Einen Fischwilderer verhaften", "Die Personalien eines Fischwilderers feststellen", "Den PKW eines Fischerwilderers vorläufig beschlagnahmen"], "correct": [1], "page": 41, "lesson": 18}, {"id": 403, "section": "3. Rechtskunde (Rk)", "number": 85, "question": "Wer darf Fischereipachtverträge abschließen?", "answers": ["Nur der Landesfischereiverband", "Nur ein Angelverein", "Natürliche oder juristische Personen nach § 15 Abs. 2 HFischG"], "correct": [2], "page": 41, "lesson": 18}, {"id": 404, "section": "3. Rechtskunde (Rk)", "number": 86, "question": "In welchem Alter kann ein Jugendlicher ohne Fischereischein, aber mit gezahlter Fischereiabgabe angeln?", "answers": ["Zwischen 6 und 14 Jahren", "Zwischen 10 und 16 Jahren", "Zwischen 12 und 18 Jahren"], "correct": [1], "page": 42, "lesson": 18}, {"id": 405, "section": "3. Rechtskunde (Rk)", "number": 87, "question": "Was sind Fische im Sinne des Hessischen Fischereigesetzes?", "answers": ["Fische, Krebse und Molche", "Nur Fische", "Fische, Neunaugen, Krebse und Muscheln"], "correct": [2], "page": 42, "lesson": 18}, {"id": 406, "section": "3. Rechtskunde (Rk)", "number": 88, "question": "Darf ein Fließgewässer der Forellenregion mit Regenbogenforellen besetzt werden?", "answers": ["Ja", "Nein", "Nur mit Genehmigung der Fischereigenossenschaft"], "correct": [1], "page": 42, "lesson": 19}, {"id": 407, "section": "3. Rechtskunde (Rk)", "number": 89, "question": "Ein Dreizehnjähriger fischt ohne Begleitung eines volljährigen Fischereischeininhabers ohne Fischereischein, aber mit gezahlter Fischereiabgabe. Darf er das?", "answers": ["Nein", "Ja", "Nur an einem Angelteich"], "correct": [0], "page": 42, "lesson": 18}, {"id": 408, "section": "3. Rechtskunde (Rk)", "number": 90, "question": "Ist der Fisch ein Wirbeltier?", "answers": ["Ja", "Nein", "Nur die Wale"], "correct": [0], "page": 42, "lesson": 16}, {"id": 409, "section": "3. Rechtskunde (Rk)", "number": 91, "question": "Gilt das Tierschutzgesetz auch für Fische?", "answers": ["Nein, es gilt ausschließlich das Fischereigesetz", "Ja, aber nur während der Schonzeit", "Ja"], "correct": [2], "page": 42, "lesson": 16}, {"id": 410, "section": "3. Rechtskunde (Rk)", "number": 92, "question": "Ist in Naturschutzgebieten das Angeln immer verboten?", "answers": ["Ja", "Nein, der Vorstand des Angelvereins kann Ausnahmen zulassen", "Das ergibt sich aus der Naturschutzgebietsverordnung"], "correct": [2], "page": 42, "lesson": 19}, {"id": 411, "section": "3. Rechtskunde (Rk)", "number": 93, "question": "Kann es sinnvoll sein, in Naturschutzgebieten das Angeln zu beschränken?", "answers": ["Ja, wenn der Schutzzweck nur so zu erreichen und die Hege gewährleistet ist", "Nein, in Naturschutzgebieten wachsen die größten Hechte heran", "Nein, auch unter der Wasseroberfläche leben Tierarten"], "correct": [0], "page": 42, "lesson": 19}, {"id": 412, "section": "3. Rechtskunde (Rk)", "number": 94, "question": "Welcher Fisch hat eine Schonzeit, obwohl er nicht in unseren Gewässern laicht?", "answers": ["Flussbarsch", "Bachsaibling", "Europäischer Aal"], "correct": [2], "page": 42, "lesson": 17}, {"id": 413, "section": "4. Gerätekunde (Gk)", "number": 1, "question": "Für welche Angelmethoden ist die Stationärrolle nicht geeignet?", "answers": ["Fliegenfischen", "Spinnfischen", "Meeresangeln"], "correct": [0], "page": 43, "lesson": 20}, {"id": 414, "section": "4. Gerätekunde (Gk)", "number": 2, "question": "Wann ist der Einsatz einer Laufpose einer Feststellpose vorzuziehen?", "answers": ["Wenn Tiefe und Rutenläge gleich sind.", "Wenn in einer Tiefe gefischt wird, welche die Rutenlänge übersteigt.", "Wenn sehr weit ausgeworfen werden muss."], "correct": [1], "page": 43, "lesson": 22}, {"id": 415, "section": "4. Gerätekunde (Gk)", "number": 3, "question": "Warum sollte eine Angelrute nicht über das angegebene Wurfgewicht belastet werden?", "answers": ["Es besteht die Gefahr, dass die Schnur reißt.", "Es besteht Bruchgefahr für die Rute.", "Der Kraftaufwand für den Angler wird beim Drill zu groß."], "correct": [1], "page": 43, "lesson": 20}, {"id": 416, "section": "4. Gerätekunde (Gk)", "number": 4, "question": "Warum sollte im Winter bei starkem Frost keine geflochtene Angelschnur benutzt werden?", "answers": ["Weil die Schnur bei Frost elastischer wird.", "Durch das Eindringen von Wasser in die Zwischenräume der Schnur kann die Schnur gefrieren und brechen.", "Da bei Frost die Farbe der Schnur abblättert."], "correct": [1], "page": 43, "lesson": 21}, {"id": 417, "section": "4. Gerätekunde (Gk)", "number": 5, "question": "Was bezeichnet man als „Drilling\"?", "answers": ["Ein Vorfach mit drei Haken.", "Wenn drei Fische auf einmal gefangen werden.", "Ein zusammengesetzter Haken mit drei Spitzen."], "correct": [2], "page": 43, "lesson": 22}, {"id": 418, "section": "4. Gerätekunde (Gk)", "number": 6, "question": "Was ist bei den Schnurlaufringen immer wieder zu kontrollieren?", "answers": ["Ob der Durchmesser der Ringe zur Schnurstärke passt.", "Ob sie eingeschliffen sind und Rillen oder Risse aufweisen und ob die Ringbindungen noch fest sind.", "Ob das Material durch UV-Strahlung ausgeblichen ist."], "correct": [1], "page": 43, "lesson": 20}, {"id": 419, "section": "4. Gerätekunde (Gk)", "number": 7, "question": "Was ist beim Angeln an Gewässern, in denen Berufsfischer tätig sind, zu beachten?", "answers": ["Berufsfischer haben die Berechtigung das Angelgerät zu kontrollieren.", "Es können sich Fanggeräte im Wasser befinden, die über Wasser schwer zu erkennen sind.", "Es ist von einem sehr guten Fischbestand auszugehen."], "correct": [1], "page": 43, "lesson": 24}, {"id": 420, "section": "4. Gerätekunde (Gk)", "number": 8, "question": "Was ist charakteristisch für Trockenfliegen?", "answers": ["Sie werden aus wasserabweisendem Material hergestellt.", "Sie müssen nach dem Fischen speziell getrocknet werden.", "Sie schwimmen auf der Wasseroberfläche."], "correct": [2], "page": 43, "lesson": 23}, {"id": 421, "section": "4. Gerätekunde (Gk)", "number": 9, "question": "Was ist ein Knicklicht?", "answers": ["Ein leuchtender Köder für Raubfische.", "Eine Taschenlampe, die mehrere Farbeinstellungen hat.", "Ein selbst leuchtender Bissanzeiger für das Nachtangeln."], "correct": [2], "page": 43, "lesson": 22}, {"id": 422, "section": "4. Gerätekunde (Gk)", "number": 10, "question": "Was ist eine Köderfischsenke?", "answers": ["Ein Fanggerät zum Fang von Kleinfischen.", "Eine Art Blei zum Grundangeln.", "Ein Lockmittel, das Köderfische anzieht."], "correct": [0], "page": 43, "lesson": 22}, {"id": 423, "section": "4. Gerätekunde (Gk)", "number": 11, "question": "Was ist eine Ködernadel?", "answers": ["Eine Nadel, um den Köder schonend aus dem Fischmaul zu lösen.", "Eine Nadel zum Aufspießen von Ködern, um diese beim Transport zu sichern.", "Eine Nadel zum Aufziehen des Köders auf den Angelhaken."], "correct": [2], "page": 43, "lesson": 22}, {"id": 424, "section": "4. Gerätekunde (Gk)", "number": 12, "question": "Was ist eine monofile Angelschnur?", "answers": ["Eine Angelschnur aus mehreren Fäden.", "Monofile Schnüre sind stets hell gefärbt.", "Eine einfädige Kunststoffschnur."], "correct": [2], "page": 44, "lesson": 21}, {"id": 425, "section": "4. Gerätekunde (Gk)", "number": 13, "question": "Was ist eine multifile Angelschnur?", "answers": ["Eine Schnur aus mehreren Farben.", "Eine aus mehreren Fäden gedrehte oder geflochtene Schnur, die aus Kunststoff oder anderen Materialien besteht.", "Eine Schnur, die biologisch abbaubar ist."], "correct": [1], "page": 44, "lesson": 21}, {"id": 426, "section": "4. Gerätekunde (Gk)", "number": 14, "question": "Was ist eine Steckrute?", "answers": ["Eine einteilige Rute, die in ein Futteral gesteckt wird.", "Eine mehrteilige Rute, deren Teile ineinandergeschoben werden können.", "Eine Angelrute, die aus zwei oder mehr zusammensteckbaren Teilen besteht."], "correct": [2], "page": 44, "lesson": 20}, {"id": 427, "section": "4. Gerätekunde (Gk)", "number": 15, "question": "Was ist für die Multirolle charakteristisch?", "answers": ["Die Schnurspule steht still", "Die Schnurspule dreht sich.", "Die Schnurspule hebt und senkt sich."],
