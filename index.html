<script>
const QUESTIONS=[{"id": 1, "section": "1. Allgemeine Fischkunde (AFk)", "number": 1, "question": "Anhand welches Merkmals kann das Geschlecht der Äsche bestimmt werden?", "answers": ["An der Färbung des Schuppenkleids.", "An der Anzahl der Schuppenreihen.", "An der Größe und Form der Rückenflosse (Fahne)."], "correct": [2], "page": 1, "lesson": 4}, {"id": 2, "section": "1. Allgemeine Fischkunde (AFk)", "number": 2, "question": "In welchen Gewässern können vor allem im Hoch- und Spätsommer Fischsterben auf Grund von Sauerstoffmangel auftreten?", "answers": ["In mäßig Nährstoffreichen (mesotrophen), tiefen, stehenden Gewässern.", "In rauschenden, nährstoffarmen (oligotrophen), Fließgewässern.", "In nährstoffreichen (eutrophen), meist flachen, stehenden Gewässern."], "correct": [2], "page": 1, "lesson": 9}, {"id": 3, "section": "1. Allgemeine Fischkunde (AFk)", "number": 3, "question": "Wann ist die prozentuale Gewichtszunahme bzw. das Wachstum von Fischen am größten?", "answers": ["Im Alter.", "Im Jungfischstadium.", "Die prozentuale Gewichtszunahme bzw. das Wachstum ist in allen Altersstadien gleich."], "correct": [1], "page": 1, "lesson": 3}, {"id": 4, "section": "1. Allgemeine Fischkunde (AFk)", "number": 4, "question": "Warum haben die meisten Fische in der Regel eine helle Unterseite und eine dunkel gefärbte Oberseite?", "answers": ["Zur Tarnung.", "Zur gegenseitigen Arterkennung.", "Die dunkle Fläche kann Sonnenlicht und damit Wärme besser aufnehmen, was für die wechselwarmen Fische von Vorteil ist."], "correct": [0], "page": 1, "lesson": 0}, {"id": 5, "section": "1. Allgemeine Fischkunde (AFk)", "number": 5, "question": "Warum können Baustellenabwässer (Zement-, Beton- und Baukalkwässer) für Fische gefährlich sein?", "answers": ["Weil sie je nach Konzentration ätzend wirken, wodurch die Kiemen und die Schleimhaut des Fisches stark geschädigt werden können.", "Die Trübung des Wassers führt zu einer Beeinträchtigung der Wasserpflanzen, die daraufhin sterben können.", "Sie härten im Gewässer aus und erschweren die Bewegung von Fischen."], "correct": [0], "page": 1, "lesson": 7}, {"id": 6, "section": "1. Allgemeine Fischkunde (AFk)", "number": 6, "question": "Warum werden Fische als wechselwarme Tiere bezeichnet?", "answers": ["Weil sie ihre Körpertemperatur unabhängig von der Wassertemperatur wechseln können.", "Weil ihre Körpertemperatur in den verschiedenen Altersstufen wechselt.", "Weil sich ihre Körpertemperatur der jeweiligen Wassertemperatur angleicht."], "correct": [2], "page": 1, "lesson": 3}, {"id": 7, "section": "1. Allgemeine Fischkunde (AFk)", "number": 7, "question": "Was geschieht, wenn ein Fisch Schuppen verliert?", "answers": ["Der Fisch bleibt im verletzten Bereich bis ans Lebensende schuppenlos.", "Der Fisch ist nach Verlust mehrerer Schuppen nicht mehr überlebensfähig.", "Der Fisch bildet neue Schuppen (Ersatzschuppen) aus."], "correct": [2], "page": 1, "lesson": 1}, {"id": 8, "section": "1. Allgemeine Fischkunde (AFk)", "number": 8, "question": "Was lässt auf einen Ausbruch der Krebspest schließen?", "answers": ["Vollständiges Sterben der heimischen Krebse in einem Gewässer.", "Vollständiges Sterben aller Krebsarten in einem Gewässer", "Vollständiges Sterben der Kleinkrebse in einem Gewässer"], "correct": [0], "page": 1, "lesson": 7}, {"id": 9, "section": "1. Allgemeine Fischkunde (AFk)", "number": 9, "question": "Was lässt sich anhand der Körperform des Fisches erkennen?", "answers": ["Der bevorzugte Lebensraum des Fisches und sein Ernährungszustand.", "Das Alter des Fisches und sein bevorzugtes Futter.", "Immer das Geschlecht des Fisches."], "correct": [0], "page": 1, "lesson": 0}, {"id": 10, "section": "1. Allgemeine Fischkunde (AFk)", "number": 10, "question": "Was versteht man unter dem Begriff \"Gelbaale\"?", "answers": ["Die an der Küste ankommenden durchsichtigen Jungaale.", "Ausgewachsene Aale im Fressstadium.", "Zum Laichen abwandernde Aale."], "correct": [1], "page": 1, "lesson": 5}, {"id": 11, "section": "1. Allgemeine Fischkunde (AFk)", "number": 11, "question": "Was versteht man unter dem Begriff \"Glasaale\"?", "answers": ["Die Larven des Aals während der Drift mit dem Golfstrom.", "Zum Laichen abwandernde Aale.", "Die an der Küste ankommenden durchsichtigen Jungaale."], "correct": [2], "page": 2, "lesson": 5}, {"id": 12, "section": "1. Allgemeine Fischkunde (AFk)", "number": 12, "question": "Was versteht man unter dem Begriff \"Gründeln\"?", "answers": ["Nahrungssuche und -aufnahme vom Gewässergrund.", "Schwarmbildung am Gewässergrund zum Schutz vor Fressfeinden", "Ablegen des Laichs am Gewässergrund"], "correct": [0], "page": 2, "lesson": 6}, {"id": 13, "section": "1. Allgemeine Fischkunde (AFk)", "number": 13, "question": "Was versteht man unter dem Begriff \"Weidenblattlarve\"?", "answers": ["Ausgewachsene Aale im Fressstadium.", "Die Larven des Aals während der Drift mit dem Golfstrom.", "Die an der Küste ankommenden durchsichtigen Jungaale."], "correct": [1], "page": 2, "lesson": 5}, {"id": 14, "section": "1. Allgemeine Fischkunde (AFk)", "number": 14, "question": "Was versteht man unter dem Begriff Laichausschlag?", "answers": ["Ein harter, weißlicher, körniger Ausschlag auf der Oberhaut des Fisches während der Laichzeit.", "Einen mit einem Parasiten befallenen Rogen.", "Eine Fischkrankheit."], "correct": [0], "page": 2, "lesson": 4}, {"id": 15, "section": "1. Allgemeine Fischkunde (AFk)", "number": 15, "question": "Was versteht man unter dem Begriff Laichgrube?", "answers": ["Eine natürliche Vertiefung des Gewässers, in der die Laichablage stattfindet.", "Eine vom Fisch angelegte Vertiefung im Gewässergrund zur Laichablage.", "Einen Ort im Gewässer, an dem alle Fische einer Art ablaichen."], "correct": [1], "page": 2, "lesson": 4}, {"id": 16, "section": "1. Allgemeine Fischkunde (AFk)", "number": 16, "question": "Was versteht man unter dem Begriff Laichhaken?", "answers": ["Das Schlagen einer Laichgrube.", "Eine hakenartige Ausbildung des Unterkiefers bei Milchnern der Salmoniden.", "Eine hakenartige Ausbildung des Unterkiefers bei Milchnern großer Karpfenartiger."], "correct": [1], "page": 2, "lesson": 4}, {"id": 17, "section": "1. Allgemeine Fischkunde (AFk)", "number": 17, "question": "Was versteht man unter dem Begriff Laichnester?", "answers": ["Laichnester sind von Fischen selbst oder vom Menschen angelegte (sogenannte Laichhilfen) Nester zur Eiablage.", "Von Natur aus vorhandene Laichplätze.", "Einen Ort im Gewässer, an dem alle Fische einer Art ablaichen."], "correct": [0], "page": 2, "lesson": 4}, {"id": 18, "section": "1. Allgemeine Fischkunde (AFk)", "number": 18, "question": "Was versteht man unter dem Begriff Milchner?", "answers": ["Noch nicht geschlechtsreife Fische.", "Das geschlechtsreife Männchen.", "Das geschlechtsreife Weibchen."], "correct": [1], "page": 2, "lesson": 4}, {"id": 19, "section": "1. Allgemeine Fischkunde (AFk)", "number": 19, "question": "Was versteht man unter dem Begriff Rogen?", "answers": ["Eine Wasserpflanzenart.", "Die Geschlechtsprodukte des männlichen Fisches.", "Die Geschlechtsprodukte des weiblichen Fisches."], "correct": [2], "page": 2, "lesson": 4}, {"id": 20, "section": "1. Allgemeine Fischkunde (AFk)", "number": 20, "question": "Was versteht man unter dem Begriff Wanderfischarten?", "answers": ["Fischarten, die weite Wege zu ihren Laichplätzen zurücklegen.", "Bewegungsfreudige Fischarten bei der Nahrungssuche.", "Fischarten, die permanent im Gewässer umherwandern."], "correct": [0], "page": 2, "lesson": 5}, {"id": 21, "section": "1. Allgemeine Fischkunde (AFk)", "number": 21, "question": "Welche allgemeine Regel trifft auf die Färbung von Leber und Niere bei gesunden Fischen zu?", "answers": ["Die Leber ist rosafarben, die Niere bläulich gefärbt.", "Die Leber ist rötlich-bräunlich, die Niere dunkelrot gefärbt.", "Die Leber ist weißlich, die Niere gelb gefärbt."], "correct": [1], "page": 2, "lesson": 3}, {"id": 22, "section": "1. Allgemeine Fischkunde (AFk)", "number": 22, "question": "Welche allgemeine Regel trifft auf die Geschlechtsreife der meisten Fischarten zu?", "answers": ["Rogner und Milchner werden zeitgleich laichreif.", "Milchner werden früher laichreif als Rogner.", "Rogner werden früher laichreif als Milchner."], "correct": [1], "page": 2, "lesson": 3}, {"id": 23, "section": "1. Allgemeine Fischkunde (AFk)", "number": 23, "question": "Welche Art der Tarnung können Fische nutzen?", "answers": ["Sie tarnen sich durch eine Verringerung der Flossenbewegungen.", "Sie tarnen sich durch eine Verringerung der Atembewegung.", "Sie tarnen sich durch eine standortbezogene Farbänderung und Anpassung an den Gewässeruntergrund und die Umgebung."], "correct": [2], "page": 3, "lesson": 0}, {"id": 24, "section": "1. Allgemeine Fischkunde (AFk)", "number": 24, "question": "Welche Art von Strahlen können Flossen haben?", "answers": ["Gefächerte und ungefächerte Strahlen.", "Dicke und dünne Strahlen.", "Hartstrahlen (Stachelstrahlen) und Weichstrahlen (Gliederstrahlen)."], "correct": [2], "page": 3, "lesson": 1}, {"id": 25, "section": "1. Allgemeine Fischkunde (AFk)", "number": 25, "question": "Welche Aufgabe haben die Brustflossen?", "answers": ["Steuerung", "Beschleunigung", "Stabilisation"], "correct": [0], "page": 3, "lesson": 1}, {"id": 26, "section": "1. Allgemeine Fischkunde (AFk)", "number": 26, "question": "Welche Aufgabe hat die Rückenflosse?", "answers": ["Steuerung", "Beschleunigung", "Stabilisierung der Körperhaltung."], "correct": [2], "page": 3, "lesson": 1}, {"id": 27, "section": "1. Allgemeine Fischkunde (AFk)", "number": 27, "question": "Welche Aufgabe hat die Schwanzflosse?", "answers": ["Fortbewegung", "Steuerung", "Stabilisation"], "correct": [0], "page": 3, "lesson": 1}, {"id": 28, "section": "1. Allgemeine Fischkunde (AFk)", "number": 28, "question": "Welche Auswirkung hat ein rascher Aufstieg auf die Schwimmblase des Fisches?", "answers": ["Es sind keine Auswirkungen zu erwarten.", "Sie dehnt sich aus, wenn kein Druckausgleich möglich ist.", "Sie zieht sich zusammen, wenn kein Druckausgleich möglich ist."], "correct": [1], "page": 3, "lesson": 2}, {"id": 29, "section": "1. Allgemeine Fischkunde (AFk)", "number": 29, "question": "Welche Bezahnung hat der Wels (Waller)?", "answers": ["Hechelzähne", "Hundszähne", "Schlundzähne"], "correct": [0], "page": 3, "lesson": 6}, {"id": 30, "section": "1. Allgemeine Fischkunde (AFk)", "number": 30, "question": "Welche Bezahnung trifft auf den Zander zu?", "answers": ["Schlundzähne", "Hundszähne", "Hechelzähne"], "correct": [1], "page": 3, "lesson": 6}, {"id": 31, "section": "1. Allgemeine Fischkunde (AFk)", "number": 31, "question": "Welche Bezahnung trifft auf Karpfenartige zu?", "answers": ["Bezahnter Kiefer mit Hundszähnen.", "Unbezahnter Kiefer, ausschließlich Schlundzähne", "Bezahnter Kiefer mit Hechelzähnen."], "correct": [1], "page": 3, "lesson": 6}, {"id": 32, "section": "1. Allgemeine Fischkunde (AFk)", "number": 32, "question": "Welche der genannten Krebsarten sind nach Deutschland eingeschleppt worden und Überträger der Krebspest?", "answers": ["Kamberkrebs und Signalkrebs.", "Dohlenkrebs und Asiatische Strandkrabbe.", "Edelkrebs und Steinkrebs."], "correct": [0], "page": 3, "lesson": 7}, {"id": 33, "section": "1. Allgemeine Fischkunde (AFk)", "number": 33, "question": "Welche der genannten Muschelarten sind bei ihrer Fortpflanzung auf Wirtsfische angewiesen?", "answers": ["Kugel-, Zebra- und Erbsenmuscheln", "Bach-, Fluss- und Teichmuscheln.", "Mies-, Herz- und Sandklaffmuscheln"], "correct": [1], "page": 3, "lesson": 7}, {"id": 34, "section": "1. Allgemeine Fischkunde (AFk)", "number": 34, "question": "Welche Eigenschaft zeichnet das Wachstum der Fische aus?", "answers": ["Fische wachsen jährlich um fünf Prozent ihrer Gesamtgröße.", "Laichfähige Fische wachsen schneller als Jungfische.", "Fische wachsen lebenslang, je nach Art im Alter allerdings verlangsamt."], "correct": [2], "page": 3, "lesson": 3}, {"id": 35, "section": "1. Allgemeine Fischkunde (AFk)", "number": 35, "question": "Welche eingewanderte Zehnfußkrebsart unternimmt Massenwanderungen in Fließgewässern?", "answers": ["Der Kamberkrebs.", "Die Wollhandkrabbe.", "Die Asiatische Strandkrabbe."], "correct": [1], "page": 4, "lesson": 7}, {"id": 36, "section": "1. Allgemeine Fischkunde (AFk)", "number": 36, "question": "Welche Faktoren können bakterielle Infektionen bei Fischen begünstigen?", "answers": ["Starker Lichteinfall in das Gewässer.", "Starker Sauerstoffeintrag in das Gewässer.", "Starke organische Belastung des Gewässers."], "correct": [2], "page": 4, "lesson": 7}, {"id": 37, "section": "1. Allgemeine Fischkunde (AFk)", "number": 37, "question": "Welche Fischart besitzt während der Laichzeit giftigen Rogen?", "answers": ["Barbe", "Hasel", "Nase"], "correct": [0], "page": 4, "lesson": 4}, {"id": 38, "section": "1. Allgemeine Fischkunde (AFk)", "number": 38, "question": "Welche Fischart ist schuppenlos?", "answers": ["Wels (Waller)", "Quappe", "Aal"], "correct": [0], "page": 4, "lesson": 1}, {"id": 39, "section": "1. Allgemeine Fischkunde (AFk)", "number": 39, "question": "Welche Fischarten besitzen eine sogenannte Fettflosse?", "answers": ["Alle in Deutschland heimischen Karpfenartigen.", "Alle in Deutschland heimischen Forellenartigen (Salmoniden).", "Alle in Deutschland heimischen Barschartigen."], "correct": [1], "page": 4, "lesson": 1}, {"id": 40, "section": "1. Allgemeine Fischkunde (AFk)", "number": 40, "question": "Welche Fischarten besitzen eine stachelstrahlige Rückenflosse?", "answers": ["Alle in Deutschland heimischen Barschartigen (Perciden).", "Alle in Deutschland heimischen Karpfenartigen.", "Alle in Deutschland heimischen Forellenartigen."], "correct": [0], "page": 4, "lesson": 1}, {"id": 41, "section": "1. Allgemeine Fischkunde (AFk)", "number": 41, "question": "Welche Fischarten besitzen keinen Magen?", "answers": ["Barschartige (Perciden)", "Forellenartige (Salmoniden)", "Karpfenartige (Cypriniden)"], "correct": [2], "page": 4, "lesson": 6}, {"id": 42, "section": "1. Allgemeine Fischkunde (AFk)", "number": 42, "question": "Welche Fischarten bewachen ihre Eier?", "answers": ["Zander, Wels (Waller), Dreistachliger Stichling", "Rotauge (Plötze), Rotfeder, Hasel", "Karpfen, Hecht, Aal"], "correct": [0], "page": 4, "lesson": 4}, {"id": 43, "section": "1. Allgemeine Fischkunde (AFk)", "number": 43, "question": "Welche Fischarten bilden eine Ausnahme von der allgemeinen Regel der rötlich-bräunlichen Leberfärbung?", "answers": ["Aal, Wels, Rapfen", "Zander, Dreichstachliger Stichling, Kaulbarsch", "Hecht, Quappe, Dorsch"], "correct": [2], "page": 4, "lesson": 3}, {"id": 44, "section": "1. Allgemeine Fischkunde (AFk)", "number": 44, "question": "Welche Fischarten gehören zu den Dorschartigen?", "answers": ["Zander, Flussbarsch, Kaulbarsch", "Quappe (Rutte, Trüsche), Köhler, Wittling", "Schmerle, Schlammpeitzger, Steinbeißer"], "correct": [1], "page": 4, "lesson": 8}, {"id": 45, "section": "1. Allgemeine Fischkunde (AFk)", "number": 45, "question": "Welche Fischarten gehören zu den Karpfenartigen (Cypriniden)?", "answers": ["Hecht, Wels, Aal", "Strömer, Moderlieschen, Bitterling", "Zander, Flussbarsch, Kaulbarsch"], "correct": [1], "page": 4, "lesson": 8}, {"id": 46, "section": "1. Allgemeine Fischkunde (AFk)", "number": 46, "question": "Welche Fischarten gehören zu den Schmerlenartigen (Cobitiden)?", "answers": ["Strömer, Moderlieschen, Bitterling", "Schlammpeitzger und Steinbeißer.", "Zander, Flussbarsch, Kaulbarsch"], "correct": [1], "page": 4, "lesson": 7}, {"id": 47, "section": "1. Allgemeine Fischkunde (AFk)", "number": 47, "question": "Welche Fischarten haben eine flache Körperform?", "answers": ["Barschartige", "Plattfische", "Forellenartige"], "correct": [1], "page": 5, "lesson": 0}, {"id": 48, "section": "1. Allgemeine Fischkunde (AFk)", "number": 48, "question": "Welche Fischarten haben eine hochrückige Körperform?", "answers": ["Generell Fischarten, die in starker Strömung leben oder Langstreckenschwimmer sind.", "Generell Friedfischarten, die in langsam fließenden oder stehenden Gewässern leben.", "Generell Fischarten aus der Familie der Forellenartigen (Salmoniden)."], "correct": [1], "page": 5, "lesson": 0}, {"id": 49, "section": "1. Allgemeine Fischkunde (AFk)", "number": 49, "question": "Welche Fischarten haben eine Spindel- oder Torpedokörperform?", "answers": ["Generell Fischarten, die in Stillgewässern vorkommen.", "Generell Fischarten aus der Familie der Karpfenartigen (Cypriniden).", "Generell Fischarten, die in starker Strömung leben oder Langstreckenschwimmer sind."], "correct": [2], "page": 5, "lesson": 0}, {"id": 50, "section": "1. Allgemeine Fischkunde (AFk)", "number": 50, "question": "Welche Fischarten haben Kammschuppen?", "answers": ["Flussbarsch, Kaulbarsch, Zander", "Aal, Hecht, Rapfen", "Nase, Barbe, Hasel"], "correct": [0], "page": 5, "lesson": 1}, {"id": 51, "section": "1. Allgemeine Fischkunde (AFk)", "number": 51, "question": "Welche Fischarten haben Rundschuppen?", "answers": ["Zander, Flussbarsch, Kaulbarsch", "Wels, Aal, Sonnenbarsch", "Rotauge, Brasse (Brachsen, Blei), Hecht"], "correct": [2], "page": 5, "lesson": 1}, {"id": 52, "section": "1. Allgemeine Fischkunde (AFk)", "number": 52, "question": "Welche Fischarten haben Schmelzschuppen?", "answers": ["Störartige", "Karpfenartige", "Barschartige"], "correct": [0], "page": 5, "lesson": 1}, {"id": 53, "section": "1. Allgemeine Fischkunde (AFk)", "number": 53, "question": "Welche Fischarten in einem stehenden Gewässer werden eher im Freiwasser gefangen?", "answers": ["Karpfenartige", "Maränenartige", "Aale"], "correct": [1], "page": 5, "lesson": 8}, {"id": 54, "section": "1. Allgemeine Fischkunde (AFk)", "number": 54, "question": "Welche Fischarten sind Freiwasserlaicher?", "answers": ["Hecht, Karpfen, Rotfeder", "Felchen, Hering, Dorsch", "Lachs, Bachforelle, Bachneunauge"], "correct": [1], "page": 5, "lesson": 4}, {"id": 55, "section": "1. Allgemeine Fischkunde (AFk)", "number": 55, "question": "Welche Fischarten sind Krautlaicher?", "answers": ["Hecht, Karpfen, Rotfeder", "Aal, Barbe, Nase", "Lachs, Bachforelle, Bachneunauge"], "correct": [0], "page": 5, "lesson": 4}, {"id": 56, "section": "1. Allgemeine Fischkunde (AFk)", "number": 56, "question": "Welche Fischarten sind zur Darmatmung fähig?", "answers": ["Steinbeißer und Schlammpeitzger.", "Rapfen und Hecht.", "Wels und Aal."], "correct": [0], "page": 5, "lesson": 2}, {"id": 57, "section": "1. Allgemeine Fischkunde (AFk)", "number": 57, "question": "Welche Fischarten sind zur Hautatmung fähig?", "answers": ["Hautatmung kommt bei allen Fischarten aller Altersstadien vor.", "Hautatmung kommt vorwiegend bei Fischbrut vor. Aber auch der Europäische Aal ist eine Zeit lang zur Hautatmung fähig.", "Hautatmung kommt vorwiegend bei laichfähigen Fischen vor."], "correct": [1], "page": 5, "lesson": 2}, {"id": 58, "section": "1. Allgemeine Fischkunde (AFk)", "number": 58, "question": "Welche Fischarten wandern zum Laichen vom Meer ins Süßwasser (anadrom)?", "answers": ["Europäischer Aal, Dorsch, Nase", "Barbe, Nase, Quappe", "Atlantischer Lachs, Maifisch, Flussneunauge"], "correct": [2], "page": 6, "lesson": 5}, {"id": 59, "section": "1. Allgemeine Fischkunde (AFk)", "number": 59, "question": "Welche Fischarten wandern zum Laichen weite Wege innerhalb der Fließgewässer (potamodrom)?", "answers": ["Europäischer Aal, Dorsch, Rotauge", "Barbe, Nase, Quappe", "Atlantischer Lachs, Maifisch, Flussneunauge"], "correct": [1], "page": 6, "lesson": 5}, {"id": 60, "section": "1. Allgemeine Fischkunde (AFk)", "number": 60, "question": "Welche Fischfamilien sind überwiegend Sommerlaicher?", "answers": ["Karpfenartige (Cypriniden)", "Barschartige (Perciden)", "Lachsartige (Salmoniden)"], "correct": [0], "page": 6, "lesson": 4}, {"id": 61, "section": "1. Allgemeine Fischkunde (AFk)", "number": 61, "question": "Welche Fischfamilien sind überwiegend Winterlaicher?", "answers": ["Karpfenartige (Cypriniden)", "Barschartige (Perciden)", "Lachsartige (Salmoniden)"], "correct": [2], "page": 6, "lesson": 4}, {"id": 62, "section": "1. Allgemeine Fischkunde (AFk)", "number": 62, "question": "Welche Flossenarten werden unterschieden?", "answers": ["Große und kleine Flossen.", "Paarige und unpaarige Flossen.", "bewegliche und unbewegliche Flossen"], "correct": [1], "page": 6, "lesson": 1}, {"id": 63, "section": "1. Allgemeine Fischkunde (AFk)", "number": 63, "question": "Welche Folgen kann durch Lehm und Ton stark eingetrübtes Wasser für Fische haben?", "answers": ["Die Sicht der Fische wird beeinträchtigt, so dass diese keine Nahrung mehr finden und sterben.", "Die Kiemenfunktion des Fisches kann durch die Trübstoffe beeinträchtigt werden.", "Der Geruchsinn der Fische wird dermaßen beeinträchtigt, dass diese ihre Laichplätze nicht mehr finden."], "correct": [1], "page": 6, "lesson": 7}, {"id": 64, "section": "1. Allgemeine Fischkunde (AFk)", "number": 64, "question": "Welche Funktion haben Barteln?", "answers": ["Die Barteln dienen als Ferntastsinn.", "Die Barteln nehmen Strömungs- und Wasserdruckreize wahr.", "Die Barteln sind Geschmacks- und Tastorgane."], "correct": [2], "page": 6, "lesson": 2}, {"id": 65, "section": "1. Allgemeine Fischkunde (AFk)", "number": 65, "question": "Welche Funktion haben die Kiemen des Fisches?", "answers": ["Über die Kiemen wird Nahrung aufgenommen.", "Über die Kiemen erfolgt der Gasaustausch, also die Aufnahme von Sauerstoff und die Abgabe von Kohlendioxid.", "Über die Kiemen nehmen Fische Gerüche wahr."], "correct": [1], "page": 6, "lesson": 2}, {"id": 66, "section": "1. Allgemeine Fischkunde (AFk)", "number": 66, "question": "Welche Funktion hat das Blut bei Fischen?", "answers": ["Transport von Stickstoff und Phosphor.", "Transport von Sauerstoff und Kohlendioxid.", "Wärmeverteilung im Körper"], "correct": [1], "page": 6, "lesson": 2}, {"id": 67, "section": "1. Allgemeine Fischkunde (AFk)", "number": 67, "question": "Welche Funktion hat das Seitenlinienorgan (Ferntastsinn)?", "answers": ["Das Seitenlinienorgan nimmt Strömungs- und Wasserdruckreize auf.", "Das Seitenlinienorgan dient als Geschmacks- und Tastorgan.", "Das Seitenlinienorgan dient als Gehör."], "correct": [0], "page": 6, "lesson": 2}, {"id": 68, "section": "1. Allgemeine Fischkunde (AFk)", "number": 68, "question": "Welche Funktion hat der Dottersack bei Fischen?", "answers": ["Er dient der Fischlarve nach dem Schlüpfen bis zur Fressfähigkeit zu ihrer Ernährung.", "Er ist lediglich ein evolutionäres, funktionsloses Merkmal (Rudiment).", "Er verhindert, dass die Fischlarve von der Strömung fortgeschwemmt wird."], "correct": [0], "page": 6, "lesson": 4}, {"id": 69, "section": "1. Allgemeine Fischkunde (AFk)", "number": 69, "question": "Welche Funktion hat die Darmatmung?", "answers": ["Die Darmatmung ermöglicht es, einen Sauerstoffmangel und das Trockenfallen von Gewässern zeitweilig zu überstehen.", "Die Darmatmung ermöglicht es, Gas aus der Schwimmblase zu entlassen.", "Die Darmatmung unterstützt den Verdauungsprozess bei Karpfenartigen."], "correct": [0], "page": 7, "lesson": 2}, {"id": 70, "section": "1. Allgemeine Fischkunde (AFk)", "number": 70, "question": "Welche Funktion hat die Schleimhaut bei Fischen?", "answers": ["Sie hat keinerlei Funktion.", "Sie schützt den Fisch gegen äußere Einflüsse wie Krankheitserreger und Parasiten und vermindert den Reibungswiderstand.", "Sie sondert ein Sekret ab und dient als Abwehrschutz vor Fressfeinden."], "correct": [1], "page": 7, "lesson": 1}, {"id": 71, "section": "1. Allgemeine Fischkunde (AFk)", "number": 71, "question": "Welche Gefahr droht dem Angler durch das Hechtmaul?", "answers": ["Eine Verletzung durch Fangzähne.", "Eine Verletzung durch das giftige Blut des Hechtes.", "Es droht keinerlei Gefahr."], "correct": [0], "page": 7, "lesson": 6}, {"id": 72, "section": "1. Allgemeine Fischkunde (AFk)", "number": 72, "question": "Welche karpfenartigen Fische leben im Alter i.d.R. räuberisch?", "answers": ["Nase und Schleie.", "Hecht und Zander.", "Rapfen (Schied) und Döbel (Aitel)."], "correct": [2], "page": 7, "lesson": 6}, {"id": 73, "section": "1. Allgemeine Fischkunde (AFk)", "number": 73, "question": "Welche Krankheitsmerkmale lassen auf die Schwarzfleckenkrankheit schließen?", "answers": ["Schwarz pigmentierte Flecken in der Fischhaut und auf den Flossen.", "Weiße, lose Pünktchen auf der Haut.", "Großflächige Verfärbungen der Fischhaut."], "correct": [0], "page": 7, "lesson": 7}, {"id": 74, "section": "1. Allgemeine Fischkunde (AFk)", "number": 74, "question": "Welche Krankheitsmerkmale lassen auf eine mögliche Furunkuloseerkrankung bei Fischen schließen?", "answers": ["Weiße pelzige Verdickungen der Haut.", "Geschwüre unter der Haut.", "Ein aufgedunsener Bauch."], "correct": [1], "page": 7, "lesson": 7}, {"id": 75, "section": "1. Allgemeine Fischkunde (AFk)", "number": 75, "question": "Welche Krankheitsmerkmale lassen auf eine mögliche Koi- Herpesvirus-Infektion (KHV) bei Karpfen schließen?", "answers": ["Ein aufgedunsener Bauch, hervorquellende Augen und großflächige Entzündungen auf der Haut.", "Rötliche bis gelbliche, fleckige Verfärbungen auf den Kiemen sowie eingesunkene Augen.", "Deformierter Körper und Kopf, Fische können nur noch in Drehbewegungen schwimmen."], "correct": [1], "page": 7, "lesson": 7}, {"id": 76, "section": "1. Allgemeine Fischkunde (AFk)", "number": 76, "question": "Welche Maulstellung haben Fische, die Nahrung überwiegend im Freiwasser aufnehmen?", "answers": ["Oberständiges Maul", "Endständiges Maul.", "Unterständiges Maul."], "correct": [1], "page": 7, "lesson": 0}, {"id": 77, "section": "1. Allgemeine Fischkunde (AFk)", "number": 77, "question": "Welche Maulstellung haben Fische, die Nahrung überwiegend vom Grund aufnehmen?", "answers": ["Unterständiges Maul.", "Endständiges Maul.", "Oberständiges Maul"], "correct": [0], "page": 7, "lesson": 0}, {"id": 78, "section": "1. Allgemeine Fischkunde (AFk)", "number": 78, "question": "Welche Maulstellung haben Fische, die Nahrung überwiegend von der Wasseroberfläche aufnehmen?", "answers": ["Oberständiges Maul.", "Endständiges Maul.", "Unterständiges Maul."], "correct": [0], "page": 7, "lesson": 0}, {"id": 79, "section": "1. Allgemeine Fischkunde (AFk)", "number": 79, "question": "Welche Muschelarten sind in Deutschland nicht heimisch?", "answers": ["Körbchenmuschel, Zebra- oder Dreikantmuschel, Quaggamuschel.", "Bach-, Fluss- und Teichmuscheln.", "Mies-, Herz- und Sandklaffmuscheln"], "correct": [0], "page": 8, "lesson": 7}, {"id": 80, "section": "1. Allgemeine Fischkunde (AFk)", "number": 80, "question": "Welche Nahrung wird beim Gründeln von Fischen gefressen?", "answers": ["Fische (Prädation).", "Muscheln, Krebse und andere bodenbewohnende wirbellose Tiere.", "Insekten und Anflugnahrung."], "correct": [1], "page": 8, "lesson": 6}, {"id": 81, "section": "1. Allgemeine Fischkunde (AFk)", "number": 81, "question": "Welche Rückschlüsse lassen sich bei einem Fischsterben aus abgespreizten Kiemendeckeln und weit aufstehendem Maul der verendeten Fische ziehen?", "answers": ["Auf eine Pilzerkrankung als Ursache.", "Auf Nahrungsmangel als Ursache.", "Auf akuten Sauerstoffmangel als Ursache."], "correct": [2], "page": 8, "lesson": 7}, {"id": 82, "section": "1. Allgemeine Fischkunde (AFk)", "number": 82, "question": "Welche wichtige biologische Funktion erfüllen Muscheln?", "answers": ["Aufgrund ihrer Eigenschaft, sich im Gewässergrund zu vergraben, durchlüften sie das Substrat.", "Aufgrund ihrer Eigenschaft, Kalk in ihren Schalen einzulagern, entkalken sie das Wasser.", "Aufgrund ihrer Eigenschaft als Filtrierer tragen sie zur Gewässerreinigung bei."], "correct": [2], "page": 8, "lesson": 7}, {"id": 83, "section": "1. Allgemeine Fischkunde (AFk)", "number": 83, "question": "Welche Witterungsverhältnisse begünstigen ein Fischsterben infolge von Sauerstoffmangel in stark verkrauteten Stillgewässern?", "answers": ["Starkregen und kalte Tage.", "Windstille und warme Nächte.", "Windböen und kalte Nächte."], "correct": [1], "page": 8, "lesson": 7}, {"id": 84, "section": "1. Allgemeine Fischkunde (AFk)", "number": 84, "question": "Welches arttypische Verhalten ist bei Hechten bei der Nahrungssuche bzw. -aufnahme charakteristisch?", "answers": ["Er lauert seiner Beute auf.", "Er gründelt am Grund des Gewässers.", "Er nimmt ausschließlich Beute im Oberflächenwasser auf."], "correct": [0], "page": 8, "lesson": 6}, {"id": 85, "section": "1. Allgemeine Fischkunde (AFk)", "number": 85, "question": "Welches Merkmal dient der Unterscheidung von Karauschen und Karpfen?", "answers": ["Karauschen haben keine Barteln, Karpfen haben vier Barteln.", "Die Färbung des Schuppenkleids.", "Die Anzahl der Schuppenreihen."], "correct": [0], "page": 8, "lesson": 1}, {"id": 86, "section": "1. Allgemeine Fischkunde (AFk)", "number": 86, "question": "Welches Merkmal dient der Unterscheidung von Schwarzmeergrundeln und Koppen (Mühlkoppe oder Groppe)?", "answers": ["Die zusammengewachsenen Bauchflossen der Schwarzmeergrundeln.", "Die Färbung des Schuppenkleids.", "Die Körpergröße."], "correct": [0], "page": 8, "lesson": 1}, {"id": 87, "section": "1. Allgemeine Fischkunde (AFk)", "number": 87, "question": "Welches Merkmal kann zur Altersbestimmung von Fischen genutzt werden?", "answers": ["Anzahl der Ringe auf Schuppen", "Anzahl der Gliederstrahlen der Rückenflosse.", "Anzahl der Schuppen entlang der Seitlinie einer Körperflanke."], "correct": [0], "page": 8, "lesson": 1}, {"id": 88, "section": "1. Allgemeine Fischkunde (AFk)", "number": 88, "question": "Welches Verhalten eines Fisches kann ein Anzeichen für eine Erkrankung sein?", "answers": ["Der Fisch flieht bei Störung sofort.", "Der Fisch führt ohne Anlass fluchtartige Bewegungen aus.", "Der Fisch ist apathisch und zeigt kein Fluchtverhalten."], "correct": [2], "page": 8, "lesson": 7}, {"id": 89, "section": "1. Allgemeine Fischkunde (AFk)", "number": 89, "question": "Welches Verhalten kann bei Fischen ein Zeichen für akuten Sauerstoffmangel im Gewässer sein?", "answers": ["Die Fische finden sich im Freiwasser zu Schwärmen zusammen.", "Die Fische schnappen direkt an der Oberfläche nach Luft.", "Die Fische lassen sich zu Boden sinken und gründeln."], "correct": [1], "page": 8, "lesson": 7}, {"id": 90, "section": "1. Allgemeine Fischkunde (AFk)", "number": 90, "question": "Wie ändert sich der Sauerstoffbedarf der Fische bei steigender Temperatur?", "answers": ["Er verringert sich.", "Er ist temperaturunabhängig.", "Er steigt an."], "correct": [2], "page": 9, "lesson": 3}, {"id": 91, "section": "1. Allgemeine Fischkunde (AFk)", "number": 91, "question": "Wie erfolgt die standortbezogene Färbung der Fische?", "answers": ["Über Seitenlinien, Flossen und Schwimmblase.", "Über Augen, Gehirn und Nerven.", "Über Kiemen, Nasenriechgruben und inneres Gehörorgan."], "correct": [1], "page": 9, "lesson": 0}, {"id": 92, "section": "1. Allgemeine Fischkunde (AFk)", "number": 92, "question": "Wie gut kann ein Fisch aus dem Wasser heraussehen?", "answers": ["Fische nehmen nur sich bewegende Objekte außerhalb des Wassers wahr.", "Objekte außerhalb des Wasserkörpers entziehen sich der Wahrnehmung von Fischen.", "Ein Fisch kann Objekte außerhalb des Wassers, zum Beispiel am Ufer, wahrnehmen."], "correct": [2], "page": 9, "lesson": 2}, {"id": 93, "section": "1. Allgemeine Fischkunde (AFk)", "number": 93, "question": "Wie können Angler dazu beitragen, Fischkrankheiten auf andere Fischbestände zu übertragen?", "answers": ["Durch am Wasser liegengelassenen Müll (der schließlich ins Gewässer gelangt)", "Durch Zurücksetzen von erschöpften Fischen nach dem Drill.", "Durch die Verbringung von Wasser, mitgebrachte erkrankte (auch symptomlos infizierte) Köderfische oder Teile von Köderfischen sowie nicht desinfizierte Angelausrüstung und Kleidung."], "correct": [2], "page": 9, "lesson": 7}, {"id": 94, "section": "1. Allgemeine Fischkunde (AFk)", "number": 94, "question": "Wie können heimische Krebsbestände im Gewässer am besten geschützt werden?", "answers": ["Durch Verhinderung der weiteren Verbreitung invasiver, nicht heimischer Krebsarten und durch Desinfektion der Ausrüstung und Kleidung zur Vermeidung der Übertragung von Krankheitserregern.", "Durch ständige Gabe von Antibiotika in das befallene Gewässer", "Durch ständigen Besatz mit Zuchtkrebsen aus der Aquakultur."], "correct": [0], "page": 9, "lesson": 7}, {"id": 95, "section": "1. Allgemeine Fischkunde (AFk)", "number": 95, "question": "Wie werden die verschiedenen Maulstellungen genannt?", "answers": ["Ober-, unter- und endständiges Maul.", "Langgezogenes, plattes und kurzes Maul.", "Geschwungenes, gekrümmtes und gerades Maul."], "correct": [0], "page": 9, "lesson": 0}, {"id": 96, "section": "1. Allgemeine Fischkunde (AFk)", "number": 96, "question": "Wie werden junge abwandernde Atlantische Lachse und Meerforellen bezeichnet?", "answers": ["Smolts", "Parrs", "Cypriniden"], "correct": [0], "page": 9, "lesson": 5}, {"id": 97, "section": "1. Allgemeine Fischkunde (AFk)", "number": 97, "question": "Wo befinden sich beim Fisch die Nieren?", "answers": ["In der Kehlgegend.", "Unter der Wirbelsäule innerhalb der Leibeshöhle vom Kopfansatz bis auf Höhe des Afters.", "Direkt unter der Bauchdecke in der Nähe des Darmausgangs."], "correct": [1], "page": 9, "lesson": 2}, {"id": 98, "section": "1. Allgemeine Fischkunde (AFk)", "number": 98, "question": "Wo befindet sich beim Fisch das Herz?", "answers": ["Unterhalb der Rückenflosse.", "Kehlständig unterhalb der Kiemenhöhlen.", "Zwischen Bauch- und Brustflossen."], "correct": [1], "page": 9, "lesson": 2}, {"id": 99, "section": "1. Allgemeine Fischkunde (AFk)", "number": 99, "question": "Wo befindet sich beim Fisch die Gallenblase?", "answers": ["An der Leber.", "An der Schwimmblase.", "An der Niere."], "correct": [0], "page": 9, "lesson": 2}, {"id": 100, "section": "1. Allgemeine Fischkunde (AFk)", "number": 100, "question": "Wo befindet sich das Seitenlinienorgan (Ferntastsinn)?", "answers": ["Entlang der Bauchkante.", "An der Schwanzwurzel.", "Insbesondere an beiden Körperflanken, jedoch auch im Kopfbereich (Kopfporen) des Fisches."], "correct": [2], "page": 10, "lesson": 2}, {"id": 101, "section": "1. Allgemeine Fischkunde (AFk)", "number": 101, "question": "Wo laicht der Hecht?", "answers": ["An flachen und verkrauteten Uferstellen in stehenden Gewässern oder in Überflutungsbereichen.", "Im Freiwasser.", "In den Tiefenzonen stehender Gewässer."], "correct": [0], "page": 10, "lesson": 4}, {"id": 102, "section": "1. Allgemeine Fischkunde (AFk)", "number": 102, "question": "Wo laicht der Karpfen?", "answers": ["Im Freiwasser.", "In sandig-kiesigen Bereichen der stehenden Gewässer.", "An flachen und verkrauteten Uferstellen in stehenden Gewässern."], "correct": [2], "page": 10, "lesson": 4}, {"id": 103, "section": "1. Allgemeine Fischkunde (AFk)", "number": 103, "question": "Wo laicht die Bachforelle?", "answers": ["In sandigen Bereichen des Mittellaufs von Fließgewässern.", "In schlammigen Bereichen der Unterläufe von Fließgewässern.", "In den kiesigen Bereichen der Oberläufe von Fließgewässern."], "correct": [2], "page": 10, "lesson": 4}, {"id": 104, "section": "1. Allgemeine Fischkunde (AFk)", "number": 104, "question": "Wo laicht die Barbe?", "answers": ["Auf kiesigen, stark überströmten Bodenstellen in Fließgewässern.", "In den strömungsarmen Zonen der Fließgewässer an Wasserpflanzen.", "In schlammigen Bereichen der Fließgewässer."], "correct": [0], "page": 10, "lesson": 4}, {"id": 105, "section": "1. Allgemeine Fischkunde (AFk)", "number": 105, "question": "Wo laicht die Meerforelle?", "answers": ["In kiesigen Bereichen der Oberläufe von Fließgewässern.", "In schlammigen Bereichen der Unterläufe von Fließgewässern.", "In sandigen Bereichen des Mittellaufs von Fließgewässern."], "correct": [0], "page": 10, "lesson": 4}, {"id": 106, "section": "1. Allgemeine Fischkunde (AFk)", "number": 106, "question": "Wo verläuft der Hauptnervenstrang bei Fischen?", "answers": ["Entlang des Seitenlinienorgans.", "Entlang der Bauchkante.", "Oberhalb und entlang der Wirbelsäule."], "correct": [2], "page": 10, "lesson": 2}, {"id": 107, "section": "1. Allgemeine Fischkunde (AFk)", "number": 107, "question": "Wodurch kommt es bei Fischen zu Verpilzungen?", "answers": ["Sauerstoffmangel", "Schuppenverlust", "Verletzung der Schleimhaut."], "correct": [2], "page": 10, "lesson": 7}, {"id": 108, "section": "1. Allgemeine Fischkunde (AFk)", "number": 108, "question": "Woran erkennt man ein Fischsterben, das durch eine Einleitung oder natürliche Vorgänge im Gewässer hervorgerufen wurde?", "answers": ["Das Fischsterben betrifft Fische einer Art und Altersklasse.", "Das Fischsterben betrifft Fische einer Art aber verschiedener Altersklassen.", "Das Fischsterben betrifft verschiedene Fischarten und verschiedene Altersklassen."], "correct": [2], "page": 10, "lesson": 7}, {"id": 109, "section": "1. Allgemeine Fischkunde (AFk)", "number": 109, "question": "Woran erkennt man ein Fischsterben, das durch eine Krankheit hervorgerufen wurde?", "answers": ["Das Sterben betrifft nicht nur Fische, sondern häufig auch andere Tierarten.", "Das Fischsterben betrifft fast nur Fische einer Art.", "Das Fischsterben betrifft immer Fische mehrerer Arten."], "correct": [1], "page": 10, "lesson": 7}, {"id": 110, "section": "1. Allgemeine Fischkunde (AFk)", "number": 110, "question": "Woraus besteht die Nahrung von Fischbrut hauptsächlich?", "answers": ["Aus tierischem Plankton (Zooplankton).", "Aus Insektenlarven, Würmern und Schnecken.", "Aus pflanzlichem Plankton."], "correct": [0], "page": 10, "lesson": 6}, {"id": 111, "section": "1. Allgemeine Fischkunde (AFk)", "number": 111, "question": "Woraus besteht die Nahrungsgrundlage der Äsche?", "answers": ["Hauptsächlich aus kleinen Fischen.", "Hauptsächlich aus Wirbellosen", "Hauptsächlich aus pflanzlichem Plankton."], "correct": [1], "page": 11, "lesson": 6}, {"id": 112, "section": "1. Allgemeine Fischkunde (AFk)", "number": 112, "question": "Woraus besteht die Nahrungsgrundlage der Bachforelle?", "answers": ["Überwiegend aus pflanzlichem Plankton.", "Überwiegend aus großen Fischen.", "Aus Wirbellosen und kleineren Fischen"], "correct": [2], "page": 11, "lesson": 6}, {"id": 113, "section": "1. Allgemeine Fischkunde (AFk)", "number": 113, "question": "Woraus besteht die Nahrungsgrundlage der Kleinen Maräne?", "answers": ["Überwiegend aus pflanzlichem Plankton.", "Hauptsächlich aus kleinen Fischen.", "Aus tierischem Plankton (Zooplankton)."], "correct": [2], "page": 11, "lesson": 6}, {"id": 114, "section": "1. Allgemeine Fischkunde (AFk)", "number": 114, "question": "Woraus besteht die Nahrungsgrundlage der Nase?", "answers": ["Hauptsächlich aus kleinen Fischen.", "Überwiegend aus Bewuchs (z.B. Algen) auf Steinen.", "Ausschließlich aus Insektenlarven, Würmern und Schnecken."], "correct": [1], "page": 11, "lesson": 6}, {"id": 115, "section": "1. Allgemeine Fischkunde (AFk)", "number": 115, "question": "Woraus besteht die Nahrungsgrundlage des Dorsches?", "answers": ["Hauptsächlich aus tierischem Plankton.", "Hauptsächlich aus pflanzlichem Plankton.", "Aus Fischen, Krebstieren, Muscheln und Würmern."], "correct": [2], "page": 11, "lesson": 6}, {"id": 116, "section": "1. Allgemeine Fischkunde (AFk)", "number": 116, "question": "Woraus besteht die Nahrungsgrundlage des Herings?", "answers": ["Hauptsächlich aus kleinen Fischen.", "Überwiegend aus pflanzlichem Plankton.", "Aus tierischem Plankton (Zooplankton)."], "correct": [2], "page": 11, "lesson": 6}, {"id": 117, "section": "1. Allgemeine Fischkunde (AFk)", "number": 117, "question": "Woraus besteht die Nahrungsgrundlage des Karpfens?", "answers": ["Überwiegend aus pflanzlichem Plankton.", "Überwiegend aus Insektenlarven, Würmern und Schnecken.", "Überwiegend aus Fischen."], "correct": [1], "page": 11, "lesson": 6}, {"id": 118, "section": "1. Allgemeine Fischkunde (AFk)", "number": 118, "question": "Woraus besteht die Nahrungsgrundlage des Ukeleis (Laube)?", "answers": ["Aus tierischem Plankton (Zooplankton) und Wirbellosen.", "Überwiegend aus kleinen Fischen.", "Überwiegend aus pflanzlichem Plankton."], "correct": [0], "page": 11, "lesson": 6}, {"id": 119, "section": "1. Allgemeine Fischkunde (AFk)", "number": 119, "question": "Woraus besteht die Nahrungsgrundlage des Zanders?", "answers": ["Überwiegend aus pflanzlichem Plankton.", "Überwiegend aus Fischen.", "Überwiegend aus Insektenlarven, Würmern und Schnecken."], "correct": [1], "page": 11, "lesson": 6}, {"id": 120, "section": "1. Allgemeine Fischkunde (AFk)", "number": 120, "question": "Wovon ernähren sich Flusskrebse?", "answers": ["Flusskrebse sind Filtrierer. Sie ernähren sich vor allem von pflanzlichem Plankton (Phytoplankton)", "Flusskrebse sind Allesfresser. Sie ernähren sich vor allem von im Gewässer anfallenden Detritus (zerfallende organische Substanzen), aber auch von Aas.", "Flusskrebse sind ausschließlich Räuber. Sie Fangen Fische mit ihren Scheren."], "correct": [1], "page": 11, "lesson": 6}, {"id": 121, "section": "1. Allgemeine Fischkunde (AFk)", "number": 121, "question": "Die Augen dienen dem Fisch - wie auch dem Menschen - zum Sehen. Wir können unsere Augen mit Hilfe der Augenlider schließen. Sind unsere einheimischen Fische dazu auch in der Lage?", "answers": ["Ja, aber nur einige Arten", "Ja, alle Fische können ihre Augen mit den Lidern schließen", "Nein, unsere einheimischen Fische besitzen keine Augenlider"], "correct": [2], "page": 11, "lesson": 1}, {"id": 122, "section": "1. Allgemeine Fischkunde (AFk)", "number": 122, "question": "Eine Gruppe der aufgeführten Fische besitzt keine Schwimmblase.", "answers": ["Forellen und Barsche", "Hechte und Karpfen", "Neunaugen, Haie, Mühlkoppe und Makrele"], "correct": [2], "page": 12, "lesson": 2}, {"id": 123, "section": "1. Allgemeine Fischkunde (AFk)", "number": 123, "question": "Wir halten eine Schuppe gegen das Licht und erkennen helle und dunkle Ringe. Die dunklen Ringe sind?", "answers": ["Die Sommerringe; in dieser Zeit hatte der Fisch reichlich Nahrung", "Die Winterringe; in dieser Zeit hatte der Fisch wenig Nahrung", "Durch die Nahrungsaufnahme entstehen keine Ringe auf den Schuppen"], "correct": [1], "page": 12, "lesson": 1}, {"id": 124, "section": "1. Allgemeine Fischkunde (AFk)", "number": 124, "question": "Zu den Sommerlaichern gehören unter anderem?", "answers": ["Karpfen, Schleie, Barbe, Wels", "Hecht, Zander, Barsch", "Lachs, Bachforelle"], "correct": [0], "page": 12, "lesson": 4}, {"id": 125, "section": "1. Allgemeine Fischkunde (AFk)", "number": 125, "question": "Können Schuppen bei der Bestimmung von Fischarten helfen?", "answers": ["Nein", "Ja, die Größe der Schuppen ist wichtig zum Erkennen von Arten", "Ja, die Anzahl der Schuppen auf der Seitenlinie ist bei den Fischarten sehr regelmäßig"], "correct": [2], "page": 12, "lesson": 1}, {"id": 126, "section": "1. Allgemeine Fischkunde (AFk)", "number": 126, "question": "Welches Verhalten lässt darauf schließen, dass ein Fisch erkrankt ist?", "answers": ["Der Fisch steht in der Strömung und bewegt sich kaum", "Der Fisch verteidigt aggressiv seinen Unterstand gegenüber Artgenossen", "Der Fisch steht apathisch im Flachwasserbereich und zeigt kein Fluchtverhalten"], "correct": [2], "page": 12, "lesson": 7}, {"id": 127, "section": "1. Allgemeine Fischkunde (AFk)", "number": 127, "question": "Auch Fische besitzen Nieren, die wichtige Körperfunktionen zu erfüllen haben", "answers": ["Sie liegen lang gestreckt und tiefbraun unterhalb der Wirbelsäule und reinigen das Blut", "Die Nieren der Fische liegen als bohnenförmige Organe über der Leber", "Die Nieren liegen lang gestreckt und hellrot über der Wirbelsäule"], "correct": [0], "page": 12, "lesson": 2}, {"id": 128, "section": "1. Allgemeine Fischkunde (AFk)", "number": 128, "question": "Welche Aufgaben erfüllen Rücken- und Afterflossen heimischer Fische?", "answers": ["Sie dienen der Steuerung", "Sie dienen der Fortbewegung", "Sie dienen der Aufrechterhaltung bzw. der Stabilisierung des Fischkörpers im Wasser"], "correct": [2], "page": 12, "lesson": 1}, {"id": 129, "section": "1. Allgemeine Fischkunde (AFk)", "number": 129, "question": "Können Schlundzähne zur Artbestimmung herangezogen werden?", "answers": ["Ja, bei Salmoniden", "Ja, bei Barschartigen", "Ja, bei Karpfenartigen"], "correct": [2], "page": 12, "lesson": 1}, {"id": 130, "section": "1. Allgemeine Fischkunde (AFk)", "number": 130, "question": "Wie viele heimische Fischarten kommen etwa in Hessen vor?", "answers": ["Ca. 15 Arten", "Ca. 50 Arten", "Ca. 150 Arten"], "correct": [1], "page": 12, "lesson": 8}, {"id": 131, "section": "1. Allgemeine Fischkunde (AFk)", "number": 131, "question": "Durch welches unveränderliche Merkmal unterscheiden sich Salmoniden von Cypriniden?", "answers": ["Durch die zweigeteilte Rückenflosse", "Durch die Fettflosse", "Durch kehlständige Brustflossen"], "correct": [1], "page": 12, "lesson": 8}, {"id": 132, "section": "1. Allgemeine Fischkunde (AFk)", "number": 132, "question": "Auf dem Pflugscharbein der Salmoniden finden wir eine Besonderheit zum Unterscheiden der Arten. Dabei handelt es sich um ...?", "answers": ["Zahnreihen des Pflugscharbeins", "Färbungen des Pflugscharbeins", "Die Länge des Pflugscharbeins"], "correct": [0], "page": 12, "lesson": 8}, {"id": 133, "section": "1. Allgemeine Fischkunde (AFk)", "number": 133, "question": "Empfinden Fische Temperaturen und Temperaturschwankungen?", "answers": ["Nein", "Ja, aber nur Temperaturen über + 4 °C", "Ja; plötzliche, starke Schwankungen können für sie sogar tödlich sein"], "correct": [2], "page": 13, "lesson": 3}, {"id": 134, "section": "1. Allgemeine Fischkunde (AFk)", "number": 134, "question": "Fische gehören zu den wechselwarmen Tieren. Was bedeutet das?", "answers": ["Fische wechseln gern vom kalten ins warme Wasser", "Die Körpertemperatur der Fische wechselt nicht; sie beträgt stets + 20 °C", "Die Körpertemperatur der Fische entspricht der Temperatur des umgebenden Wassers"], "correct": [2], "page": 13, "lesson": 3}, {"id": 135, "section": "1. Allgemeine Fischkunde (AFk)", "number": 135, "question": "Warum häuten sich Krebse?", "answers": ["Die Häutung dient als Schutzmechanismus gegen die Krebspest", "Der Krebspanzer wächst nicht mit und muss beim wachsenden Krebs erneuert werden", "Der Krebspanzer ist nach der Paarung stark beschädigt und muss erneuert werden"], "correct": [1], "page": 13, "lesson": 7}, {"id": 136, "section": "1. Allgemeine Fischkunde (AFk)", "number": 136, "question": "Welche Fischart gehört zur Gruppe der Dorsch- bzw. Schellfischartigen?", "answers": ["Rutte (Quappe)", "Maifisch", "Steinbeißer"], "correct": [0], "page": 13, "lesson": 7}, {"id": 137, "section": "1. Allgemeine Fischkunde (AFk)", "number": 137, "question": "Wozu kann man bei bestimmten Fischen die Fettflosse heranziehen?", "answers": ["Zur Bestimmung des Geschlechtes beim Döbel", "Zur Abschätzung des Ernährungszustandes", "Zur Artbestimmung"], "correct": [2], "page": 13, "lesson": 1}, {"id": 138, "section": "1. Allgemeine Fischkunde (AFk)", "number": 138, "question": "Welche Funktion hat die Schwimmblase?", "answers": ["Sie dient der Verdauung", "Sie dient der Ausscheidung", "Sie dient als Auftriebskörper"], "correct": [2], "page": 13, "lesson": 2}, {"id": 139, "section": "1. Allgemeine Fischkunde (AFk)", "number": 139, "question": "Was versteht man unter Brutpflege bei Fischen?", "answers": ["Das Beschützen des Laiches und der jungen Brut", "Die Ablage von Laich auf Wasserpflanzen", "Das Entfernen von Hautparasiten bei der Fischbrut durch die Elterntiere"], "correct": [0], "page": 13, "lesson": 4}, {"id": 140, "section": "1. Allgemeine Fischkunde (AFk)", "number": 140, "question": "Was versteht man unter dem Begriff \"Laichwanderung\"?", "answers": ["Das Verdriften des Laiches und der jungen Brut", "Das Zusammentreffen der Eier und der Samenzellen bei der Befruchtung", "Die Wanderung der laichbereiten Fische zum Laichgebiet"], "correct": [2], "page": 13, "lesson": 5}, {"id": 141, "section": "1. Allgemeine Fischkunde (AFk)", "number": 141, "question": "Welche der aufgeführten Arten ist ein katadromer Wanderfisch?", "answers": ["Lachs", "Stint", "Aal"], "correct": [2], "page": 13, "lesson": 5}, {"id": 142, "section": "1. Allgemeine Fischkunde (AFk)", "number": 142, "question": "Was ist ein Rogner?", "answers": ["Ein männlicher Fisch", "Ein weiblicher Fisch", "Ein unfruchtbarer Fisch"], "correct": [1], "page": 13, "lesson": 4}, {"id": 143, "section": "1. Allgemeine Fischkunde (AFk)", "number": 143, "question": "Welcher Fisch ist ein Kieslaicher?", "answers": ["Bitterling", "Barbe", "Hecht"], "correct": [1], "page": 13, "lesson": 4}, {"id": 144, "section": "1. Allgemeine Fischkunde (AFk)", "number": 144, "question": "Welche Flosse hat keine Flossenstrahlen?", "answers": ["Die Fettflosse der Lachsartigen (Salmoniden)", "Die zweite Rückenflosse der Barschartigen (Perciden)", "Die Rückenflosse der Hechte (Esociden)"], "correct": [0], "page": 13, "lesson": 1}, {"id": 145, "section": "1. Allgemeine Fischkunde (AFk)", "number": 145, "question": "Das Blut einiger unserer Fische wirkt auf unsere Schleimhaut reizend und giftig. Wir sollten sie deshalb nicht mit Verletzungen an den Händen ausnehmen. Es ist das Blut von ...?", "answers": ["Brassen und Güster", "Aal und Wels", "Hecht und Zander"], "correct": [1], "page": 14, "lesson": 6}, {"id": 146, "section": "1. Allgemeine Fischkunde (AFk)", "number": 146, "question": "Im Maul des Zanders und Hechtes fallen auf den Kiefern deutlich kräftige Zähne auf. Sie dienen zum Halten der Beute. In der Fachsprache heißen sie ...?", "answers": ["Hechelzähne", "Hunds- oder Fangzähne", "Sägezähne"], "correct": [1], "page": 14, "lesson": 6}, {"id": 147, "section": "1. Allgemeine Fischkunde (AFk)", "number": 147, "question": "Die Mehrzahl unserer Fische besitzt unter der Oberhaut ein dichtes Schuppenkleid. Bei den Schuppen treten zwei Formen besonders häufig auf. Es sind ...?", "answers": ["Die Sommer- und die Winterschuppen", "Die Rund- und die Kammschuppen", "Friedfisch- und Raubfischschuppen"], "correct": [1], "page": 14, "lesson": 1}, {"id": 148, "section": "1. Allgemeine Fischkunde (AFk)", "number": 148, "question": "Wo befinden sich Fischegel am befallenen Fisch?", "answers": ["In der Leibeshöhle", "In der Schwimmblase", "Auf dem Körper"], "correct": [2], "page": 14, "lesson": 7}, {"id": 149, "section": "1. Allgemeine Fischkunde (AFk)", "number": 149, "question": "Ist bei Fischen die Entwicklung der Eier temperaturabhängig?", "answers": ["Ja", "Nein", "Nur beim Karpfen"], "correct": [0], "page": 14, "lesson": 3}, {"id": 150, "section": "1. Allgemeine Fischkunde (AFk)", "number": 150, "question": "Im oberen Teil des Fischmauls liegt eine Knochenplatte. Im Gegensatz zu den Cypriniden zeigt sie sich bei den Salmoniden mit kleinen Zähnchen besetzt. Diese Knochenplatte kann eine wesentliche Hilfe zur Unterscheidung einiger Salmonidenarten sein. Es ist ...?", "answers": ["Das Pflugscharbein", "Der Oberkieferknochen", "Der Unterkieferknochen"], "correct": [0], "page": 14, "lesson": 1}, {"id": 151, "section": "1. Allgemeine Fischkunde (AFk)", "number": 151, "question": "Ein Fisch hat sich verletzt und Schuppen verloren. Können diese Schuppen nachwachsen?", "answers": ["Die fehlenden Schuppen verknorpeln", "Ja, sie können nachwachsen", "Nein, sie können nicht nachwachsen"], "correct": [1], "page": 14, "lesson": 1}, {"id": 152, "section": "1. Allgemeine Fischkunde (AFk)", "number": 152, "question": "Die Krebspest wird hervorgerufen durch?", "answers": ["Ein Virus", "Ein Bakterium", "Einen Pilz"], "correct": [2], "page": 14, "lesson": 7}, {"id": 153, "section": "1. Allgemeine Fischkunde (AFk)", "number": 153, "question": "Welche Fischarten sind ausgesprochene \"Nachttiere\"?", "answers": ["Hecht, Zander, Rapfen", "Lachs, Äsche, Bachforelle", "Wels, Quappe, Aal"], "correct": [2], "page": 14, "lesson": 6}, {"id": 154, "section": "1. Allgemeine Fischkunde (AFk)", "number": 154, "question": "An der Kiemenoberfläche wird ...?", "answers": ["Vom Blut Sauerstoff abgegeben und Kohlendioxid aufgenommen", "Vom Blut Sauerstoff aufgenommen und Kohlendioxid abgegeben", "Vom Blut Sauerstoff und Kohlendioxid aufgenommen"], "correct": [1], "page": 14, "lesson": 2}, {"id": 155, "section": "1. Allgemeine Fischkunde (AFk)", "number": 155, "question": "Besitzt der Barsch ...?", "answers": ["Eine geschlossene Schwimmblase mit Oval", "Eine zweikammerige Schwimmblase mit Luftgang", "Eine einkammerige Schwimmblase mit Luftgang"], "correct": [0], "page": 14, "lesson": 2}, {"id": 156, "section": "1. Allgemeine Fischkunde (AFk)", "number": 156, "question": "Als Flösseln bezeichnen wir ...?", "answers": ["Die drei Rückenflossen bei dorschartigen Fischen", "Den Flossensaum beim Aal", "Die kleinen Flossen auf dem Rücken bei Makrelen und Thunfischen zwischen Rückenflosse und Afterflosse"], "correct": [2], "page": 15, "lesson": 1}, {"id": 157, "section": "2. Gewässerökologie (GeÖ)", "number": 1, "question": "Dürfen gentechnisch veränderte Fische in der freien Natur als Besatzmaterial verwendet werden?", "answers": ["Ja, sie sind widerstandsfähiger gegen äußere Einflüsse.", "Nein, das wäre ein Verstoß gegen das BNatSchG.", "Ja, sie vergrößern die Artenvielfalt im Gewässer."], "correct": [1], "page": 16, "lesson": 15}, {"id": 158, "section": "2. Gewässerökologie (GeÖ)", "number": 2, "question": "In welcher Reihenfolge kommen in stehenden Gewässern die Wasserpflanzengemeinschaften vom Ufer zur Seemitte hin vor?", "answers": ["Gelegezone - Schwimmblattzone - Unterwasserwiesen - Laichkrautzone", "Gelegezone – Schwimmblattzone - Laichkrautzone - Unterwasserwiesen", "Laichkrautzone - Gelegezone - Schwimmblattzone - Unterwasserwiesen"], "correct": [1], "page": 16, "lesson": 10}, {"id": 159, "section": "2. Gewässerökologie (GeÖ)", "number": 3, "question": "In welcher Zone des Sees kommen die Armleuchteralgen vor?", "answers": ["Zone der unterseeischen Wiesen", "Laichkrautzone und Zone der unterseeischen Wiesen", "Schwimmblattzone"], "correct": [0], "page": 16, "lesson": 10}, {"id": 160, "section": "2. Gewässerökologie (GeÖ)", "number": 4, "question": "In welcher Zone des Sees kommen See- und Teichrosen vor?", "answers": ["Gelegezone", "Schwimmblattzone", "Laichkrautzone und Zone der unterseeischen Wiesen"], "correct": [1], "page": 16, "lesson": 10}, {"id": 161, "section": "2. Gewässerökologie (GeÖ)", "number": 5, "question": "In welcher Zone des Sees kommt das Schilf vor?", "answers": ["Schwimmblattzone", "Laichkrautzone und Zone der unterseeischen Wiesen", "Gelegezone"], "correct": [2], "page": 16, "lesson": 10}, {"id": 162, "section": "2. Gewässerökologie (GeÖ)", "number": 6, "question": "In welcher Zone des Sees kommt die Wasserpest vor?", "answers": ["Gelegezone", "Schwimmblattzone", "Laichkrautzone und Zone der unterseeischen Wiesen"], "correct": [2], "page": 16, "lesson": 10}, {"id": 163, "section": "2. Gewässerökologie (GeÖ)", "number": 7, "question": "Verändert sich der Sauerstoffgehalt bei steigender Wassertemperatur?", "answers": ["Er steigt.", "Er sinkt.", "Er bleibt konstant."], "correct": [1], "page": 16, "lesson": 9}, {"id": 164, "section": "2. Gewässerökologie (GeÖ)", "number": 8, "question": "Wann kommt es bei den meisten Seen typischerweise zur Vollzirkulation?", "answers": ["Sommer", "Frühjahr und Herbst.", "Winter"], "correct": [1], "page": 16, "lesson": 10}, {"id": 165, "section": "2. Gewässerökologie (GeÖ)", "number": 9, "question": "Wann produzieren Pflanzen Sauerstoff im Überschuss?", "answers": ["Nachts in der Dunkelheit", "Immer, unabhängig von der Tageszeit", "Tagsüber bei Lichteinfall."], "correct": [2], "page": 16, "lesson": 9}, {"id": 166, "section": "2. Gewässerökologie (GeÖ)", "number": 10, "question": "Wann verbrauchen Pflanzen nur Sauerstoff, ohne ihn zu produzieren?", "answers": ["Bei einer Wassertemperatur unterhalb von 4 Grad Celsius.", "Nachts in der Dunkelheit", "Tagsüber bei Lichteinfall."], "correct": [1], "page": 16, "lesson": 9}, {"id": 167, "section": "2. Gewässerökologie (GeÖ)", "number": 11, "question": "Warum dürfen Schilf- und Rohrbereiche (Röhrichte) zum Angeln nicht betreten oder befahren werden?", "answers": ["Schilf und Rohrbestände sind gesetzlich geschützt.", "Zu Fuß kann man stolpern oder sich verfangen, mit Booten kann man sich festfahren.", "Weil man Fische dann aus ihren Standflächen vertreibt, in denen man sie am besten fangen kann."], "correct": [0], "page": 17, "lesson": 14}, {"id": 168, "section": "2. Gewässerökologie (GeÖ)", "number": 12, "question": "Warum müssen Fischbestände dezimiert werden, bei denen Verbuttung einsetzt?", "answers": ["Zur Wiederherstellung einer natürlichen Alterspyramide des Fischbestandes und eines normalen Wachstums.", "Um zu verhindern, dass die Fische zu groß werden.", "Um den Fischbestand zu erhalten."], "correct": [0], "page": 17, "lesson": 15}, {"id": 169, "section": "2. Gewässerökologie (GeÖ)", "number": 13, "question": "Warum müssen Fließgewässer für Fische durchgängig gehalten werden?", "answers": ["Eine Durchgängigkeit muss lediglich flussab gewährleistet werden, damit große Fische abwandern können.", "Damit jedem Fischereiverein die gleiche Menge Fisch zur Verfügung steht", "Damit die Fische ihre Laichplätze erreichen."], "correct": [2], "page": 17, "lesson": 14}, {"id": 170, "section": "2. Gewässerökologie (GeÖ)", "number": 14, "question": "Warum sollte das Betreten von Kiesbänken beim Watangeln im Frühjahr unterbleiben?", "answers": ["Weil Kiesbänke der Laichplatz vieler Fischarten sind und sich dort die meisten Jungfische aufhalten.", "Weil das Betreten von Kiesbänken unter Wasser Geräusche verursacht, die Fische vertreiben.", "Weil das Betreten von Kiesbänken Nährstoffe freisetzt, die dem Wasser Sauerstoff entziehen."], "correct": [0], "page": 17, "lesson": 14}, {"id": 171, "section": "2. Gewässerökologie (GeÖ)", "number": 15, "question": "Was ist bei Wiederansiedlungsmaßnahmen zu beachten?", "answers": ["Entsprechende Maßnahmen müssen unter den Fischereiausübungsberechtigten abgestimmt werden.", "Planung und Durchführung sollte ausschließlich durch Fachleute erfolgen.", "Sie können meist in kurzen Zeiträumen abgeschlossen werden."], "correct": [1], "page": 17, "lesson": 15}, {"id": 172, "section": "2. Gewässerökologie (GeÖ)", "number": 16, "question": "Was ist eine Fischabstiegshilfe?", "answers": ["Ein spezielles Bauwerk, das den Fischen die stromaufwärts gerichtete Überwindung von Hindernissen (z.B. Stauwehre) ermöglicht.", "Ein spezielles Bauwerk, das die gefahrlose Abwanderung von Fischen ermöglichen soll (Umgehung der Turbine)", "Eine Einrichtung, die Anglern an steilen Ufern das gefahrlose Betreten des Gewässers ermöglicht."], "correct": [1], "page": 17, "lesson": 14}, {"id": 173, "section": "2. Gewässerökologie (GeÖ)", "number": 17, "question": "Was ist eine Fischaufstiegshilfe?", "answers": ["Ein spezielles Bauwerk, das den Fischen die stromaufwärts gerichtete Überwindung von Hindernissen (z.B. Stauwehre) ermöglicht.", "Ein spezielles Bauwerk, das die gefahrlose Abwanderung von Fischen ermöglichen soll (Umgehung der Turbine)", "Eine Einrichtung, die Anglern an steilen Ufern das gefahrlose Verlassen des Gewässers ermöglicht."], "correct": [0], "page": 17, "lesson": 14}, {"id": 174, "section": "2. Gewässerökologie (GeÖ)", "number": 18, "question": "Was muss man beim Fischfang bei hohen Wassertemperaturen vermehrt beachten?", "answers": ["Zurückgesetzte Fische haben schlechtere Überlebenschancen.", "Natürliche Köder wie Teig oder Kartoffeln halten sich nicht so lange am Haken.", "Fische beißen besonders gut, und es kann zu Massenfängen kommen."], "correct": [0], "page": 17, "lesson": 9}, {"id": 175, "section": "2. Gewässerökologie (GeÖ)", "number": 19, "question": "Was passiert bei der Photosynthese vereinfacht?", "answers": ["Pflanzen stellen aus Kohlenhydraten (Zucker) Licht und Sauerstoff her.", "Pflanzen stellen mit Hilfe von Lichtenergie Kohlenhydrate (Zucker) und Kohlenstoffdioxid her.", "Pflanzen produzieren mit Hilfe von Lichtenergie Kohlenhydrate (Zucker) und Sauerstoff."], "correct": [2], "page": 17, "lesson": 9}, {"id": 176, "section": "2. Gewässerökologie (GeÖ)", "number": 20, "question": "Was versteht man in der Ökologie unter dem Begriff Makrozoobenthos?", "answers": ["Bakterien und Pilze am Gewässergrund", "Wirbellose Lebewesen am Gewässergrund", "Pflanzen und Algen am Gewässergrund"], "correct": [1], "page": 18, "lesson": 12}, {"id": 177, "section": "2. Gewässerökologie (GeÖ)", "number": 21, "question": "Was versteht man in der Ökologie unter dem Begriff Phytoplankton?", "answers": ["In der Wassersäule frei schwebende kleinste Krebschen.", "In der Wassersäule frei schwebende kleinste Algen.", "Im Wasser wachsende Gefäßpflanzen."], "correct": [1], "page": 18, "lesson": 12}, {"id": 178, "section": "2. Gewässerökologie (GeÖ)", "number": 22, "question": "Was versteht man in der Ökologie unter dem Begriff Plankton?", "answers": ["Im Freiwasserraum lebende Lebewesen, die sich aktiv im Wasser auch gegen die Strömung bewegen können.", "Am Boden und festen Strukturen festsitzende Lebewesen.", "Im Freiwasserraum lebende, mit der Wasserbewegung treibende Organismen (Lebewesen)."], "correct": [2], "page": 18, "lesson": 12}, {"id": 179, "section": "2. Gewässerökologie (GeÖ)", "number": 23, "question": "Was versteht man in der Ökologie unter dem Begriff Zooplankton?", "answers": ["In der Wassersäule frei schwebende tierische Kleinstlebewesen.", "In der Wassersäule frei schwebende pflanzliche Kleinstlebewesen.", "In der Wassersäule frei schwebende pflanzliche Bakterien und Pilze."], "correct": [0], "page": 18, "lesson": 12}, {"id": 180, "section": "2. Gewässerökologie (GeÖ)", "number": 24, "question": "Was versteht man unter dem Begriff Algenblüte?", "answers": ["Die massenhafte Entwicklung von pflanzlichem Plankton und Cyanobakterien in einem Gewässer.", "Kleine, blütenähnliche Fortsätze auf Algen im Frühling.", "Das Auftreten von Algen an der Wasseroberfläche."], "correct": [0], "page": 18, "lesson": 13}, {"id": 181, "section": "2. Gewässerökologie (GeÖ)", "number": 25, "question": "Was versteht man unter dem Begriff Bioindikator?", "answers": ["Bestimmte Eigenschaften von gefangenen Fischen, die eine hohe biologische Wertigkeit belegen.", "Bestimmte Lebewesen (Zeigerorganismen), die Auskunft über den Zustand eines Gewässers geben.", "Bestimmte Signalstoffe im Wasser, die das Auffinden von Fischen erleichtern."], "correct": [1], "page": 18, "lesson": 13}, {"id": 182, "section": "2. Gewässerökologie (GeÖ)", "number": 26, "question": "Was versteht man unter dem Begriff Brackwasser?", "answers": ["Das durchmischte Salz- und Süßwasser mit geringem Salzgehalt im Mündungsbereich von Fließgewässern im Übergang zum Meer.", "Das Wasser mit hohem Nährstoffgehalt in Alt- und Nebenarmen.", "Das Wasser im Uferbereich von Tieflandflüssen."], "correct": [0], "page": 18, "lesson": 11}, {"id": 183, "section": "2. Gewässerökologie (GeÖ)", "number": 27, "question": "Was versteht man unter dem Begriff fischereiliche Hege?", "answers": ["Gefährdete Fischarten sollen besonders geschützt werden.", "Alle Maßnahmen, die der Erhaltung und Pflege eines dem Gewässer angepassten Fischbestandes dienen.", "Fischereiliche Hege soll die Artenvielfalt vergrößern."], "correct": [1], "page": 18, "lesson": 15}, {"id": 184, "section": "2. Gewässerökologie (GeÖ)", "number": 28, "question": "Was versteht man unter dem Begriff invasive Art?", "answers": ["Eine heimische Art, deren Ausbreitung bzw. Vermehrung bedroht ist.", "Eine gebietsfremde Art, die durch ihre Ausbreitung bzw. Vermehrung heimische Arten verdrängt.", "Eine heimische Art, die in menschlichen Siedlungen vorkommt."], "correct": [1], "page": 18, "lesson": 15}, {"id": 185, "section": "2. Gewässerökologie (GeÖ)", "number": 29, "question": "Was versteht man unter dem Begriff Laichhilfen?", "answers": ["Eingebrachtes Material, das fischartenspezifische Laichstrukturen schafft.", "Das gezielte Angeln auf große Elterntiere um kleineren, laichreifen Fischen die Fortpflanzung zu ermöglichen.", "Das Hältern von laichreifen Fischen um die Fortpflanzung zu unterstützen."], "correct": [0], "page": 18, "lesson": 15}, {"id": 186, "section": "2. Gewässerökologie (GeÖ)", "number": 30, "question": "Was versteht man unter dem Begriff Neophyten?", "answers": ["Heimische Pflanzenarten", "Nicht heimische Tierarten", "Nicht heimische Pflanzenarten."], "correct": [2], "page": 19, "lesson": 15}, {"id": 187, "section": "2. Gewässerökologie (GeÖ)", "number": 31, "question": "Was versteht man unter dem Begriff Neozoen?", "answers": ["Nicht heimische Tierarten.", "Heimische Tierarten", "Nicht heimische Pflanzenarten"], "correct": [0], "page": 19, "lesson": 15}, {"id": 188, "section": "2. Gewässerökologie (GeÖ)", "number": 32, "question": "Was versteht man unter dem Begriff Verbuttung?", "answers": ["Kleinwüchsigkeit laichreifer Fische infolge von Massenaufkommen.", "Ein Vorgang zur Butterherstellung unter Verwendung von Fischrogen.", "Eine körperliche Fehlentwicklung durch zu hohen Fischereidruck."], "correct": [0], "page": 19, "lesson": 15}, {"id": 189, "section": "2. Gewässerökologie (GeÖ)", "number": 33, "question": "Was versteht man unter dem Begriff Verlandung?", "answers": ["Die Verflachung eines Gewässers durch Pflanzenwachstum und Sedimenteintrag.", "Der langsam ansteigende Übergang vom Gewässer in das umliegende Festland.", "Das Aufschütten von Geröll um den Zugang zum Gewässer zu erleichtern."], "correct": [0], "page": 19, "lesson": 15}, {"id": 190, "section": "2. Gewässerökologie (GeÖ)", "number": 34, "question": "Was versteht man unter dem fischereilichen Ertragspotenzial?", "answers": ["Der größte abschöpfbare Fischertrag eines Gewässers.", "Der mögliche nachhaltig abschöpfbare Fischertrag eines Gewässers.", "Die Fischproduktion eines Gewässers."], "correct": [1], "page": 19, "lesson": 15}, {"id": 191, "section": "2. Gewässerökologie (GeÖ)", "number": 35, "question": "Was versteht man unter dem Umkippen eines Gewässers?", "answers": ["Bakterielle Abbauprozesse im Gewässer, bei denen mehr Sauerstoff produziert als durch die Pflanzen verbraucht wird.", "Umwälzung der Wasserschichten durch starke Windeinwirkung", "Bakterielle Abbauprozesse im Gewässer, bei denen mehr Sauerstoff verbraucht als durch die Pflanzen gebildet wird."], "correct": [2], "page": 19, "lesson": 9}, {"id": 192, "section": "2. Gewässerökologie (GeÖ)", "number": 36, "question": "Was versteht man unter den Begriffen Gumpen bzw. Kolk?", "answers": ["Flache Bereiche mit hoher Fließgeschwindigkeit.", "Eine Vertiefung in einem Fließgewässer.", "Flache Bereiche mit niedriger Fließgeschwindigkeit."], "correct": [1], "page": 19, "lesson": 11}, {"id": 193, "section": "2. Gewässerökologie (GeÖ)", "number": 37, "question": "Was versteht man unter der Sommerstagnation eines Sees?", "answers": ["Das Ausbleiben von Fischwachstum in Seen in den Sommermonaten.", "Im Sommer stagniert die Oberflächenströmung durch das starke Aufkommen von Algen.", "Die warme Oberflächenschicht lagert sich stabil über der kühlen Tiefenschicht."], "correct": [2], "page": 19, "lesson": 10}, {"id": 194, "section": "2. Gewässerökologie (GeÖ)", "number": 38, "question": "Was versteht man unter der Sprungschicht eines Sees?", "answers": ["Die Trennlinie zwischen warmem Oberflächenwasser und kühlerem Tiefenwasser während der Winterstagnation.", "Die Trennlinie zwischen warmem Oberflächenwasser und kühlerem Tiefenwasser während der Sommerstagnation.", "Die Trennlinie zwischen kaltem Oberflächenwasser und wärmerem Tiefenwasser während der Sommerstagnation."], "correct": [1], "page": 19, "lesson": 10}, {"id": 195, "section": "2. Gewässerökologie (GeÖ)", "number": 39, "question": "Was versteht man unter der Vollzirkulation eines Sees?", "answers": ["Strudelähnliche Strömungen auf der Wasseroberfläche.", "Eine vollständig verknüpfte Nahrungskette innerhalb eines Sees.", "Die vollständige Vermischung von Tiefen- und Oberflächenwasser."], "correct": [2], "page": 19, "lesson": 10}, {"id": 196, "section": "2. Gewässerökologie (GeÖ)", "number": 40, "question": "Was versteht man unter der Winterstagnation eines Sees?", "answers": ["Durch das Zufrieren der Oberfläche wird die Durchmischung durch Wind unterbunden.", "Die Temperaturschichtung infolge des stark abkühlenden Oberflächenwassers.", "Das Ausbleiben von Fischwachstum in Seen in den Wintermonaten."], "correct": [1], "page": 19, "lesson": 10}, {"id": 197, "section": "2. Gewässerökologie (GeÖ)", "number": 41, "question": "Was versteht man unter einer nachhaltigen fischereilichen Bewirtschaftung?", "answers": ["Die Entnahme von Fischen und gleichzeitige Hegemaßnahmen, bei denen der Fischbestand in seinen wesentlichen Eigenschaften erhalten bleibt.", "Das intensive Befischen eines natürlichen Gewässers.", "Das Einsetzen von bestimmten Fischarten"], "correct": [0], "page": 20, "lesson": 15}, {"id": 198, "section": "2. Gewässerökologie (GeÖ)", "number": 42, "question": "Was zeigt der pH-Wert an?", "answers": ["Den Phosphorgehalt des Wasser.", "Den physikalischen Härtegrad des Wassers.", "Er ist ein Maß für den sauren oder basischen Charakter des Wassers."], "correct": [2], "page": 20, "lesson": 13}, {"id": 199, "section": "2. Gewässerökologie (GeÖ)", "number": 43, "question": "Welche Auswirkungen haben die zunehmenden Starkregenereignisse durch den Klimawandel auf die Fließgewässer?", "answers": ["Erhöhte Artenvielfalt durch steigende Wasserstände.", "Sinkende Wassertemperaturen, dadurch erhöhter Sauerstoffgehalt.", "Es kann vermehrt zu Hochwasserereignissen kommen."], "correct": [2], "page": 20, "lesson": 14}, {"id": 200, "section": "2. Gewässerökologie (GeÖ)", "number": 44, "question": "Welche Auswirkungen hat der Klimawandel auf die Artengemeinschaften in Gewässern?", "answers": ["Die veränderten Lebensraumbedingungen können die Fischregionen verschieben.", "Verbesserte Lebensraumbedingungen für alle Fischarten durch höhere Wassertemperaturen.", "Im Gewässer wird es keine Auswirkungen auf die Artengemeinschaften geben."], "correct": [0], "page": 20, "lesson": 14}, {"id": 201, "section": "2. Gewässerökologie (GeÖ)", "number": 45, "question": "Welche Auswirkungen hat der Klimawandel auf stehende Gewässer?", "answers": ["Der Ertrag der Gewässer steigt und die Fische werden größer.", "Eine stärkere Erwärmung im Sommer und ggf. längere Stagnationsphasen mit Sauerstoffmangel.", "Erhöhte Artenvielfalt durch steigende Wasserstände."], "correct": [1], "page": 20, "lesson": 14}, {"id": 202, "section": "2. Gewässerökologie (GeÖ)", "number": 46, "question": "Welche Auswirkungen kann der Klimawandel auf Fließgewässer haben?", "answers": ["Gewässererwärmung und geringere Abflussmengen bis hin zum Trockenfallen.", "Sinkende Wassertemperaturen, dadurch erhöhter Sauerstoffgehalt.", "Dauerhaft erhöhte Wasserstände."], "correct": [0], "page": 20, "lesson": 14}, {"id": 203, "section": "2. Gewässerökologie (GeÖ)", "number": 47, "question": "Welche Bedeutung haben Bäume und Äste in einem Gewässer?", "answers": ["Sie sind Nahrungsquelle für holzfressende Barsche.", "Sie beeinträchtigen die Strömung des Wassers und sollten aus dem Gewässer entfernt werden.", "Sie dienen als Unterstand und werden von Fischnährtieren besiedelt."], "correct": [2], "page": 20, "lesson": 14}, {"id": 204, "section": "2. Gewässerökologie (GeÖ)", "number": 48, "question": "Welche Bedeutung haben Flachwasserzonen in Fließgewässern?", "answers": ["In diesen Bereichen können sich ausgewachsene Fische auf dem Sediment ausruhen.", "Lebensraum für Jungfische. Laichplätze für bestimmte Fischarten.", "Sie beherbergen keine Fische und sind deshalb eher unbedeutend."], "correct": [1], "page": 20, "lesson": 14}, {"id": 205, "section": "2. Gewässerökologie (GeÖ)", "number": 49, "question": "Welche Bedeutung haben Kiesbänke in Fließgewässern?", "answers": ["Sie sind Jagdgründe für Raubfische.", "Sie sind Rückzugsort für ausgewachsene Großsalmoniden.", "Sie dienen als Laichplätze."], "correct": [2], "page": 20, "lesson": 14}, {"id": 206, "section": "2. Gewässerökologie (GeÖ)", "number": 50, "question": "Welche Bedeutung hat die Uferzone für ein Gewässer?", "answers": ["Sie stellt ein großes Nahrungsangebot für die Fische bereit, bietet Schutz und ist der strukturreichste Bereich im Gewässer.", "Aufgrund des dichten Uferbewuchses wird es von Wasserlebewesen gemieden.", "Aufgrund der geringen Wassertiefen können sich dort keine Fische, sondern nur kleine Wirbellose aufhalten."], "correct": [0], "page": 20, "lesson": 14}, {"id": 207, "section": "2. Gewässerökologie (GeÖ)", "number": 51, "question": "Welche Bedeutung hat ein uferbegleitender Gehölzsaum von Weiden und Erlen für kleinere Fließgewässer?", "answers": ["Sie entnehmen den Gewässer Nährstoffe, weshalb Fische schlechter abwachsen.", "Besonders in kleinen Fließgewässern hat der uferbegleitende Gehölzsaum eine geringe Bedeutung.", "Beschattung des Wasserkörpers, Befestigung des Uferbereichs und Unterstand für Fische."], "correct": [2], "page": 21, "lesson": 14}, {"id": 208, "section": "2. Gewässerökologie (GeÖ)", "number": 52, "question": "Welche Besatzkombination ist für ein Gewässer nie sinnvoll?", "answers": ["Bitterling und Teichmuscheln.", "Hechte und Forellen.", "Rotauge und Rotfedern."], "correct": [1], "page": 21, "lesson": 15}, {"id": 209, "section": "2. Gewässerökologie (GeÖ)", "number": 53, "question": "Welche der folgenden Organismengruppen fressen auch Fischbrut und Kleinfische?", "answers": ["Libellenlarven, Gelbrandkäfer und Rückenschwimmer.", "Quappen, Steinfliegenlarven, Kriebelmückenlarven", "Groppen, Egel, Eintagsfliegenlarven"], "correct": [0], "page": 21, "lesson": 12}, {"id": 210, "section": "2. Gewässerökologie (GeÖ)", "number": 54, "question": "Welche Eigenschaft ist charakteristisch für nährstoffarme Seen?", "answers": ["Große Sichttiefe und großes Algen- und/oder Pflanzenwachstum.", "Geringe Sichttiefe und geringes Algen- und/oder Pflanzenwachstum.", "Große Sichttiefe und geringes Algen- und/oder Pflanzenwachstum"], "correct": [2], "page": 21, "lesson": 13}, {"id": 211, "section": "2. Gewässerökologie (GeÖ)", "number": 55, "question": "Welche Eigenschaft ist charakteristisch für sehr nährstoffreiche Seen?", "answers": ["Kaum Algen- und Pflanzenwachstum, sehr gute Abwachsraten der Fische.", "Starkes Algen- und/oder Pflanzenwachstum vor allem im Frühjahr und Sommer.", "Starkes Algen- und/oder Pflanzenwachstum vor allem im Herbst und Winter."], "correct": [1], "page": 21, "lesson": 13}, {"id": 212, "section": "2. Gewässerökologie (GeÖ)", "number": 56, "question": "Welche Eigenschaft ist u.a. charakteristisch für einen neu entstandenen Baggersee?", "answers": ["Großes Aufkommen von Raubfischen.", "Ausgedehnte Flachwasserbereiche.", "Ein geringes Nahrungsangebot für Fische."], "correct": [2], "page": 21, "lesson": 13}, {"id": 213, "section": "2. Gewässerökologie (GeÖ)", "number": 57, "question": "Welche Eigenschaften kennzeichnen die Äschenregion eines Fließgewässers?", "answers": ["Kiesiger Untergrund, sehr hohe Fließgeschwindigkeiten und konstant hohe Wassertemperaturen.", "Hier ist nur die Fischerei auf Äschen erlaubt.", "Kiesiger Untergrund, rasch fließendes sommerkühles und sauerstoffreiches Wasser."], "correct": [2], "page": 21, "lesson": 11}, {"id": 214, "section": "2. Gewässerökologie (GeÖ)", "number": 58, "question": "Welche Eigenschaften kennzeichnen die Barbenregion eines Fließgewässers?", "answers": ["Hier ist nur die Fischerei auf Barben erlaubt.", "Kiesig-steiniger Untergrund, fließendes und sauerstoffreiches Wasser.", "Kiesig-sandiger Untergrund, fließendes und sauerstoffreiches Wasser."], "correct": [2], "page": 21, "lesson": 11}, {"id": 215, "section": "2. Gewässerökologie (GeÖ)", "number": 59, "question": "Welche Eigenschaften kennzeichnen die Brassen bzw. Bleiregion eines Fließgewässers?", "answers": ["Kiesig-steiniger Untergrund, moderate Fließgeschwindigkeiten und Sauerstoffarmut im Wasser", "Feinsediment geprägter Untergrund, mäßig fließendes Wasser und Sauerstoffmangel am Gewässergrund möglich.", "Hier ist nur die Fischerei auf Brassen (Bleie) erlaubt."], "correct": [1], "page": 21, "lesson": 11}, {"id": 216, "section": "2. Gewässerökologie (GeÖ)", "number": 60, "question": "Welche Eigenschaften kennzeichnen die Forellenregion eines Fließgewässers?", "answers": ["Kiesig-steiniger Untergrund, rasch bis turbulent fließendes sommerkaltes und sauerstoffreiches Wasser.", "Hier ist nur die Fischerei auf Forellen erlaubt.", "Kiesig-steiniger Untergrund, moderate Fließgeschwindigkeiten und Sauerstoffarmut im Wasser."], "correct": [0], "page": 21, "lesson": 11}, {"id": 217, "section": "2. Gewässerökologie (GeÖ)", "number": 61, "question": "Welche Eigenschaften kennzeichnen die Kaulbarsch-/ Flunderregion eines Fließgewässers?", "answers": ["Feinsediment geprägter Untergrund und langsam fließendes Wasser; häufig mit Gezeiteneinfluss.", "Hier ist nur die Fischerei auf Kaulbarsch und Flunder erlaubt.", "Schlammiger Untergrund und hoher Sauerstoffgehalt, häufig mit Gezeiteneinfluss."], "correct": [0], "page": 22, "lesson": 11}, {"id": 218, "section": "2. Gewässerökologie (GeÖ)", "number": 62, "question": "Welche Faktoren sollten bei der Berechnung der Fischbesatzmenge berücksichtigt werden, sofern eine Fischbesatzmaßnahme sinnvoll ist?", "answers": ["Art und Größe der vorhandenen Fische eines Gewässers", "Schlechte Fangerfolge der Fischereiausübungsberechtigten", "Ertragsfähigkeit des Gewässers, vorhandener Fischbestand, Gewässertyp, Gewässerstruktur, Gewässergröße, Beeinträchtigungen, Prädationsdruck durch z.B. Kormoran."], "correct": [2], "page": 22, "lesson": 15}, {"id": 219, "section": "2. Gewässerökologie (GeÖ)", "number": 63, "ques
