 "correct": [1], "page": 44, "lesson": 20}, {"id": 428, "section": "4. Gerätekunde (Gk)", "number": 16, "question": "Was ist für die Stationärrolle charakteristisch?", "answers": ["Die Spule steht beim Einholen der Schnur fest.", "Die Spule dreht sich um die eigene Achse.", "Die Rollenachse steht nicht parallel zum Rutenschaft."], "correct": [0], "page": 44, "lesson": 20}, {"id": 429, "section": "4. Gerätekunde (Gk)", "number": 17, "question": "Was ist für eine Feederrute charakteristisch?", "answers": ["Posen lassen sich damit besonders gut auswerfen.", "Sie ist federleicht.", "Die sensible Endspitze zur Bissanzeige."], "correct": [2], "page": 44, "lesson": 20}, {"id": 430, "section": "4. Gerätekunde (Gk)", "number": 18, "question": "Was können schadhafte Schnurlaufringe an der Angelrute zur Folge haben?", "answers": ["Eine Beschädigung der Hauptschnur, die zum Abriss beim Drill führen kann.", "Das Auswerfen des Köders wird beeinträchtigt.", "Das Vorfach wird beschädigt. Die Hauptschnur nimmt keinen Schaden und kann nicht reißen."], "correct": [0], "page": 44, "lesson": 20}, {"id": 431, "section": "4. Gerätekunde (Gk)", "number": 19, "question": "Was sollte bei der Handhabung einer Teleskoprute beachten werden?", "answers": ["Die Mittelteile werden zuletzt zusammengeschoben.", "Sie muss nach dem Angeln mit einem Tuch getrocknet werden.", "Die Spitze wird stets zuletzt eingeschoben; Vorsichtiges Zusammenschieben der einzelnen Teleskopteile."], "correct": [2], "page": 44, "lesson": 20}, {"id": 432, "section": "4. Gerätekunde (Gk)", "number": 20, "question": "Was sollte beim Zusammenziehen eines Knotens bei einer monofilen Angelschnur beachtet werden?", "answers": ["Um den Reibungswiderstand zu verringern, sollte die Schnur angefeuchtet werden.", "Möglichst ruckartig anziehen, damit die Lagen ineinandergreifen.", "Nicht zu fest anziehen, das erfolgt im Drill eines großen Fisches."], "correct": [0], "page": 44, "lesson": 21}, {"id": 433, "section": "4. Gerätekunde (Gk)", "number": 21, "question": "Was sollte mit den ersten Metern der Hauptschnur gemacht werden, wenn diese aufgeraut sind?", "answers": ["Der aufgeraute Abschnitt kann vorsichtig mit Schleifpapier geglättet werden", "Der aufgeraute Abschnitt der Schnur sollte abgeschnitten und ordnungsgemäß entsorgt werden.", "Solange die Schnur nur aufgeraut ist und nicht über die Hälfte angerissen, ist keine Handlung notwendig."], "correct": [1], "page": 44, "lesson": 21}, {"id": 434, "section": "4. Gerätekunde (Gk)", "number": 22, "question": "Was versteht man unter Brandungsangeln?", "answers": ["Eine besondere Art des Grundangelns vom Meeresstrand.", "Das Angeln gegen den Wind.", "Das Angeln bei Wellengang."], "correct": [0], "page": 44, "lesson": 23}, {"id": 435, "section": "4. Gerätekunde (Gk)", "number": 23, "question": "Was versteht man unter Watfischen?", "answers": ["Das Fischen im Wasser stehend oder im Wasser gehend.", "Das lange Warten zwischen Biss und Anschlag.", "Das Fischen vom Ufer aus."], "correct": [0], "page": 45, "lesson": 23}, {"id": 436, "section": "4. Gerätekunde (Gk)", "number": 24, "question": "Was versteht man unter dem Begriff Pose?", "answers": ["Ein Grundblei mit Auftrieb.", "Die Körperhaltung des Anglers beim Wurf.", "Ein auftreibender Bissanzeiger, der den Köder in einer bestimmten Wassertiefe hält."], "correct": [2], "page": 45, "lesson": 22}, {"id": 437, "section": "4. Gerätekunde (Gk)", "number": 25, "question": "Was versteht man unter dem Begriff Schonhaken?", "answers": ["Ein Haken ohne Spitze", "Einen Haken ohne Widerhaken.", "Ein Haken, der bei großen Fischen aufbiegt."], "correct": [1], "page": 45, "lesson": 22}, {"id": 438, "section": "4. Gerätekunde (Gk)", "number": 26, "question": "Was versteht man unter dem Begriff Streetfishing?", "answers": ["Das Angeln in städtischem Gebiet.", "Wenn sich beim Angeln Fang an Fang reiht.", "Das Angeln von einem Gehweg aus"], "correct": [0], "page": 45, "lesson": 23}, {"id": 439, "section": "4. Gerätekunde (Gk)", "number": 27, "question": "Was versteht man unter dem Heißräuchern von Fisch?", "answers": ["Das Räuchern bei über 65 Grad Celsius.", "Das Räuchern bei nicht mehr als 20 Grad Celsius.", "Wenn beim Braten von Fisch Rauch entsteht."], "correct": [0], "page": 45, "lesson": 24}, {"id": 440, "section": "4. Gerätekunde (Gk)", "number": 28, "question": "Was versteht man unter dem Kalträuchern von Fisch?", "answers": ["Wenn beim Braten von Fisch Rauch entsteht.", "Das Räuchern bei über 65 Grad Celsius.", "Das Räuchern bei nicht mehr als 20 Grad Celsius."], "correct": [2], "page": 45, "lesson": 24}, {"id": 441, "section": "4. Gerätekunde (Gk)", "number": 29, "question": "Was versteht man unter einem Blinker?", "answers": ["Einen Köder, der leuchtet.", "Einen taumelnder Köder aus Metall.", "Einen Köder, der um eine starre Achse rotiert."], "correct": [1], "page": 45, "lesson": 23}, {"id": 442, "section": "4. Gerätekunde (Gk)", "number": 30, "question": "Was versteht man unter einem Boilie?", "answers": ["Boilies sind aus Mais hergestellt, ähnlich wie Popcorn.", "Boilies erwärmen das Wasser in ihrer Umgebung, um Fische anzulocken.", "Boilies sind gekochte Teigkugeln zum Fang von Karpfenartigen (Cypriniden)."], "correct": [2], "page": 45, "lesson": 23}, {"id": 443, "section": "4. Gerätekunde (Gk)", "number": 31, "question": "Was versteht man unter einem Pilker?", "answers": ["Ein Köder aus Gummi, der einen Fisch imitiert.", "Ein Köder, der beim Brandungsangeln weit ausgeworfen wird.", "Ein Pilker ist ein schwerer Metallköder, der durch Heben und Senken eine Beutefischbewegung imitiert."], "correct": [2], "page": 45, "lesson": 23}, {"id": 444, "section": "4. Gerätekunde (Gk)", "number": 32, "question": "Was versteht man unter Schleppangeln?", "answers": ["Das Angeln mit schwerer Ausrüstung.", "Angeln vom fahrenden Boot, bei der Köder in größerem Abstand geführt werden.", "Das Vertikalangeln unter dem Boot."], "correct": [1], "page": 45, "lesson": 23}, {"id": 445, "section": "4. Gerätekunde (Gk)", "number": 33, "question": "Was wird als Rod-Pod bezeichnet?", "answers": ["Ein Köder zum Raubfischangeln.", "Ein Topf, in dem Ruten hochkant aufbewahrt werden.", "Ein Rutenhalter, der vorwiegend beim Karpfenangeln eingesetzt wird."], "correct": [2], "page": 45, "lesson": 22}, {"id": 446, "section": "4. Gerätekunde (Gk)", "number": 34, "question": "Welche allgemeine Regel für die Schnur- und Hakenwahl ist richtig?", "answers": ["Schnur und Haken so stabil wie möglich.", "Schnur so dünn wie möglich, Haken nicht größer als nötig.", "Die Schnur nicht dünner als nötig, der Haken nicht kleiner als nötig."], "correct": [2], "page": 46, "lesson": 21}, {"id": 447, "section": "4. Gerätekunde (Gk)", "number": 35, "question": "Welche allgemeine Regel gilt bei der Zusammenstellung von Haken, Schnur und Rute?", "answers": ["Großer Haken, starke Schnur, weiche Rutenspitze; kleiner Haken, dünne Schnur, harte Rutenspitze.", "Großer Haken, starke Schnur und steife Rutenspitze; kleiner Haken, dünne Schnur und weiche Rutenspitze.", "Hakengröße, Schnurdurchmesser und Rute müssen nicht aufeinander abgestimmt sein."], "correct": [1], "page": 46, "lesson": 21}, {"id": 448, "section": "4. Gerätekunde (Gk)", "number": 36, "question": "Welche allgemeine Regel ist bei der Wahl des Wirbels zu beachten?", "answers": ["Der Wirbel sollte eine geringere Tragkraft als die Hauptschnur haben.", "Der Wirbel sollte möglichst klein und unauffällig sein.", "Der Wirbel sollte eine größere Tragfähigkeit als die Hauptschnur haben."], "correct": [2], "page": 46, "lesson": 21}, {"id": 449, "section": "4. Gerätekunde (Gk)", "number": 37, "question": "Welche Angelhaken sollen beim Angeln auf Karpfenartige (Cypriniden) benutzt werden?", "answers": ["Drillinge", "Doppelhaken", "Einfachhaken"], "correct": [2], "page": 46, "lesson": 22}, {"id": 450, "section": "4. Gerätekunde (Gk)", "number": 38, "question": "Welche Angelmethode wird für den Fang kleiner Weißfische häufig angewandt?", "answers": ["Brandungsangeln", "Stippangeln", "Spinnangeln"], "correct": [1], "page": 46, "lesson": 23}, {"id": 451, "section": "4. Gerätekunde (Gk)", "number": 39, "question": "Welche Angelmethode wird für den Fang von Aal häufig angewandt?", "answers": ["Fliegenfischen", "Spinnangeln", "Grundangeln"], "correct": [2], "page": 46, "lesson": 23}, {"id": 452, "section": "4. Gerätekunde (Gk)", "number": 40, "question": "Welche Angelmethode wird für den Fang von Dorsch und Flunder häufig angewandt?", "answers": ["Stippangeln", "Brandungsangeln", "Posenangeln"], "correct": [1], "page": 46, "lesson": 23}, {"id": 453, "section": "4. Gerätekunde (Gk)", "number": 41, "question": "Welche Angelmethode wird für den Fang von Forellen häufig angewandt?", "answers": ["Brandungsangeln", "Stippangeln", "Fliegenfischen"], "correct": [2], "page": 46, "lesson": 23}, {"id": 454, "section": "4. Gerätekunde (Gk)", "number": 42, "question": "Welche Angelmethode wird für den Fang von Hecht und Zander häufig angewandt?", "answers": ["Brandungsangeln", "Stippangeln", "Spinnangeln"], "correct": [2], "page": 46, "lesson": 23}, {"id": 455, "section": "4. Gerätekunde (Gk)", "number": 43, "question": "Welche Angelmethode wird für den Fang von Hering häufig angewandt?", "answers": ["Brandungsangeln", "Paternosterangeln", "Fliegenfischen"], "correct": [1], "page": 46, "lesson": 23}, {"id": 456, "section": "4. Gerätekunde (Gk)", "number": 44, "question": "Welche Angelmethode wird für den Fang von Karpfen häufig angewandt?", "answers": ["Grundangeln", "Spinnangeln", "Paternosterangeln"], "correct": [0], "page": 46, "lesson": 23}, {"id": 457, "section": "4. Gerätekunde (Gk)", "number": 45, "question": "Welche Angelmethode wird für den Fang von Rotaugen häufig angewandt?", "answers": ["Paternosterangeln", "Spinnangeln", "Posenangeln"], "correct": [2], "page": 46, "lesson": 23}, {"id": 458, "section": "4. Gerätekunde (Gk)", "number": 46, "question": "Welche Besonderheit besitzt eine Selbsthakmontage?", "answers": ["Der Angler kann sich bei dieser Montage leicht verletzen.", "Der Anhieb kann erst spät nach dem Biss erfolgen.", "Es muss kein unmittelbarer Anhieb nach dem Biss gesetzt werden."], "correct": [2], "page": 47, "lesson": 22}, {"id": 459, "section": "4. Gerätekunde (Gk)", "number": 47, "question": "Welche Besonderheiten gibt es beim Streetfishing zu beachten?", "answers": ["Es darf zu keiner Gefährdung von Passanten durch das Auswerfen oder Drillen kommen.", "Nachts haben Angler reflektierende Kleidung zu tragen.", "Die Straßenverkehrsordnung hebt das Fischereirecht auf."], "correct": [0], "page": 47, "lesson": 24}, {"id": 460, "section": "4. Gerätekunde (Gk)", "number": 48, "question": "Welche Fischarten können mit einem toten Köderfisch beangelt werden?", "answers": ["Schleie und Karpfen.", "Zander, Aal, Hecht.", "Alle Cypriniden."], "correct": [1], "page": 47, "lesson": 23}, {"id": 461, "section": "4. Gerätekunde (Gk)", "number": 49, "question": "Welche Gefahr besteht beim Watfischen und dem Tragen einer Wathose?", "answers": ["Bei einem Sturz kann sich die Wathose mit Wasser füllen, wodurch es zum Ertrinken kommen kann.", "Durch Überhitzung kann eine Dehydrierung des Anglers eintreten.", "Bei einem Sturz drückt das Wasser die Hose an den Körper."], "correct": [0], "page": 47, "lesson": 24}, {"id": 462, "section": "4. Gerätekunde (Gk)", "number": 50, "question": "Welche Köder werden in der Regel beim Grundangeln verwendet?", "answers": ["Blinker, Spinner, Twister.", "Künstliche Fliegen, Nymphen, Streamer.", "Würmer, toter Köderfisch, Boilies."], "correct": [2], "page": 47, "lesson": 23}, {"id": 463, "section": "4. Gerätekunde (Gk)", "number": 51, "question": "Welche Köder werden in der Regel beim Brandungsangeln verwendet?", "answers": ["Maden, Mais, Teig.", "Wattwürmer, Fetzenköder, Seeringelwürmer.", "Blinker, Spinner, Twister."], "correct": [1], "page": 47, "lesson": 23}, {"id": 464, "section": "4. Gerätekunde (Gk)", "number": 52, "question": "Welche Köder werden in der Regel beim Fliegenfischen verwendet?", "answers": ["Künstliche Fliegen, Nymphen, Streamer.", "Blinker, Spinner, Twister.", "Wobbler"], "correct": [0], "page": 47, "lesson": 23}, {"id": 465, "section": "4. Gerätekunde (Gk)", "number": 53, "question": "Welche Köder werden in der Regel beim Schleppangeln verwendet?", "answers": ["Wobbler, Blinker, Gummifisch.", "Watt- und Seeringelwurm", "Maden, Mais, Teig."], "correct": [0], "page": 47, "lesson": 23}, {"id": 466, "section": "4. Gerätekunde (Gk)", "number": 54, "question": "Welche Köder werden in der Regel beim Spinnangeln verwendet?", "answers": ["Blinker, Spinner, Twister.", "Mais und Made", "Tauwurm, Mehlwurm, Mistwurm"], "correct": [0], "page": 47, "lesson": 23}, {"id": 467, "section": "4. Gerätekunde (Gk)", "number": 55, "question": "Welche Köder werden in der Regel beim Stippangeln verwendet?", "answers": ["Blinker, Spinner, Twister.", "Watt- und Seeringelwurm", "Maden, Mais, Teig."], "correct": [2], "page": 47, "lesson": 23}, {"id": 468, "section": "4. Gerätekunde (Gk)", "number": 56, "question": "Welche Nachteile hat eine Steckrute gegenüber einer Teleskoprute?", "answers": ["Die Steckrute hat in der Regel eine ungünstigere Transportlänge.", "Die Steckrute ist anfälliger für Verschmutzungen.", "Die Steckrute ist empfindlicher und anfälliger für Beschädigungen."], "correct": [0], "page": 47, "lesson": 20}, {"id": 469, "section": "4. Gerätekunde (Gk)", "number": 57, "question": "Welche Nachteile hat eine Teleskoprute gegenüber einer Steckrute?", "answers": ["Die Rute hat bei gleicher Länge und gleichem Wurfgewicht eine schlechtere Aktion.", "Die Rute ist kopflastig.", "Die Rute hat eine kürzere Maximallänge."], "correct": [0], "page": 47, "lesson": 20}, {"id": 470, "section": "4. Gerätekunde (Gk)", "number": 58, "question": "Welche Rutenringe werden am stärksten belastet?", "answers": ["Alle Ringe werden gleich stark belastet.", "Die nahe der Rolle gelegenen Ringe.", "Spitzen- oder Endringe."], "correct": [2], "page": 48, "lesson": 20}, {"id": 471, "section": "4. Gerätekunde (Gk)", "number": 59, "question": "Welche sind die wichtigsten Qualitätseinbußen bei einer zu lang andauernden unsachgemäßen Lagerung eines Fisches?", "answers": ["Zunehmendes Keimwachstum und Veränderungen der Fleischbeschaffenheit.", "Der Fisch verliert an Gewicht.", "Erst nimmt das Keimwachstum zu, dann reduziert es sich wieder."], "correct": [0], "page": 48, "lesson": 24}, {"id": 472, "section": "4. Gerätekunde (Gk)", "number": 60, "question": "Welchem Zweck dient die Schnurbremse bei einer Stationärrolle?", "answers": ["Die Bremse blockiert, bevor der Fisch zu tief abtaucht.", "Die Schnurbremse verhindert zu weite Würfe.", "Der Grad des Bremsens kann der Reißfestigkeit der Schnur angepasst werden."], "correct": [2], "page": 48, "lesson": 21}, {"id": 473, "section": "4. Gerätekunde (Gk)", "number": 61, "question": "Welchen Zweck hat ein Wirbel?", "answers": ["Ein Wirbel vermeidet Schnurverdrehungen/Schnurdrall.", "Der Wirbel verstärkt die Montage.", "Durch den Wirbel entfallen schwer zu bindende Knoten."], "correct": [0], "page": 48, "lesson": 21}, {"id": 474, "section": "4. Gerätekunde (Gk)", "number": 62, "question": "Welcher ist der wichtigste Gerätetest vor Beginn des Angelns?", "answers": ["Überprüfung der Angel samt Montage durch Zugprobe und Einstellen der Bremse.", "Hakengröße und Bremseinstellung müssen aufeinander abgestimmt werden.", "Überprüfung der Rutenaktion durch Zugprobe."], "correct": [0], "page": 48, "lesson": 21}, {"id": 475, "section": "4. Gerätekunde (Gk)", "number": 63, "question": "Welcher Kunstköder besitzt eine Tauchschaufel?", "answers": ["Der Blinker", "Der Wobbler", "Der Spinner"], "correct": [1], "page": 48, "lesson": 23}, {"id": 476, "section": "4. Gerätekunde (Gk)", "number": 64, "question": "Welches Blei wird in der Regel beim Brandungsangeln benutzt?", "answers": ["Klemmblei", "Krallenblei", "Schrotblei"], "correct": [1], "page": 48, "lesson": 22}, {"id": 477, "section": "4. Gerätekunde (Gk)", "number": 65, "question": "Welches Blei wird in der Regel beim Grundangeln benutzt?", "answers": ["Klemmblei.", "Blei, dass im Bissanzeiger (Pose) integriert ist.", "Sarg- und Birnenblei."], "correct": [2], "page": 48, "lesson": 22}, {"id": 478, "section": "4. Gerätekunde (Gk)", "number": 66, "question": "Welches Blei wird in der Regel beim Posenangeln benutzt?", "answers": ["Sarg- und Birnenblei.", "Schrotbleie", "Krallenblei"], "correct": [1], "page": 48, "lesson": 22}, {"id": 479, "section": "4. Gerätekunde (Gk)", "number": 67, "question": "Welches Organ muss beim Ausnehmen eines Fisches separat entfernt werden?", "answers": ["Die Schwimmblase", "Der Magen", "Die Niere."], "correct": [2], "page": 48, "lesson": 24}, {"id": 480, "section": "4. Gerätekunde (Gk)", "number": 68, "question": "Wie beeinflussen Knoten die Tragfähigkeit der Schnur?", "answers": ["Die Tragfähigkeit ist am Knoten höher.", "Die Tragfähigkeit ist am Knoten geringer.", "Die Tragfähigkeit verändert sich am Knoten nicht."], "correct": [1], "page": 48, "lesson": 21}, {"id": 481, "section": "4. Gerätekunde (Gk)", "number": 69, "question": "Wie kann man Haken schonend aus dem Fischmaul entfernen?", "answers": ["Durch schnelles ruckartiges Ziehen.", "Lösezange, Hakenlöser.", "Mit nassen Händen."], "correct": [1], "page": 48, "lesson": 22}, {"id": 482, "section": "4. Gerätekunde (Gk)", "number": 70, "question": "Wie nennt man eine Angelrolle mit rotierender Spule?", "answers": ["Multirolle", "Stationärrolle", "Kapselrolle"], "correct": [0], "page": 49, "lesson": 20}, {"id": 483, "section": "4. Gerätekunde (Gk)", "number": 71, "question": "Wie nennt man eine Angelrolle, bei der Rute und Rollenachse parallel zueinander stehen?", "answers": ["Stationärrolle", "Multirolle", "Fliegenrolle"], "correct": [0], "page": 49, "lesson": 20}, {"id": 484, "section": "4. Gerätekunde (Gk)", "number": 72, "question": "Wie sollte die Schnurbremse eingestellt sein?", "answers": ["Nach der Reißfestigkeit der Vorfach- bzw. Hauptschnur.", "So fest wie möglich, damit der Fisch keine Schnur abzieht.", "Je kleiner der Haken, desto fester die Bremse."], "correct": [0], "page": 49, "lesson": 21}, {"id": 485, "section": "4. Gerätekunde (Gk)", "number": 73, "question": "Wie werden Angelschnüre klassifiziert?", "answers": ["Nach Farbe und Durchmesser.", "Nach ihrem Durchmesser und ihrer Tragkraft.", "Nach Durchmesser und Dehnbarkeit."], "correct": [1], "page": 49, "lesson": 21}, {"id": 486, "section": "4. Gerätekunde (Gk)", "number": 74, "question": "Wie werden Fliegenschnüre klassifiziert?", "answers": ["Nach der Länge.", "Nach dem Gewicht (Schnurklassifizierung nach AFTMA).", "Nach der Farbe (RAL Code)."], "correct": [1], "page": 49, "lesson": 21}, {"id": 487, "section": "4. Gerätekunde (Gk)", "number": 75, "question": "Wodurch kann die senkrechte Stellung einer Pose im Wasser erreicht werden?", "answers": ["Durch Beschwerung mit Gewichten oberhalb der Pose, die den Auftrieb der Pose nicht übersteigen.", "Durch ein steiles Eintauchen der Pose nach dem Auswurf.", "Durch Beschwerung mit Gewichten unterhalb der Pose, die den Auftrieb der Pose nicht übersteigen."], "correct": [2], "page": 49, "lesson": 22}, {"id": 488, "section": "4. Gerätekunde (Gk)", "number": 76, "question": "Woran erkennt man einen nicht mehr verzehrtauglichen Fisch?", "answers": ["Wenn die Größe des Fisches erkennbar geschrumpft ist.", "Wenn sich die Farbe des Fisches deutlich verändert hat.", "An trüben Augen und einem starken Fischgeruch sowie einer schlechten Fleischbeschaffenheit (z.B. Überprüfung durch Drucktest)."], "correct": [2], "page": 49, "lesson": 24}, {"id": 489, "section": "4. Gerätekunde (Gk)", "number": 77, "question": "Worauf sollte beim Ausnehmen besonders geachtet werden?", "answers": ["Dass beim Öffnen der Bauchdecke die Kiemen des Fisches nicht angeritzt werden.", "Dass beim Öffnen der Bauchdecke die Gallenblase des Fisches nicht beschädigt wird.", "Dass beim Öffnen der Bauchdecke der Fisch nicht unnötig verletzt wird."], "correct": [1], "page": 49, "lesson": 24}, {"id": 490, "section": "4. Gerätekunde (Gk)", "number": 78, "question": "Wovon sollte die Wahl der Angelschnur in erster Linie abhängen?", "answers": ["Von der Zielfischart und der zu erwartenden Fischgröße sowie der Beschaffenheit des Angelgewässers.", "Von der Zielfischart und der Wassertemperatur.", "Von der Größe des Gewässers und der Zielfischart."], "correct": [0], "page": 49, "lesson": 21}, {"id": 491, "section": "4. Gerätekunde (Gk)", "number": 79, "question": "Wozu dient in der Montage die Beschwerung?", "answers": ["Als Wurfgewicht und zum Austarieren der Tragkraft der Pose.", "Damit sich die Pose nicht unnötig schnell abnutzt.", "Damit beim Drill der Fisch nicht aus dem Wasser springt."], "correct": [0], "page": 49, "lesson": 22}, {"id": 492, "section": "4. Gerätekunde (Gk)", "number": 80, "question": "Für welche Angelmethode ist eine Multirolle nicht geeignet?", "answers": ["Schleppfischen", "Fliegenfischen", "Spinnfischen"], "correct": [1], "page": 49, "lesson": 20}, {"id": 493, "section": "4. Gerätekunde (Gk)", "number": 81, "question": "Wann ist die Angelschnur zu überprüfen?", "answers": ["Etwa alle halbe Jahre", "Einmal im Jahr", "Vor jedem Angeln"], "correct": [2], "page": 50, "lesson": 21}, {"id": 494, "section": "4. Gerätekunde (Gk)", "number": 82, "question": "Was bedeutet die Bezeichnung F / S bei einer Fliegenschnur?", "answers": ["Eine besonders leicht zu werfende Schnur", "Eine Schwimmschnur mit 3 m sinkender Spitze", "Eine schnell sinkende Spitze"], "correct": [1], "page": 50, "lesson": 21}, {"id": 495, "section": "4. Gerätekunde (Gk)", "number": 83, "question": "Was soll ein \"Jig\" darstellen?", "answers": ["Einen Tintenfisch", "Eine Köcherfliegenlarve", "Eine Muschel"], "correct": [0], "page": 50, "lesson": 23}, {"id": 496, "section": "4. Gerätekunde (Gk)", "number": 84, "question": "Was ist eine Teleskoprute?", "answers": ["Eine mehrteilige steckbare Glasfaserrute", "Eine zusammenschiebbare Rute", "Eine besonders lange Bambusrute"], "correct": [1], "page": 50, "lesson": 20}, {"id": 497, "section": "4. Gerätekunde (Gk)", "number": 85, "question": "Mit einem Sbirolino kann man ...?", "answers": ["Boilis anködern", "Einen Kescher ersetzen", "Leichte Köder weit werfen und führen"], "correct": [2], "page": 50, "lesson": 23}, {"id": 498, "section": "4. Gerätekunde (Gk)", "number": 86, "question": "Was ist beim Schleppfischen auf Hechte mit monofiler Schnur zu beachten?", "answers": ["Es sollte mindestens 100 m Schnur im Wasser sein", "Es sollten nicht mehr als 5 m Schnur im Wasser sein", "Es sollten zwischen 30 und 50 m Schnur im Wasser sein"], "correct": [2], "page": 50, "lesson": 23}, {"id": 499, "section": "4. Gerätekunde (Gk)", "number": 87, "question": "Was ist bei monofilen Angelschnüren zu beachten?", "answers": ["Sie sind regelmäßig einzufetten", "Sie müssen in der Sonne getrocknet werden", "Sie sind dunkel und kühl zu lagern"], "correct": [2], "page": 50, "lesson": 21}, {"id": 500, "section": "4. Gerätekunde (Gk)", "number": 88, "question": "Welche Tragkraft hat derzeit eine monofile Schnur von 0,30 mm im Regelfall?", "answers": ["1,2 kg", "2,1 kg", "Mehr als 3,3 kg"], "correct": [2], "page": 50, "lesson": 21}, {"id": 501, "section": "4. Gerätekunde (Gk)", "number": 89, "question": "Wodurch unterscheidet sich Nymphe von Streamer?", "answers": ["Die Nymphe ist im Regelfall größer als der Streamer", "Die Nymphe ist im Regelfall gleich groß", "Der Streamer ist im Regelfall größer als die Nymphe"], "correct": [2], "page": 50, "lesson": 23}, {"id": 502, "section": "4. Gerätekunde (Gk)", "number": 90, "question": "Woran erkennt man einen Biss beim Spürangeln?", "answers": ["Die Pose taucht ab", "Die Pose hebt sich", "Man spürt den Biss mit den Fingern"], "correct": [2], "page": 50, "lesson": 22}, {"id": 503, "section": "4. Gerätekunde (Gk)", "number": 91, "question": "Womit wird eine Laufpose richtig eingestellt?", "answers": ["Mit einem dicken Knoten an der Schnur", "Durch dreimaliges Umwickeln der Pose mit der Schnur", "Mit einem Stopperknoten oder Gummistopper"], "correct": [2], "page": 50, "lesson": 22}, {"id": 504, "section": "4. Gerätekunde (Gk)", "number": 92, "question": "Was zeichnet Kohlefaserruten aus?", "answers": ["Sie sind elastisch", "Sie sind trotz großer Steifheit besonders leicht und gut zu handhaben", "Sie sind nicht elektrisch leitend"], "correct": [1], "page": 50, "lesson": 20}, {"id": 505, "section": "4. Gerätekunde (Gk)", "number": 93, "question": "Welche Schnurstärke ist beim Friedfischfang für das Vorfach im Hinblick auf die verwendete Hauptschnur zu wählen?", "answers": ["Das ist egal; man nimmt das Vorfach, an das der passende Haken gebunden ist", "Ist das Vorfach sehr lang, soll der Schnurdurchmesser größer sein", "Für das Vorfach sollte der nächst kleinere Schnurdurchmesser gewählt werden"], "correct": [2], "page": 51, "lesson": 21}, {"id": 506, "section": "4. Gerätekunde (Gk)", "number": 94, "question": "Wie soll beim Spinnfischen ein Verdrehen der Schnur verhindert werden?", "answers": ["Man benutzt starke Schnüre", "Durch Einschaltung eines Wirbels", "Man verwendet ein Stahlvorfach"], "correct": [1], "page": 51, "lesson": 21}, {"id": 507, "section": "4. Gerätekunde (Gk)", "number": 95, "question": "Welche Einrichtung einer Angelrolle verhindert den Schnurriss beim Drill eines Fisches?", "answers": ["Die Schnurbremse", "Die Übersetzung", "Die Rücklaufsperre"], "correct": [0], "page": 51, "lesson": 21}, {"id": 508, "section": "4. Gerätekunde (Gk)", "number": 96, "question": "Warum sollte eine kleine Stationärrolle nicht zum Hechtangeln benutzt werden?", "answers": ["Man muss beim Drill zu schnell drehen", "Sie fasst zu wenig der benötigten starken Angelschnur", "Man kann die Schnurbremse nicht stark genug einstellen"], "correct": [1], "page": 51, "lesson": 21}, {"id": 509, "section": "4. Gerätekunde (Gk)", "number": 97, "question": "Was bezeichnet der Angler als Perücke?", "answers": ["Die beim Fliegenfischen noch nicht gestreckte Schnur", "Wenn in der angerauten Schnur schon mehrere Knoten sind", "Die ohne Kontrolle ablaufende verhedderte Schnur"], "correct": [2], "page": 51, "lesson": 21}, {"id": 510, "section": "4. Gerätekunde (Gk)", "number": 98, "question": "Was ist für den Fangerfolg beim Spinnfischen ausschlaggebend?", "answers": ["Die Art der Rutenringe", "Die Geschmeidigkeit der Schnur", "Die Führung des Köders im Wasser"], "correct": [2], "page": 51, "lesson": 23}, {"id": 511, "section": "4. Gerätekunde (Gk)", "number": 99, "question": "Wie lang muss das Stahlvorfach beim Fang von Hechten mit totem Köderfisch mindestens sein?", "answers": ["5 cm", "15 cm", "35 cm"], "correct": [2], "page": 51, "lesson": 21}, {"id": 512, "section": "4. Gerätekunde (Gk)", "number": 100, "question": "Welcher Gegenstand ist kein Bissanzeiger?", "answers": ["Aalglocke", "Pose", "Boilie"], "correct": [2], "page": 51, "lesson": 22}, {"id": 513, "section": "4. Gerätekunde (Gk)", "number": 101, "question": "Wo werden Rollenringe eingesetzt?", "answers": ["Beim Stippfischen", "Beim Spinnfischen", "Beim Big-Game-Fischen"], "correct": [2], "page": 51, "lesson": 20}, {"id": 514, "section": "4. Gerätekunde (Gk)", "number": 102, "question": "Was ist ein Twister?", "answers": ["Ein Landegerät", "Eine Pose", "Ein Raubfischköder"], "correct": [2], "page": 51, "lesson": 23}, {"id": 515, "section": "4. Gerätekunde (Gk)", "number": 103, "question": "Worauf ist beim Einsatz von Kohlefaserruten zu achten?", "answers": ["Sie sind besonders lichtempfindlich", "Wegen ihrer Härte kommt es leicht zum Schnurbruch", "Vorsicht bei Gewitter und bei Einsatz unter Stromleitungen"], "correct": [2], "page": 51, "lesson": 24}, {"id": 516, "section": "4. Gerätekunde (Gk)", "number": 104, "question": "Welchen Teil der Angelschnur bezeichnet der Angler als \"Hauptschnur\"?", "answers": ["Die Schnur von der Pose bis zum Haken", "Die Schnur auf der Rolle bis zum Vorfach", "Eine neue und noch unbenutzte Schnur"], "correct": [1], "page": 51, "lesson": 21}, {"id": 517, "section": "4. Gerätekunde (Gk)", "number": 105, "question": "Wozu dient ein Haken ohne Widerhaken?", "answers": ["Zum schonenden Zurücksetzen von nicht maßigen Fischen", "Zum Schutz der Angler", "Zum tieferen Eindringen in den Schlund des Fisches"], "correct": [0], "page": 52, "lesson": 22}, {"id": 518, "section": "4. Gerätekunde (Gk)", "number": 106, "question": "Welcher Teil des Angelgerätes wird als Vorfach bezeichnet?", "answers": ["Die Rutenspitze", "Der üblicherweise dünnere Teil der Schnur zwischen Haken und Hauptschnur", "Das letzte meist dünnere Ende der Schnur vor dem Angelhaken"], "correct": [1], "page": 52, "lesson": 21}, {"id": 519, "section": "4. Gerätekunde (Gk)", "number": 107, "question": "Wann sollte man eine kurze Rute benutzen?", "answers": ["Beim leichten Spinnfischen", "Beim Stippangeln", "Beim Brandungsangeln"], "correct": [0], "page": 52, "lesson": 20}, {"id": 520, "section": "4. Gerätekunde (Gk)", "number": 108, "question": "Welche Rolle hat einen Schnurfangbügel?", "answers": ["Die Stationärrolle", "Die Fliegenrolle", "Die Multirolle"], "correct": [0], "page": 52, "lesson": 20}, {"id": 521, "section": "4. Gerätekunde (Gk)", "number": 109, "question": "Was ist eine Schlagschnur?", "answers": ["Ein besonders starkes Vorfach", "Eine am vorderen Ende der Hauptschnur befestigte stärkere Schnur", "Die Nachschnur beim Fliegenfischen"], "correct": [1], "page": 52, "lesson": 21}, {"id": 522, "section": "4. Gerätekunde (Gk)", "number": 110, "question": "Haken sind in unterschiedlichsten Größen im Handel zu haben. Dabei sind Haken der Größe 1, 2, 3?", "answers": ["Große Haken", "Mittlere Haken", "Kleine Haken"], "correct": [0], "page": 52, "lesson": 22}, {"id": 523, "section": "4. Gerätekunde (Gk)", "number": 111, "question": "Wie lang sollte im Regelfall die Schnur an der Kopfrute sein?", "answers": ["Kürzer als die Rute", "Dreifache Länge der Rute", "Rutenlänge"], "correct": [2], "page": 52, "lesson": 20}, {"id": 524, "section": "4. Gerätekunde (Gk)", "number": 112, "question": "Welches ist die Bezeichnung für eine schwimmende Fliegenschnur?", "answers": ["DT 6 F", "RK 16 B", "WF 6 S"], "correct": [0], "page": 52, "lesson": 21}, {"id": 525, "section": "4. Gerätekunde (Gk)", "number": 113, "question": "Für welche Fischart ist der Spinner ein guter Köder?", "answers": ["Schleie", "Rotfeder", "Flussbarsch"], "correct": [2], "page": 52, "lesson": 23}, {"id": 526, "section": "4. Gerätekunde (Gk)", "number": 114, "question": "Wie nennt man die Ringe zwischen Führungsring und Endring der Rute?", "answers": ["Zwischenringe", "Leitringe", "Schonringe"], "correct": [1], "page": 52, "lesson": 20}, {"id": 527, "section": "4. Gerätekunde (Gk)", "number": 115, "question": "Wie lang sollte eine Rute zum Fischen auf Hecht mit dem toten Köderfisch sein?", "answers": ["2,00 m bis 2,40 m", "über 2,50 m", "unter 2,00 m"], "correct": [1], "page": 52, "lesson": 20}, {"id": 528, "section": "5. Spezielle Fischkunde", "number": 1, "question": "Wie viele Bartfäden hat die Schleie?", "answers": ["Vier", "Zwei", "Keine"], "correct": [1], "page": 53, "lesson": 25}, {"id": 529, "section": "5. Spezielle Fischkunde", "number": 2, "question": "Welcher Fisch betreibt eine besonders intensive Brutpflege?", "answers": ["Die Elritze", "Der Stichling", "Der Aland"], "correct": [1], "page": 53, "lesson": 26}, {"id": 530, "section": "5. Spezielle Fischkunde", "number": 3, "question": "Wo entwickeln sich die Eier des Edelkrebses?", "answers": ["An Wasserpflanzen angeheftet", "Unter dem Hinterleib des Weibchens", "In Laichgruben"], "correct": [1], "page": 53, "lesson": 26}, {"id": 531, "section": "5. Spezielle Fischkunde", "number": 4, "question": "Wie viele Eier hat das Hechtweibchen pro kg Körpergewicht?", "answers": ["4.000 bis 5.000 Stück", "20.000 bis 50.000 Stück", "400.000 bis 500.000 Stück"], "correct": [1], "page": 53, "lesson": 26}, {"id": 532, "section": "5. Spezielle Fischkunde", "number": 5, "question": "Meist in Weihern lebt ein kaum 10 cm langes, anspruchsloses Schwarmfischchen mit spindelförmigem Körper und oberständigem Maul. Die Seitenlinie ist nur kurz erkennbar. Sein Bauch ist hinter den Bauchflossen gekielt. Welcher Fisch ist gemeint?", "answers": ["Moderlieschen", "Stichling", "Hasel"], "correct": [0], "page": 53, "lesson": 25}, {"id": 533, "section": "5. Spezielle Fischkunde", "number": 6, "question": "Wann tritt beim Hechtweibchen in der Regel die Laichreife ein?", "answers": ["Nach Vollendung des ersten Lebensjahres", "Nach Vollendung des zweiten Lebensjahres", "Nach Vollendung des dritten Lebensjahres"], "correct": [2], "page": 53, "lesson": 26}, {"id": 534, "section": "5. Spezielle Fischkunde", "number": 7, "question": "Welches Merkmal unterscheidet Flussbarsch und Kaulbarsch eindeutig voneinander?", "answers": ["Die Ausbildung der Rückenflossen", "Die Ausbildung der Bauchflossen", "Die Ausbildung der Kiemendeckel"], "correct": [0], "page": 53, "lesson": 25}, {"id": 535, "section": "5. Spezielle Fischkunde", "number": 8, "question": "Wie unterscheiden sich Karausche und Giebel?", "answers": ["Rückenflosse der Karausche konvex (nach außen gebogen), beim Giebel konkav", "Rückenflosse der Karausche konkav (nach innen gebogen), beim Giebel konvex", "Giebel hat messing-bronze-farbene, Karausche größere und eher silbrige Schuppen"], "correct": [0], "page": 53, "lesson": 25}, {"id": 536, "section": "5. Spezielle Fischkunde", "number": 9, "question": "Ist die Größe beim Aal vom Geschlecht abhängig?", "answers": ["Nein, beide Geschlechter sind gleich groß", "Ja, das Männchen ist größer", "Ja, das Weibchen ist größer"], "correct": [2], "page": 53, "lesson": 25}, {"id": 537, "section": "5. Spezielle Fischkunde", "number": 10, "question": "Welche nachfolgend aufgezählte Krebsart ist in Mitteleuropa nicht einheimisch und deshalb nicht als Besatzkrebs geeignet?", "answers": ["Steinkrebs", "Signalkrebs", "Edelkrebs"], "correct": [1], "page": 53, "lesson": 26}, {"id": 538, "section": "5. Spezielle Fischkunde", "number": 11, "question": "Flusskrebse sind vom Aussterben bedroht. Welche Erklärung gibt es dafür?", "answers": ["Krebspest in Verbindung mit Wasserverunreinigungen", "Export in zu großem Umfang", "Zu starke Befischung"], "correct": [0], "page": 53, "lesson": 26}, {"id": 539, "section": "5. Spezielle Fischkunde", "number": 12, "question": "Wo hält sich die Schleie vorzugsweise auf, nachdem sie fortpflanzungsfähig geworden ist?", "answers": ["An der Oberfläche", "Im Freiwasserraum", "Zwischen Pflanzen am Bodengrund"], "correct": [2], "page": 54, "lesson": 25}, {"id": 540, "section": "5. Spezielle Fischkunde", "number": 13, "question": "Wann laicht der Zander?", "answers": ["Von Oktober bis Dezember", "Von April bis Mai", "Von Januar bis Februar"], "correct": [1], "page": 54, "lesson": 26}, {"id": 541, "section": "5. Spezielle Fischkunde", "number": 14, "question": "Wie oft laicht der Aal in seinem Leben?", "answers": ["Jedes Jahr", "Nur einmal", "Nur dreimal"], "correct": [1], "page": 54, "lesson": 26}, {"id": 542, "section": "5. Spezielle Fischkunde", "number": 15, "question": "Welcher der aufgeführten Fische hat keine Schwimmblase?", "answers": ["Aal", "Mühlkoppe (Groppe)", "Barsch"], "correct": [1], "page": 54, "lesson": 25}, {"id": 543, "section": "5. Spezielle Fischkunde", "number": 16, "question": "Welche Aale werden als Blankaale bezeichnet?", "answers": ["Aale, die entschleimt sind", "Geschlechtsreife und abwandernde Aale", "Aale, die in klarem Wasser leben"], "correct": [1], "page": 54, "lesson": 26}, {"id": 544, "section": "5. Spezielle Fischkunde", "number": 17, "question": "Welcher der genannten Fische kann sein Maul rüsselartig vorstrecken?", "answers": ["Die Brasse (Blei)", "Der Hecht", "Der Stichling"], "correct": [0], "page": 54, "lesson": 25}, {"id": 545, "section": "5. Spezielle Fischkunde", "number": 18, "question": "Wie viele Fehler enthält folgende Aussage? Der Flussbarsch hat getrennte Rückenflossen. Die erste ist stachelstrahlig mit einem schwarzen Fleck am Hinterrand.", "answers": ["2 Fehler", "1 Fehler", "0 Fehler"], "correct": [2], "page": 54, "lesson": 25}, {"id": 546, "section": "5. Spezielle Fischkunde", "number": 19, "question": "Welche Aussage ist richtig?", "answers": ["Der Sterlet gehört zu den störartigen Fischen", "Der Steinbeißer gehört zu den barschartigen Fischen", "Der Perlfisch gehört zu den dorschartigen Fischen"], "correct": [0], "page": 54, "lesson": 25}, {"id": 547, "section": "5. Spezielle Fischkunde", "number": 20, "question": "Welcher Plattfisch hat auf der Augenseite und auf den Flossensäumen deutliche rote Punkte?", "answers": ["Scholle", "Seezunge", "Kliesche"], "correct": [0], "page": 54, "lesson": 25}, {"id": 548, "section": "5. Spezielle Fischkunde", "number": 21, "question": "Bei welchen Fischen sind die Schlundzähne besonders ausgeprägt?", "answers": ["Beim Zander und beim Hecht", "Bei den Stichlingen", "Bei den Karpfenartigen"], "correct": [2], "page": 54, "lesson": 25}, {"id": 549, "section": "5. Spezielle Fischkunde", "number": 22, "question": "Welche Krebsart zählt in unseren Gewässern zu den Einheimischen?", "answers": ["Signalkrebs", "Steinkrebs", "Kamberkrebs"], "correct": [1], "page": 54, "lesson": 26}, {"id": 550, "section": "5. Spezielle Fischkunde", "number": 23, "question": "Welche der aufgeführten Fische zählen wir zu den Salmoniden?", "answers": ["Meerforelle, Bachforelle, Lachs und Huchen", "Hecht, Zander, Barsch", "Schleie, Karausche, Karpfen"], "correct": [0], "page": 54, "lesson": 25}, {"id": 551, "section": "5. Spezielle Fischkunde", "number": 24, "question": "Welches ist ein wichtiges Unterscheidungsmerkmal zwischen Giebel und Schuppenkarpfen?", "answers": ["Der Karpfen hat große Rundschuppen und zwei Barteln", "Der Giebel hat kleine Rundschuppen und zwei Barteln", "Der Giebel hat keine Barteln"], "correct": [2], "page": 55, "lesson": 25}, {"id": 552, "section": "5. Spezielle Fischkunde", "number": 25, "question": "Wo laicht der Hecht?", "answers": ["Über kiesigem Grund", "An flachen, verkrauteten Uferstellen", "In tieferen Bereichen"], "correct": [1], "page": 55, "lesson": 26}, {"id": 553, "section": "5. Spezielle Fischkunde", "number": 26, "question": "Wo laicht der Europäische Aal?", "answers": ["Im Mündungsbereich der Flüsse", "In der Sargasso-See", "Im Golf von Biskaya"], "correct": [1], "page": 55, "lesson": 26}, {"id": 554, "section": "5. Spezielle Fischkunde", "number": 27, "question": "Einer der aufgeführten Fische besitzt zwar Brustflossen, jedoch fehlen ihm die Bauchflossen. Es ist ...?", "answers": ["Der Aal", "Der Karpfen", "Der Hecht"], "correct": [0], "page": 55, "lesson": 25}, {"id": 555, "section": "5. Spezielle Fischkunde", "number": 28, "question": "Haben außer Forellen und Zwergwels noch weitere Fische eine Fettflosse?", "answers": ["Ja, die Coregonen, der Stint", "Nein", "Ja, die Makrelen"], "correct": [0], "page": 55, "lesson": 25}, {"id": 556, "section": "5. Spezielle Fischkunde", "number": 29, "question": "Wie verhalten sich Stichlinge während der Laichphase?", "answers": ["Sie legen ihre Eier in Muscheln ab", "Die Männchen bauen ein Nest, in das mehrere Weibchen ihre Eier ablegen", "Sie legen ihre Eier an der Unterseite großblättriger Wasserpflanzen ab"], "correct": [1], "page": 55, "lesson": 26}, {"id": 557, "section": "5. Spezielle Fischkunde", "number": 30, "question": "Heringsgroßer Fisch, bezahntes Maul, Fettflosse, Maul oberständig, Körpergeruch nach frischer Salatgurke, bis 30 cm langer Küstenfisch, der in Flüssen (Elbe, Weser) laicht", "answers": ["Hering", "Stint", "Makrele"], "correct": [1], "page": 55, "lesson": 25}, {"id": 558, "section": "5. Spezielle Fischkunde", "number": 31, "question": "Einige ausgewachsene Cypriniden verhalten sich wie Großtierfresser (Raubfische)", "answers": ["Döbel (Aitel) und Rapfen", "Karpfen und Brassen", "Hecht und Aal"], "correct": [0], "page": 55, "lesson": 25}, {"id": 559, "section": "5. Spezielle Fischkunde", "number": 32, "question": "Einige der aufgeführten Fische stellen nur geringe Sauerstoffansprüche. Es sind ...?", "answers": ["Schleie, Karausche", "Bachforelle, Äsche", "Hecht, Zander"], "correct": [0], "page": 55, "lesson": 25}, {"id": 560, "section": "5. Spezielle Fischkunde", "number": 33, "question": "Neben Zander, Barsch und Kaulbarsch gibt es in Deutschland weitere Barscharten, zum Beispiel Zingel, Streber und Schrätzer. Sie leben nur im ...?", "answers": ["Elbe- / Odergebiet", "Rhein- / Emsgebiet", "Donaueinzugsgebiet"], "correct": [2], "page": 55, "lesson": 25}, {"id": 561, "section": "5. Spezielle Fischkunde", "number": 34, "question": "Ein karpfenartiger Grundfisch ist in unseren Gewässern selten geworden. Es fehlt an Kiesbänken zum Laichen. Er hat vier Barteln und giftigen Rogen.", "answers": ["Die Nase", "Die Barbe", "Der Gründling"], "correct": [1], "page": 55, "lesson": 25}, {"id": 562, "section": "5. Spezielle Fischkunde", "number": 35, "question": "Einen scharf gekielten Bauch zwischen Bauch- und Afterflossen besitzt ...?", "answers": ["Das Rotauge", "Die Rotfeder", "Der Hasel"], "correct": [1], "page": 56, "lesson": 25}, {"id": 563, "section": "5. Spezielle Fischkunde", "number": 36, "question": "Welcher Grundfisch lebt in klaren, sauberen Gewässern mit möglichst sandigem bis kiesigem Grund, hat einen länglich gestreckten, rundlichen Körper, kleine Augen, sechs Barteln und abgerundete Flossen", "answers": ["Bachschmerle", "Barbe", "Gründling"], "correct": [0], "page": 56, "lesson": 25}], LESSONS=[{"id": 0, "group": 0, "title": "Warum Fische so aussehen", "paragraphs": ["Ein Vogel schaut von oben ins Wasser. Der dunkle Rücken eines Fisches passt zum dunklen Boden. So sieht der Vogel den Fisch schlechter.", "Ein Raubfisch schaut von unten nach oben. Dort ist das Wasser durch den Himmel hell. Der helle Fischbauch fällt kaum auf. Das ist Tarnung.", "Auch die Form hilft dem Fisch. Ein spindelförmiger Körper ist in der Mitte dicker und an den Enden schmal. So gleitet er gut durch Strömung. Ein hoher, seitlich flacher Körper passt eher zu ruhigem Wasser. Plattfische liegen flach am Boden.", "Das Maul zeigt oft zum Futter: Ein oberständiges Maul zeigt nach oben. Ein unterständiges Maul zeigt zum Boden. Ein endständiges Maul zeigt nach vorne."], "example": "Ein Fisch sucht Insekten an der Oberfläche. Welche Maulrichtung wäre praktisch? Nach oben – also oberständig.", "memory": "Dunkler Rücken, heller Bauch: Tarnung von beiden Seiten. Das Maul zeigt zum Futter.", "detailParagraphs": ["Stell dir vor, du bist ein Vogel und schaust ins Wasser. Ein dunkler Fischrücken fällt vor dem dunklen Grund kaum auf. Schaust du als Raubfisch von unten nach oben, passt ein heller Fischbauch zum hellen Himmel. Diese Tarnung macht Fische schwerer sichtbar.", "Auch die Körperform verrät etwas über das Leben eines Fisches. Ein schlanker, spindelförmiger Körper gleitet gut durch starke Strömung. Ein hoher, seitlich flacher Körper passt eher zu ruhigem Wasser. Plattfische leben flach am Boden.", "Schau dann auf das Maul: Ein oberständiges Maul zeigt nach oben, ein unterständiges nach unten. Ein endständiges Maul sitzt vorne. Das hilft dir zu erkennen, wo ein Fisch meistens Nahrung sucht."]}, {"id": 1, "group": 0, "title": "Flossen, Schuppen und Schutzhaut", "paragraphs": ["Mit der Schwanzflosse kommt der Fisch vorwärts. Die Brustflossen helfen beim Lenken. Rückenflosse und Afterflosse halten ihn gerade.", "In vielen Flossen sitzen Flossenstrahlen. Sie stützen die Flosse wie Stäbe einen Fächer. Hartstrahlen sind fest. Weichstrahlen sind biegsamer.", "Die Fettflosse ist eine kleine Flosse auf dem Rücken. Bei Forellen hat sie keine Flossenstrahlen.", "Schuppen und eine dünne Schleimschicht schützen die Haut. Fasse einen Fisch deshalb nur mit nassen Händen an. Verlorene Schuppen können nachwachsen."], "example": "Stell dir ein Boot vor: Antrieb, Steuerung und Stabilisierung sind verschiedene Aufgaben. Genauso arbeiten die Flossen zusammen.", "memory": "Schwanz = Antrieb. Brust = Steuerung. Rücken und After = Stabilität.", "detailParagraphs": ["Die Schwanzflosse liefert bei vielen Fischen den wichtigsten Antrieb. Die Brustflossen helfen beim Steuern. Rücken- und Afterflosse halten den Körper stabil, damit der Fisch nicht ständig zur Seite kippt. Paarige Flossen gibt es links und rechts; unpaarige sitzen nur einmal an einer Körperstelle.", "Flossenstrahlen stützen die Flossen wie die Streben eines Fächers. Hartstrahlen sind fest und können stechen. Weichstrahlen sind gegliedert. Die kleine Fettflosse der Forellenartigen hat keine Flossenstrahlen.", "Schuppen und Schleim schützen den Körper. Rundschuppen haben einen glatten Rand; Kammschuppen einen gezähnten. Verlorene Schuppen können nachwachsen. Die Schleimschicht schützt vor Krankheitserregern. Trockene Hände können sie verletzen. An Schuppen lassen sich auch Wachstumsringe erkennen – ähnlich wie an einem Baum."]}, {"id": 2, "group": 0, "title": "Atmen, fühlen und schweben", "paragraphs": ["Auch Fische brauchen Sauerstoff. Sie holen ihn mit den Kiemen aus dem Wasser. Das Blut bringt ihn durch den Körper.", "Mit der Seitenlinie spürt ein Fisch Bewegungen im Wasser. Barteln helfen ihm beim Tasten und Schmecken.", "Viele Fische haben eine Schwimmblase. Darin ist Gas. Sie hilft dem Fisch, in einer Tiefe zu bleiben. Er muss dann weniger schwimmen.", "Weiter unten drückt das Wasser stärker. Steigt ein Fisch schnell auf, wird der Druck kleiner. Das Gas in seiner Schwimmblase dehnt sich aus."], "example": "Ein Luftballon unter Wasser möchte nach oben. Eine Schwimmblase nutzt ebenfalls den Auftrieb von Gas.", "memory": "Kiemen zum Atmen, Seitenlinie zum Spüren, Schwimmblase zum Schweben.", "detailParagraphs": ["Fische brauchen Sauerstoff. Ihre Kiemen nehmen den im Wasser gelösten Sauerstoff auf und geben Kohlendioxid ab. Das Blut bringt den Sauerstoff durch den Körper. Das Herz liegt weit vorne unterhalb der Kiemen; die Nieren liegen unter der Wirbelsäule und reinigen das Blut.", "Die Seitenlinie ist ein besonderer Sinn. Sie nimmt Wasserbewegungen und Druckänderungen wahr. Damit kann ein Fisch Bewegungen in seiner Nähe bemerken. Barteln sind keine Haare: Sie helfen beim Tasten und Schmecken.", "Die Schwimmblase ist ein gasgefüllter Auftriebskörper. Sie hilft vielen Fischen, in einer bestimmten Tiefe zu bleiben. Steigt ein Fisch schnell auf, nimmt der Wasserdruck ab: Das Gas dehnt sich aus. Nicht alle Fische haben eine Schwimmblase.", "Einige Arten besitzen zusätzliche Möglichkeiten zur Sauerstoffaufnahme, etwa über Haut oder Darm. Das ersetzt aber nicht bei allen Fischen die Kiemenatmung."]}, {"id": 3, "group": 0, "title": "Wachsen und wechselwarm sein", "paragraphs": ["Dein Körper bleibt ungefähr gleich warm. Beim Fisch ist das anders: Sein Körper wird mit dem Wasser wärmer oder kälter. Das heißt wechselwarm.", "In warmem Wasser braucht ein Fisch oft mehr Sauerstoff. Das ist schwierig: Warmes Wasser kann weniger Sauerstoff aufnehmen.", "Junge Fische wachsen besonders schnell. Ein kleiner Fisch kann sein Gewicht rasch verdoppeln. Alte Fische wachsen meist langsamer.", "Auch Fischeier entwickeln sich je nach Wassertemperatur unterschiedlich schnell."], "example": "10 Gramm auf 20 Gramm sind 100 Prozent Zuwachs. 100 Gramm auf 110 Gramm sind nur 10 Prozent.", "memory": "Wechselwarm heißt: Die Körpertemperatur richtet sich nach dem Wasser.", "detailParagraphs": ["Dein Körper hält seine Temperatur ziemlich gleich. Bei einem Fisch hängt die Körpertemperatur dagegen stark vom Wasser ab. Deshalb nennt man ihn wechselwarm. Er kann seine Temperatur nicht einfach nach Wunsch einstellen.", "Wird es wärmer, laufen viele Körpervorgänge schneller ab. Der Fisch braucht dann mehr Sauerstoff. Gleichzeitig kann warmes Wasser weniger Sauerstoff aufnehmen als kaltes. Sehr schnelle Temperaturwechsel können Fische schädigen.", "Junge Fische wachsen im Verhältnis zu ihrem Gewicht besonders schnell. Aus 10 Gramm werden zum Beispiel 20 Gramm: Das ist eine Verdopplung. Bei einem großen Fisch bedeutet die gleiche Gewichtszunahme prozentual viel weniger. Fische können lebenslang wachsen, im Alter meist langsamer. Auch die Entwicklung ihrer Eier hängt von der Temperatur ab."]}, {"id": 4, "group": 0, "title": "Eier, Jungfische und Brutpflege", "paragraphs": ["Fische bekommen Nachwuchs aus Eiern. Das Ablegen der Eier heißt Laichen. Die Eier heißen Rogen.", "Das Weibchen heißt Rogner. Das Männchen heißt Milchner. Das gilt, wenn sie sich fortpflanzen können.", "Manche Fische legen ihre Eier auf Kies. Andere heften sie an Pflanzen. Wieder andere geben sie ins freie Wasser ab.", "Eine frisch geschlüpfte Fischlarve hat oft einen Dottersack. Das ist ihr Nahrungsvorrat für die ersten Tage. Manche Eltern bewachen ihre Eier. Das nennt man Brutpflege."], "example": "Der Dottersack ist wie eine mitgebrachte Brotdose: Die Larve lebt davon, bevor sie selbst Futter finden kann.", "memory": "Milchner = Männchen. Rogner = Weibchen. Rogen = Eier.", "detailParagraphs": ["Laichen bedeutet: Fische geben Eier und Samen zur Fortpflanzung ab. Das geschlechtsreife Männchen heißt Milchner. Das Weibchen heißt Rogner, seine Eier nennt man Rogen. Eine frisch geschlüpfte Larve hat oft einen Dottersack. Er ist ihr erster Vorrat an Nahrung.", "Nicht alle Fische legen ihre Eier am gleichen Ort ab. Kieslaicher wie die Bachforelle brauchen geeigneten Kies. Krautlaicher wie der Hecht nutzen Wasserpflanzen. Freiwasserlaicher geben ihre Eier ins freie Wasser ab. Laichgruben sind vom Fisch angelegte Vertiefungen; Laichnester bieten einen geschützten Ablageplatz.", "Manche Arten bewachen Eier und Jungfische. Das nennt man Brutpflege. Beim Stichling baut und bewacht das Männchen ein Nest. Karpfenartige laichen überwiegend in der warmen Jahreszeit, viele Forellenartige in der kalten. Es gibt Unterschiede zwischen den Arten."]}, {"id": 5, "group": 0, "title": "Die großen Fischwanderungen", "paragraphs": ["Manche Fische reisen weit, um Eier abzulegen. Diese Reise heißt Laichwanderung.", "Der Lachs wächst im Meer. Zum Laichen schwimmt er in einen Fluss. Das heißt anadrom.", "Der Aal macht es andersherum. Zum Laichen schwimmt er ins Meer. Das heißt katadrom.", "Der junge Aal ist erst eine Weidenblattlarve. An der Küste wird er zum durchsichtigen Glasaal. Als Gelbaal frisst und wächst er. Als Blankaal beginnt seine Reise zur Fortpflanzung."], "example": "Zeichne zwei Pfeile: Lachs zum Laichen → Fluss. Aal zum Laichen → Meer.", "memory": "Lachs: Meer zum Fluss. Aal: zum Laichen ins Meer.", "detailParagraphs": ["Manche Fische brauchen im Laufe ihres Lebens verschiedene Lebensräume. Deshalb wandern sie zum Laichen weite Strecken. Hindernisse im Fluss können ihnen den Weg abschneiden.", "Der Atlantische Lachs wächst im Meer heran und schwimmt zum Laichen in Süßwasser. Das heißt anadrom. Der Europäische Aal macht es umgekehrt: Er wächst in Binnen- und Küstengewässern heran und wandert zur Fortpflanzung ins Meer. Das heißt katadrom. Wanderungen nur innerhalb des Süßwassers nennt man potamodrom.", "Der Aal hat mehrere Lebensphasen. Die flache Weidenblattlarve treibt im Meer. Als durchsichtiger Glasaal erreicht er die Küste. Als Gelbaal frisst und wächst er. Als Blankaal beginnt seine Fortpflanzungswanderung. Junge Lachse, die Richtung Meer ziehen, heißen Smolts."]}, {"id": 6, "group": 0, "title": "Wer frisst was?", "paragraphs": ["Am Maul erkennst du oft, was ein Fisch frisst. Hecht und Zander halten Beutefische mit Fangzähnen fest.", "Der Wels hat viele kleine Zähne. Sie fühlen sich wie eine raue Bürste an. Das sind Hechelzähne.", "Karpfenartige haben ihre wichtigen Zähne hinten im Schlund. Deshalb heißen sie Schlundzähne.", "Gründeln heißt: am Boden nach Futter suchen. Dort findet ein Fisch zum Beispiel Würmer und Schnecken. Kleine Jungfische fressen oft Zooplankton. Das sind winzige Tiere im Wasser."], "example": "Denk an Werkzeuge: Eine Zange hält fest, eine Bürste hat viele kleine Spitzen. Fangzähne und Hechelzähne sind ebenfalls verschieden gebaut.", "memory": "Gründeln = am Grund fressen. Fangzähne halten Beutefische fest.", "detailParagraphs": ["Ein Fischmaul passt zur Nahrung. Hecht und Zander haben kräftige Fangzähne, mit denen sie Beute festhalten. Der Wels besitzt viele kleine Hechelzähne, die wie eine raue Bürste wirken. Karpfenartige haben ihre wichtigen Zähne hinten im Schlund statt vorne im Kiefer.", "Gründeln bedeutet, am Gewässerboden nach Nahrung zu suchen. Dort leben Würmer, Schnecken, Muscheln und Insektenlarven. Ein Karpfen findet hier Futter. Kleine Fischbrut frisst oft tierisches Plankton: winzige Tiere, die im Wasser treiben.", "Ein Hecht lauert seiner Beute auf. Ein Zander frisst überwiegend Fische. Die Nase weidet dagegen Aufwuchs auf Steinen ab. Die Bezeichnung „Friedfisch“ ist keine Garantie für rein pflanzliche Nahrung: Viele fressen kleine Tiere, und große Döbel und Rapfen können Fische jagen."]}, {"id": 7, "group": 0, "title": "Krankheiten erkennen und vermeiden", "paragraphs": ["Ein gesunder Fisch reagiert auf seine Umgebung. Flieht er gar nicht und wirkt schlapp, kann er krank sein. Auch Wunden oder Flecken können Hinweise sein.", "Sterben viele verschiedene Fischarten zugleich, kann das Wasser die Ursache sein. Vielleicht fehlt Sauerstoff. Hole eine erwachsene Person dazu.", "Krankheitserreger können an einem nassen Kescher hängen. So gelangen sie in andere Gewässer. Deshalb muss die Ausrüstung richtig gereinigt werden.", "Die Krebspest ist für heimische Flusskrebse sehr gefährlich. Eingeschleppte Krebsarten können sie verbreiten. Setze deshalb keine Tiere aus einem anderen Gewässer aus."], "example": "Ein Kescher aus einem anderen Gewässer kann unsichtbare Erreger mitbringen. Saubere Ausrüstung schützt auch Tiere, die du gar nicht siehst.", "memory": "Nicht nur Fische wandern mit: An Ausrüstung können Krankheitserreger reisen.", "detailParagraphs": ["Ein gesunder Fisch reagiert auf seine Umgebung. Ein auffallend teilnahmsloser Fisch, der nicht flüchtet, kann krank sein. Flecken, Geschwüre oder veränderte Kiemen können weitere Hinweise sein. Ein einzelnes Zeichen ist aber noch keine sichere Diagnose.", "Wenn viele Arten und Altersgruppen gleichzeitig sterben, spricht das eher für ein Problem im Wasser, etwa Sauerstoffmangel oder eine Verschmutzung. Betrifft das Sterben fast nur eine Art, kommt eher eine artspezifische Krankheit infrage. Nach Luft schnappende Fische an der Oberfläche können auf Sauerstoffmangel hinweisen.", "Nasse Ausrüstung, mitgebrachtes Wasser und Köderfische können Krankheitserreger verschleppen. Besonders gefährlich ist die Krebspest für heimische Flusskrebse. Eingeschleppte Arten wie Signal- und Kamberkrebs können den Erreger verbreiten. Krebse müssen zum Wachsen ihren starren Panzer abwerfen; danach sind sie vorübergehend weich und verletzlich."]}, {"id": 8, "group": 0, "title": "Fischfamilien unterscheiden", "paragraphs": ["Verwandte Fischarten bilden eine Fischfamilie. Karpfen, Rotauge und Brasse gehören zu den Karpfenartigen.", "Forellenartige haben eine kleine Fettflosse hinter der Rückenflosse. Barschartige besitzen stachelige Flossenstrahlen.", "Die Quappe gehört zu den Dorschartigen. Sie lebt trotzdem im Süßwasser. Andere Namen für sie sind Rutte und Trüsche.", "Prüfe immer mehrere Merkmale. Schau auf Körper, Maul, Flossen, Barteln und Schuppen. Die Farbe allein kann täuschen."], "example": "Ein Familienname hilft beim Einordnen, aber für den einzelnen Fisch brauchst du zusätzliche Erkennungszeichen.", "memory": "Mehrere Merkmale prüfen – Farbe allein reicht nicht.", "detailParagraphs": ["Eine Fischfamilie ist eine Gruppe verwandter Arten. Zur Familie der Karpfenartigen gehören zum Beispiel Rotauge, Brasse und Bitterling. Im Kiefer haben sie keine Fangzähne; wichtig sind ihre Schlundzähne.", "Bei Forellenartigen hilft häufig die kleine Fettflosse hinter der Rückenflosse beim Erkennen. Zu den Barschartigen gehören Flussbarsch, Kaulbarsch und Zander. Ihre stacheligen Flossenstrahlen sind ein wichtiges Merkmal. Die Quappe gehört zu den Dorschartigen, obwohl sie im Süßwasser lebt.", "Verlasse dich bei der Bestimmung nicht nur auf die Farbe. Sie kann sich verändern. Vergleiche mehrere Merkmale: Körperform, Flossen, Maul, Barteln und Schuppen. Auch regionale Namen sind wichtig: Quappe, Rutte und Trüsche meinen denselben Fisch."]}, {"id": 9, "group": 1, "title": "Sauerstoff: die Luft im Wasser", "paragraphs": ["Im Wasser ist Sauerstoff. Du kannst ihn nicht sehen. Fische brauchen ihn zum Atmen.", "Bei Licht bilden Pflanzen und Algen Sauerstoff. Das heißt Photosynthese. Wasserbewegung bringt ebenfalls Sauerstoff ins Wasser.", "Nachts fehlt das Licht. Pflanzen bilden dann keinen Sauerstoff. Sie verbrauchen aber weiter welchen beim Atmen.", "Bakterien verbrauchen beim Zersetzen toter Pflanzen ebenfalls Sauerstoff. Wird er zu knapp, können Fische ersticken. Man sagt dann manchmal: Das Gewässer kippt um."], "example": "Ein warmer Teich mit vielen Algen ist wie ein Raum mit vielen Verbrauchern und wenig Nachschub: Nachts kann der Sauerstoff knapp werden.", "memory": "Licht hilft Pflanzen, Sauerstoff zu bilden. Atmung und Zersetzung verbrauchen ihn.", "detailParagraphs": ["Im Wasser ist Sauerstoff gelöst, auch wenn du ihn nicht sehen kannst. Tiere brauchen ihn zum Atmen. Wasserbewegung hilft beim Austausch mit der Luft. Pflanzen und Algen bilden bei Licht durch Photosynthese Sauerstoff und energiereichen Zucker.", "Pflanzen atmen aber auch – tagsüber und nachts. Im Dunkeln fällt die Photosynthese aus, die Atmung geht weiter. In warmen, sehr pflanzenreichen Gewässern kann deshalb nachts Sauerstoff knapp werden.", "Auch Bakterien brauchen beim Abbau vieler abgestorbener Pflanzen und organischer Abfälle Sauerstoff. Wird mehr verbraucht als nachgeliefert, können Fische ersticken. Das ist mit dem „Umkippen“ eines Gewässers gemeint. Warmes Wasser kann weniger Sauerstoff aufnehmen. Gleichzeitig steigt bei Wärme oft der Sauerstoffbedarf der Tiere."]}, {"id": 10, "group": 1, "title": "Ein See hat Stockwerke", "paragraphs": ["Am Ufer wächst oft Schilf. Weiter draußen kommen Seerosen. Noch weiter draußen wachsen Pflanzen unter Wasser. Ganz tief ist es für Pflanzen zu dunkel.", "Im Sommer liegt warmes Wasser oben. Kaltes Wasser bleibt unten. Dazwischen ändert sich die Temperatur schnell. Dieser Bereich heißt Sprungschicht.", "Im Frühjahr und Herbst kann Wind das Wasser oft ganz durchmischen. Das heißt Vollzirkulation.", "Wasser ist bei vier Grad Celsius am dichtesten. Deshalb kann es im Winter unter noch kälterem Wasser liegen."], "example": "Stell dir einen See als Haus vor: Oben sind viel Licht und Wärme. Unten ist es dunkler und oft kühler. Im Frühjahr und Herbst werden die Stockwerke durchmischt.", "memory": "Wasser ist bei 4 °C am dichtesten. Im Frühjahr und Herbst wird oft durchgemischt.", "detailParagraphs": ["Vom Ufer Richtung Seemitte ändern sich die Pflanzen. In der Gelegezone steht zum Beispiel Schilf. Weiter draußen wachsen Schwimmblattpflanzen wie Seerosen. Darauf folgen untergetauchte Pflanzen und Unterwasserwiesen. Pflanzen können nur dauerhaft wachsen, wo genügend Licht ankommt.", "Im Sommer liegt warmes, leichteres Wasser über kaltem Tiefenwasser. Dazwischen liegt ein Bereich, in dem die Temperatur rasch abnimmt: die Sprungschicht. Diese stabile Schichtung heißt Sommerstagnation.", "Im Frühjahr und Herbst sind die Temperaturunterschiede bei vielen Seen klein genug, dass Wind das Wasser vollständig durchmischen kann. Das heißt Vollzirkulation. Im Winter liegt besonders kaltes Wasser oben. Wasser ist bei ungefähr vier Grad Celsius am dichtesten und kann deshalb unter noch kälterem Wasser liegen."]}, {"id": 11, "group": 1, "title": "Vom Quellbach bis zum Meer", "paragraphs": ["Ein Fluss beginnt oft als schmaler, kalter Bach. Das Wasser fließt schnell über Steine. Dort leben zum Beispiel Forellen.", "Weiter unten wird der Fluss meist breiter und langsamer. Auch die Fische ändern sich.", "Die Abschnitte heißen Fischregionen. Ihre Reihenfolge ist: Forelle, Äsche, Barbe, Brasse und Kaulbarsch mit Flunder.", "An der Mündung trifft der Fluss auf das Meer. Süßwasser und Salzwasser mischen sich. Diese Mischung heißt Brackwasser."], "example": "Merke die Anfangsbuchstaben F–Ä–B–B–K. Reise gedanklich vom sprudelnden Bach bis zur breiten Flussmündung.", "memory": "Forelle → Äsche → Barbe → Brasse → Kaulbarsch/Flunder.", "detailParagraphs": ["Ein Fluss verändert sich auf seinem Weg. Nahe der Quelle ist er oft schmal, kühl und schnell. Weiter unten wird er meist breiter, ruhiger und wärmer. Der Boden verändert sich von Steinen und Kies zu feineren Ablagerungen.", "Die Fischregionen heißen von der Quelle zur Mündung: Forellenregion, Äschenregion, Barbenregion, Brassenregion und Kaulbarsch-Flunderregion. Die namensgebenden Fische heißen Leitfische. Andere Arten leben jeweils mit ihnen zusammen.", "Forellen brauchen besonders kühles und sauerstoffreiches Wasser. In der Brassenregion fließt das Wasser langsamer; am Boden kann Sauerstoff knapp sein. Im Mündungsbereich mischen sich Fluss- und Meerwasser zu Brackwasser. Dort kann sich der Salzgehalt stark verändern. Eine Vertiefung in einem Fluss nennt man Kolk oder Gumpen."]}, {"id": 12, "group": 1, "title": "Das Nahrungsnetz im Wasser", "paragraphs": ["Algen und Pflanzen nutzen Licht zum Wachsen. Sie sind Nahrung für andere Lebewesen.", "Winzige Tiere fressen zum Beispiel kleine Algen. Jungfische fressen diese Tiere. Große Raubfische fressen kleinere Fische. Das ist eine Nahrungskette.", "In Wirklichkeit frisst ein Tier oft verschiedene Dinge. Viele Nahrungsketten hängen zusammen. So entsteht ein Nahrungsnetz.", "Bakterien und Pilze bauen tote Lebewesen ab. Sie heißen Zersetzer. Dabei werden Nährstoffe frei, die Pflanzen wieder nutzen können."], "example": "Alge → Wasserfloh → Jungfisch → Raubfisch ist eine einfache Nahrungskette. In Wirklichkeit hat jeder Pfeil viele Nachbarn.", "memory": "Produzenten erzeugen, Konsumenten fressen, Destruenten zersetzen.", "detailParagraphs": ["Am Anfang vieler Nahrungsketten stehen Pflanzen und Algen. Sie stellen mithilfe von Licht energiereiche Stoffe her. Deshalb heißen sie Produzenten, also Erzeuger. Winzige schwebende Algen nennt man Phytoplankton.", "Tierisches Plankton heißt Zooplankton. Es wird zum Beispiel von Jungfischen gefressen. Größere Fische fressen kleinere Tiere oder andere Fische. Solche Lebewesen heißen Konsumenten, also Verbraucher. Weil ein Tier oft verschiedene Dinge frisst, entsteht ein ganzes Nahrungsnetz.", "Bakterien und Pilze zerlegen tote Lebewesen. Sie heißen Destruenten oder Zersetzer. Dabei werden Nährstoffe wieder verfügbar. Größere wirbellose Tiere am Gewässergrund nennt man Makrozoobenthos. Dazu gehören viele Insektenlarven. Manche von ihnen fressen sogar Fischbrut."]}, {"id": 13, "group": 1, "title": "Was Wasserwerte verraten", "paragraphs": ["Der pH-Wert zeigt, ob Wasser sauer oder basisch ist. Bei sieben ist es neutral. Das heißt: weder sauer noch basisch.", "Nährstoffe helfen Pflanzen beim Wachsen. Oligotroph heißt: wenige Nährstoffe. Eutroph heißt: viele Nährstoffe.", "Zu viele Nährstoffe können zu sehr vielen Algen führen. Sterben die Algen, verbraucht ihr Abbau Sauerstoff.", "Auch kleine Tiere verraten etwas über das Wasser. Steinfliegenlarven brauchen zum Beispiel gutes Wasser. Solche Tiere heißen Zeigerorganismen."], "example": "Ein Zeigerorganismus ist wie eine Nachricht aus dem Wasser: Er zeigt, welche Bedingungen dort herrschen.", "memory": "Oligotroph = wenig Nährstoffe. Eutroph = viele Nährstoffe. pH 7 = neutral.", "detailParagraphs": ["Der pH-Wert sagt, ob Wasser sauer, neutral oder basisch ist. Bei pH 7 ist es neutral. Kleinere Werte bedeuten saurer, größere basischer. Im Fragenkatalog gilt der Bereich von 6,5 bis 8,5 als gut geeignet für heimische Fische. Das ist ein Lernwert; einzelne Arten haben unterschiedliche Ansprüche.", "Nährstoffe sind Pflanzenfutter. Ein nährstoffarmes Gewässer heißt oligotroph, ein nährstoffreiches eutroph. Zu viele Nährstoffe können massenhaftes Algenwachstum auslösen. Wenn viel davon abstirbt, verbraucht die Zersetzung Sauerstoff.", "Auch kleine Tiere verraten etwas über ein Gewässer. Steinfliegenlarven sprechen für eine hohe Gewässergüte. Viele rote Zuckmückenlarven oder Schlammröhrenwürmer können auf starke Belastung hinweisen. Solche Lebewesen nennt man Bioindikatoren oder Zeigerorganismen. Temperatur, Sauerstoff und pH werden zusätzlich gemessen."]}, {"id": 14, "group": 1, "title": "Lebensräume schützen", "paragraphs": ["Fische brauchen gute Verstecke und Plätze für ihre Eier. Kiesbänke sind Laichplätze. Flache Ufer sind Kinderstuben. Äste im Wasser bieten Schutz.", "Bäume am Ufer machen Schatten. Ihre Wurzeln halten den Boden fest.", "Ein Wehr kann den Weg versperren. Eine Fischaufstiegshilfe hilft Fischen, daran vorbeizukommen.", "Lass keinen Müll oder Schnurreste liegen. Tiere können sich darin verfangen. Betritt auch keine geschützten Uferbereiche."], "example": "Ein umgestürzter Ast ist für uns vielleicht ein Hindernis. Für einen Jungfisch kann er ein sicheres Versteck sein.", "memory": "Kies ist Kinderzimmer, Totholz ist Versteck, Uferbäume sind Sonnenschirme.", "detailParagraphs": ["Ein gutes Fischgewässer braucht mehr als Wasser. Kies dient vielen Arten als Laichplatz. Flache Ufer sind Kinderstuben für Jungfische. Totholz bietet Verstecke und Lebensraum für kleine Nahrungstiere. Uferbäume spenden Schatten und befestigen mit ihren Wurzeln den Boden.", "Wehre und andere Querbauwerke können Wanderwege unterbrechen. Fischaufstiegshilfen ermöglichen einen Weg stromaufwärts. Abstiegshilfen sollen die Wanderung stromabwärts sicherer machen, etwa an Turbinen vorbei.", "Zu viel Dünger, Schlamm oder Schadstoffe belasten Gewässer. Ein bewachsener Uferrandstreifen kann Einträge abfangen. Zurückgelassene Schnur kann Tiere fesseln oder verletzen. Auch Blei gehört nicht in die Natur. Der Klimawandel kann Gewässer erwärmen und bei Trockenheit Wasser fehlen lassen. Naturnahe, vielfältige Lebensräume bieten mehr Rückzugsmöglichkeiten."]}, {"id": 15, "group": 1, "title": "Hege, Besatz und Gleichgewicht", "paragraphs": ["Hege heißt: den Fischbestand und seinen Lebensraum pflegen. Möglichst viele Fische einzusetzen ist nicht automatisch gut.", "Das Einsetzen von Fischen heißt Besatz. Dafür braucht man Wissen und die nötige Berechtigung. Die Fische müssen zum Gewässer passen.", "Sind zu viele Fische da, reicht das Futter nicht. Sie können klein bleiben. Das heißt Verbuttung.", "Fremde Arten können heimische Tiere verdrängen. Sie können auch Krankheiten mitbringen. Setze nie einfach Tiere aus einem Aquarium aus."], "example": "Ein Aquarium wird nicht besser, wenn immer mehr Fische hineinkommen. Im See zählt ebenfalls, ob Futter und Lebensraum ausreichen.", "memory": "Erst Lebensraum verbessern. Besatz braucht einen fachlichen Grund und die nötige Berechtigung.", "detailParagraphs": ["Hege bedeutet, einen passenden, gesunden und artenreichen Fischbestand zu erhalten. Dazu gehört vor allem, den Lebensraum zu schützen. Es geht nicht darum, möglichst viele Fische in ein Gewässer zu setzen.", "Besatz heißt: Menschen bringen Fische ein. Dafür müssen Art, Herkunft, Gesundheitszustand und Menge zum Gewässer passen. Zu viele Fische konkurrieren um zu wenig Futter. Sie können klein bleiben, obwohl sie schon fortpflanzungsfähig sind. Das nennt man Verbuttung.", "Gebietsfremde Tiere heißen Neozoen, gebietsfremde Pflanzen Neophyten. Nicht jede gebietsfremde Art ist invasiv. Invasiv nennt man Arten, deren Ausbreitung die heimische Natur gefährdet. Unüberlegtes Aussetzen kann außerdem Krankheiten einschleppen.", "Schonzeiten schützen die Fortpflanzung. Mindestmaße sollen jungen Fischen die Chance geben, Nachwuchs zu bekommen. Fangstatistiken helfen, Bestände und Entnahmen einzuschätzen."]}, {"id": 16, "group": 2, "title": "Tiere respektvoll behandeln", "paragraphs": ["Fische sind Tiere, die Stress erleben können. Behandle sie vorsichtig. Sie sind kein Spielzeug.", "Lege den Kescher und alle Hilfsmittel vor dem Angeln bereit. Dann muss ein gefangener Fisch nicht lange warten.", "Ein Fisch, der zurückgesetzt werden muss, wird mit nassen Händen vorsichtig behandelt. Er bleibt nur so kurz wie nötig an der Luft.", "Auch das Betäuben und Töten gehört zum Prüfungsstoff. Das muss man fachkundig lernen. Als Kind übst du die Praxis mit einer erwachsenen Person, die sich damit auskennt."], "example": "Bereite Kescher und nötige Hilfsmittel vor dem ersten Wurf vor. Dann musst du nicht suchen, während ein Fisch wartet.", "memory": "Gut vorbereitet sein, Stress kurz halten und Fische sorgfältig behandeln.", "detailParagraphs": ["Fische sind Wirbeltiere und können Stress erleben. Beim Angeln entsteht deshalb Verantwortung. Das Tierschutzgesetz verlangt einen vernünftigen Grund, wenn einem Tier Schmerzen, Leiden oder Schäden zugefügt werden. Ein Fisch ist kein Spielzeug für Fotos oder Wettkämpfe.", "Passendes Gerät und ständige Aufmerksamkeit helfen, den Drill möglichst kurz zu halten. Ein Kescher unterstützt das sichere Anlanden. Wenn ein Fisch zurückgesetzt werden muss, wird er vorsichtig und mit nassen Händen behandelt. Er soll nur so kurz wie nötig aus dem Wasser sein.", "Die Prüfungsfragen behandeln auch Betäubung und Tötung. Dafür braucht man Sachkunde und praktische Anleitung. Die Grundfolge im Katalog lautet bei den meisten Fischen: wirksam betäuben, Betäubung kontrollieren und anschließend unverzüglich töten. Besondere Regeln einzelner Arten sind eigene Lernpunkte. Als Kind lernst du die Praxis mit einer sachkundigen erwachsenen Person."]}, {"id": 17, "group": 2, "title": "Schonzeiten und Entnahmemaße", "paragraphs": ["In der Schonzeit wird eine Fischart besonders geschützt. Du darfst dann nicht gezielt auf sie angeln.", "Das Mindestmaß ist die kleinste Größe, ab der ein Fisch entnommen werden darf. Ein Entnahmefenster hat auch eine obere Grenze.", "Ein Beispiel aus deinem Katalog: Für Hechte steht dort 50 bis 90 Zentimeter. Aber die Größe allein reicht nicht. Auch Schonzeit und Regeln am Gewässer müssen passen.", "Die Prüfungsantworten hier stammen aus deinem Katalog von 2024. Vor dem echten Angeln prüfst du mit einem Erwachsenen die aktuellen Regeln."], "example": "Ein Fisch kann groß genug sein und trotzdem gerade Schonzeit haben. Beide Bedingungen müssen geprüft werden.", "memory": "Erst Art erkennen, dann Zeit, Größe und örtliche Regeln prüfen.", "detailParagraphs": ["Eine Schonzeit ist eine Ruhezeit für eine Fischart. In dieser Zeit darf sie nicht gezielt befischt werden. Bei einer ganzjährigen Schonzeit gilt dieser Schutz das ganze Jahr. Ein Mindestmaß ist die kleinste erlaubte Entnahmegröße.", "Ein Entnahmefenster hat zusätzlich eine obere Grenze. So bleiben auch große Fische geschützt. Im bereitgestellten Hessen-Katalog steht für den Hecht zum Beispiel 50 bis 90 Zentimeter, für die Äsche 30 bis 45 Zentimeter. Ein Tagesfanglimit begrenzt die Anzahl, die entnommen werden darf.", "Eine Größenangabe allein reicht nicht: Artenschutz, Schonzeit und örtliche Regeln müssen ebenfalls passen. Die Antworten hier folgen deinem Katalog mit Hessen-Stand April 2024. Vor dem wirklichen Angeln werden die aktuell geltenden Bestimmungen für das konkrete Gewässer geprüft. „Keine Beschränkung“ in einer Katalogantwort bedeutet keine pauschale Erlaubnis für jeden Ort."]}, {"id": 18, "group": 2, "title": "Wer darf wo angeln?", "paragraphs": ["Darf ich persönlich angeln? Und darf ich an diesem Gewässer angeln? Das sind zwei verschiedene Fragen.", "Der Fischereischein betrifft deine persönliche Berechtigung. Ein Erlaubnisschein erlaubt das Angeln an einem bestimmten Gewässer.", "Ein frei zugängliches Ufer bedeutet nicht, dass jeder dort angeln darf. Auch für Kinder gibt es besondere Regeln.", "Dein Katalog nennt Regeln für Jugendliche von zehn bis unter sechzehn Jahren. Das erlaubt kein Alleinangeln. Prüfe mit einer erwachsenen Person die notwendige Begleitung und alle weiteren Voraussetzungen."], "example": "Denk an zwei Fragen: Darf ich persönlich angeln? Und habe ich die Erlaubnis für genau dieses Gewässer?", "memory": "Persönliche Berechtigung, Gewässererlaubnis und örtliche Regeln gehören zusammen.", "detailParagraphs": ["Ein Fischereischein und ein Erlaubnisschein erfüllen verschiedene Aufgaben. Der Fischereischein weist die persönliche Berechtigung nach. Der Erlaubnisschein betrifft das Angeln an einem bestimmten Gewässer. Ein frei zugängliches Ufer bedeutet also nicht automatisch, dass dort jeder angeln darf.", "Das Fischereirecht regelt unter anderem, wer sich Fische rechtmäßig aneignen darf. Es kann zeitweise verpachtet werden. Damit sind auch Pflichten verbunden. Gewässer und Fischbestand müssen verantwortungsvoll behandelt werden.", "Dein Fragenkatalog enthält besondere Regeln für Jugendliche in Hessen: Er nennt die Altersgruppe von zehn bis unter sechzehn Jahren und die gezahlte Fischereiabgabe. Das ist keine Erlaubnis zum Alleinangeln. Die notwendige Begleitung und die weiteren Voraussetzungen müssen erfüllt sein. Für aktuelle Einzelheiten ist die offizielle hessische Fischereiinformation verlinkt.", "Fischwanderhilfen sind keine Angelplätze. Schifffahrt und andere Menschen dürfen nicht beeinträchtigt werden."]}, {"id": 19, "group": 2, "title": "Natur schützen ist Teil des Angelns", "paragraphs": ["Ein Biotop ist ein Lebensraum. Ein Schilfufer ist zum Beispiel ein Zuhause für viele Tiere. Darum gibt es geschützte Bereiche.", "In einem Naturschutzgebiet können besondere Angelregeln gelten. Schau sie vor dem Angeln nach.", "Fischreste und anderer Abfall gehören nicht einfach ins Wasser. Geschützte Frösche darfst du nicht als Köder nehmen.", "Hegepflicht bedeutet: Wer das Fischereirecht hat, muss auch für einen passenden und gesunden Fischbestand sorgen."], "example": "Schilf ist für einen Vogel ein Brutplatz und für Jungfische ein Versteck. Eine freie Stelle fürs Angeln ist dort nicht wichtiger als der Lebensraum.", "memory": "Angeln bedeutet auch: Lebensräume erhalten und keinen Müll hinterlassen.", "detailParagraphs": ["Ein Biotop ist ein Lebensraum. Biotopschutz schützt zum Beispiel naturnahe Ufer, Röhrichte und andere wertvolle Bereiche. Tiere brauchen diese Orte zum Verstecken, Brüten und Aufwachsen. Regeln in einem Schutzgebiet können deshalb auch das Angeln begrenzen.", "Hegepflicht bedeutet, einen zum Gewässer passenden Fischbestand zu erhalten und zu fördern. Einfach Aquarienfische auszusetzen ist keine Hege: Fremde Arten und Krankheitserreger können große Schäden verursachen.", "Abfälle, auch Fischreste, gehören nicht einfach ins Gewässer. Geschützte Tiere werden nicht als Köder verwendet. Gemeinschaftliches Angeln ist außerdem nicht automatisch dasselbe wie verbotenes Wettfischen: Entscheidend sind Zweck und Regeln der Veranstaltung.", "Die rechtlichen Antworten der Webseite stammen aus deinem Prüfungskatalog. Für die Praxis sind die aktuellen Vorschriften und gegebenenfalls die Schutzgebietsverordnung entscheidend."]}, {"id": 20, "group": 3, "title": "Ruten und Rollen verstehen", "paragraphs": ["Die Rute hilft beim Werfen und federt den Zug eines Fisches ab. Das Wurfgewicht sagt, wie schwer die Montage sein darf. Zu viel Gewicht kann die Rute brechen.", "Eine Steckrute besteht aus Teilen, die du zusammensteckst. Eine Teleskoprute schiebst du auseinander.", "Bei der Stationärrolle wickelt sich die Schnur um die Spule. Bei der Multirolle dreht sich die Spule selbst.", "Prüfe die Ringe an der Rute. Eine scharfe Stelle kann die Schnur beschädigen."], "example": "Ein rauer Ring kann auf die Schnur wirken wie eine Feile. Ein kleiner Schaden kann später zum Schnurbruch führen.", "memory": "Steckrute steckt, Teleskoprute schiebt. Ringe prüfen, Wurfgewicht beachten.", "detailParagraphs": ["Die Rute trägt die Montage und federt Zug ab. Ihr Wurfgewicht gibt an, für welche Köder- und Montagegewichte sie gedacht ist. Zu schwere Belastung kann sie beschädigen. Eine Steckrute besteht aus zusammensteckbaren Teilen. Eine Teleskoprute lässt sich ineinanderschieben.", "Bei einer Stationärrolle dreht sich die Spule beim Einholen nicht um ihre Achse; der Rotor wickelt die Schnur darum. Bei einer Multirolle dreht sich die Spule. Zum Fliegenfischen gehört eine passende Fliegenrolle.", "Schnurlaufringe führen die Schnur. Risse oder scharfe Stellen können sie beschädigen. Besonders der Spitzenring wird stark beansprucht. Vor dem Angeln werden deshalb Rute, Ringe und Montage kontrolliert. Eine Feederrute besitzt eine empfindliche Spitze, an der man Bisse erkennen kann."]}, {"id": 21, "group": 3, "title": "Schnur, Knoten und Bremse", "paragraphs": ["Monofile Schnur besteht aus einem Faden. Multifile Schnur besteht aus mehreren Fasern. Sie ist oft geflochten.", "Die Hauptschnur kommt von der Rolle. Das Vorfach ist das Stück vor dem Haken. Für Hechte muss es den scharfen Zähnen standhalten.", "Ein Knoten kann eine schwache Stelle sein. Feuchte monofile Schnur vor dem Festziehen an. Beschädigte Schnur wird ersetzt.", "Die Bremse an der Rolle gibt bei starkem Zug Schnur frei. So reißt die Schnur nicht so leicht. Ein Wirbel hilft gegen das Verdrehen der Schnur."], "example": "Die Bremse ist wie ein Sicherheitsventil: Sie lässt nach, bevor zu viel Kraft auf die Schnur wirkt.", "memory": "Die Montage ist nur so stark wie ihre schwächste Stelle.", "detailParagraphs": ["Monofile Schnur besteht aus einem Faden. Multifile Schnur besteht aus mehreren Fasern und ist häufig geflochten. Schnüre werden unter anderem nach Durchmesser und Tragkraft unterschieden. Die Schnur muss zu Fischart, Größe und Gewässer passen.", "Knoten sind oft schwächere Stellen. Monofile Schnur wird beim Zuziehen angefeuchtet, damit weniger Reibungswärme entsteht. Aufgeraute Schnur wird ersetzt. Die Hauptschnur läuft von der Rolle bis zum Vorfach, das den letzten Abschnitt vor dem Haken bildet. Für scharfzähnige Räuber braucht es ein geeignetes bissfestes Vorfach.", "Die Rollenbremse gibt bei starkem Zug Schnur frei. So soll die schwächste Stelle nicht überlastet werden. Ein Wirbel kann sich drehen und vermindert Schnurdrall. Vor dem ersten Wurf helfen eine Zugprobe und die richtige Bremseinstellung."]}, {"id": 22, "group": 3, "title": "Posen, Haken und Bissanzeiger", "paragraphs": ["Eine Pose schwimmt. Sie zeigt an, wenn ein Fisch am Köder zieht. Sie hält den Köder auch in der gewünschten Tiefe.", "Eine Feststellpose sitzt fest. Eine Laufpose gleitet an der Schnur. Ein Stopper hält sie an der richtigen Stelle an.", "Gewichte richten die Pose auf. Zu viel Gewicht zieht sie unter Wasser.", "Ein Einfachhaken hat eine Spitze. Ein Drilling hat drei. Ein Schonhaken besitzt keinen Widerhaken. Er lässt sich leichter lösen."], "example": "Eine Laufpose gleitet wie eine Perle auf einer Schnur. Der Stopper sagt: Bis hierhin und nicht weiter.", "memory": "Pose zeigt den Biss. Stopper stellt die Tiefe ein. Gewicht hält die Pose aufrecht.", "detailParagraphs": ["Eine Pose schwimmt auf dem Wasser, zeigt Bisse an und hält den Köder in einer bestimmten Tiefe. Eine Feststellpose sitzt fest an der Schnur. Eine Laufpose kann gleiten; ein Stopper begrenzt ihren Weg. Sie ist praktisch, wenn das Wasser tiefer als die Rute lang ist.", "Gewichte unterhalb der Pose richten sie auf. Zu viel Gewicht zieht sie unter Wasser. Die Beschwerung muss deshalb zum Auftrieb der Pose passen. Ein Knicklicht kann die Bissanzeige nachts sichtbar machen. Ein Boilie ist dagegen ein Köder, kein Bissanzeiger.", "Ein Einfachhaken hat eine Spitze, ein Drilling drei. Ein Schonhaken hat keinen Widerhaken und lässt sich leichter lösen. Hakenlöser oder Zange helfen beim vorsichtigen Entfernen. Bei den üblichen Hakengrößen ohne „/0“ steht eine kleinere Zahl für einen größeren Haken."]}, {"id": 23, "group": 3, "title": "Köder und Angelmethoden", "paragraphs": ["Beim Grundangeln liegt der Köder am oder nahe dem Boden. B
