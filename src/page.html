.article p{max-width:720px;line-height:1.8;font-family:system-ui,sans-serif;font-size:18px;margin-bottom:20px}.term-wrap{position:relative;display:inline}.term{font:inherit;color:#245647;border:0;border-bottom:2px dotted #6d8b49;background:#e9f0d6;padding:0 2px;border-radius:2px;cursor:help;text-align:inherit}.term-tip{display:none;position:fixed;bottom:22px;right:22px;left:auto;width:280px;max-width:80vw;background:#173e33;color:#fffef9;border-radius:7px;box-shadow:0 4px 25px #0002;padding:15px 18px;z-index:30;font:15px/1.55 system-ui,sans-serif;text-align:left;letter-spacing:0}.term-tip b{display:block;color:#dcedab;font-size:12px;margin-bottom:6px}.term[aria-expanded=true]+.term-tip,.term:focus-visible:not([data-dismissed])+.term-tip{display:block}@media(hover:hover){.term-wrap:hover>.term-tip{display:block}}.word-box{margin:25px 0;padding:16px 20px;background:#eef1e6;border-radius:6px;font:16px/1.6 system-ui,sans-serif}.word-box summary{cursor:pointer;font-weight:600}.word-box dt{font-weight:700;margin-top:15px}.word-box dd{margin:3px 0 15px}.reading-tools{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin:0 0 25px;font:13px/1.5 system-ui,sans-serif;color:var(--muted)}.reading-tools button{font-size:14px}.sketch{margin:28px 0;padding:22px 20px;border:1px solid var(--line);border-radius:6px;background:var(--white)}.sketch figcaption{font:700 18px/1.4 system-ui,sans-serif;margin-bottom:16px}.sketch svg{display:block;width:100%;height:auto;overflow:visible}.sketch svg text{fill:#123c34;font:14px system-ui,sans-serif}.sketch svg .svg-title{font-size:16px;font-weight:700}.sketch svg .svg-small{font-size:12px}.article p.sketch-note,.sketch-note{font:13px/1.6 system-ui,sans-serif;color:var(--muted);margin:12px 0 0}.compare{display:grid;grid-template-columns:1fr 1fr;gap:22px;font:16px/1.6 system-ui,sans-serif}.compare>div{padding:12px}.article .compare p{font-size:16px;margin:8px 0}.swatch{padding:14px;border-radius:5px;margin-bottom:15px;font-weight:600}.sky{background:#dfefef}.ground{background:#3e5141;color:white}.learning-flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:15px/1.5 system-ui,sans-serif}.learning-flow>div{flex:1;text-align:center;min-width:85px;padding:12px 8px;background:#edf2dc;border-radius:6px}.flow-number{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}.flow-arrow{font-size:22px}.water-layer{text-align:center;padding:21px;font:16px system-ui,sans-serif}.mini-heading{font:600 16px system-ui,sans-serif;margin:27px 0 10px}.feedback p{font-family:system-ui,sans-serif;line-height:1.7}.example,.memory{font-family:system-ui,sans-serif;font-size:17px;line-height:1.65}@media(max-width:680px){.term-tip{position:fixed;bottom:18px;left:5vw;width:90vw;max-width:90vw}.compare{grid-template-columns:1fr;gap:4px}.sketch{padding:16px 10px;overflow-x:auto}.sketch svg{min-width:570px}.sketch:has(svg)::after{content:'← Skizze seitlich verschieben →';display:block;font:12px system-ui,sans-serif;color:var(--muted);padding-top:12px}.article p{font-size:17px;line-height:1.8}.learning-flow{flex-direction:column}.learning-flow>div{width:100%}.flow-arrow{transform:rotate(90deg)}}

</style></head><body><a class="skip" href="#main">Zum Inhalt</a><header><button class="brand" data-action="home">Am Wasser</button><nav aria-label="Hauptnavigation"><button data-view="learn">Lernen</button><button data-view="quiz">Quiz</button><button data-view="saved">Merkliste</button><button data-view="exam">Prüfung</button><button data-view="history">Historie</button></nav></header><button class="mobile-menu" aria-expanded="false" aria-controls="sidebar" data-action="menu">Lehrbuch & Themen öffnen</button><div class="shell"><aside id="sidebar"></aside><main id="main" tabindex="-1"></main></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const QUESTIONS=__QUESTIONS__, LESSONS=__LESSONS__;
const GROUPS=['Allgemeine Fischkunde','Gewässerökologie','Rechtskunde','Gerätekunde','Spezielle Fischkunde'];
const KEY='am-wasser-v2';let persisted={};try{persisted=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('am-wasser-v1')||'{}')}catch{}
let saved=new Set(Array.isArray(persisted.saved)?persisted.saved:[]),read=new Set(Array.isArray(persisted.read)?persisted.read:[]),stats=persisted.stats&&typeof persisted.stats==='object'?persisted.stats:{};
let view='learn',lessonId=0,expanded=0,search='',filterGroup='all',quiz=null,toastTimer;
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arrow='<svg class="arrow" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m7 3 7 7-7 7" stroke="currentColor" stroke-width="1.6"/></svg>';
const byId=id=>QUESTIONS.find(q=>q.id===Number(id));
function store(){try{localStorage.setItem(KEY,JSON.stringify({saved:[...saved],read:[...read],stats}))}catch{toast('Dieser Browser kann den Lernstand gerade nicht speichern.')}}
function toast(s){$('#toast').textContent=s;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),3200)}
function sources(){return `<footer class="source">Grundlage: dein Fragenkatalog, Bund Oktober 2023 · Hessen April 2024. Alle 563 Fragen und markierten Lösungen wurden aus dem PDF übernommen. Die Lehrbuchtexte sind ergänzende, vereinfachte Erklärungen.<br><a href="https://landwirtschaft.hessen.de/wasser/fischerei" target="_blank" rel="noopener">Offizielle Informationen & aktuelle Vorschriften in Hessen</a> · <a href="https://landwirtschaft.hessen.de/sites/landwirtschaft.hessen.de/files/2025-06/fischerpruefungsfragen_und-antworten_hessen_mit_loesungen.pdf" target="_blank" rel="noopener">Offizieller Fragenkatalog</a><br>Lernstand nur in diesem Browser · Keine Anmeldung · Keine Datenübertragung<div class="footer-controls"><button class="text-button" data-action="export">Lernstand sichern</button><label class="text-button" style="cursor:pointer">Lernstand laden<input type="file" id="import-v2" accept="application/json" class="hidden"></label><button class="text-button" data-action="reset">Lernstand zurücksetzen</button></div></footer>`}
function sidebar(){let known=Object.values(stats).filter(s=>s.last===true).length;$('#sidebar').innerHTML=`<h2>Dein Lehrbuch</h2>${GROUPS.map((g,i)=>`<div class="group"><button class="group-title" data-group="${i}" aria-expanded="${expanded===i}"><span>0${i+1}</span>${g}</button>${expanded===i?`<div class="chapter-list">${LESSONS.filter(l=>l.group===i).map(l=>`<button class="${lessonId===l.id&&view==='learn'?'active':''}" data-lesson="${l.id}" ${lessonId===l.id&&view==='learn'?'aria-current="page"':''}>${esc(l.title)}${read.has(l.id)?' · gelesen':''}</button>`).join('')}</div>`:''}</div>`).join('')}<div class="progress-note small">${read.size} von ${LESSONS.length} Lektionen gelesen<div class="track"><span style="width:${read.size/LESSONS.length*100}%"></span></div>${known} von ${QUESTIONS.length} Fragen zuletzt richtig beantwortet</div><button class="text-button" data-view="catalog">Alle Fragen durchsuchen</button>`}
function render(){document.querySelectorAll('nav button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view||(view==='catalog'&&b.dataset.view==='learn'));if(b.dataset.view===view)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});sidebar();if(view==='learn')renderLesson();else if(view==='quiz')renderQuiz();else renderCatalog();}
function go(v){if('speechSynthesis' in window)window.speechSynthesis.cancel();view=v;search='';render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}
function openLesson(id){if('speechSynthesis' in window)window.speechSynthesis.cancel();lessonId=Number(id);expanded=LESSONS[lessonId].group;view='learn';$('#sidebar').classList.remove('open');$('.mobile-menu').setAttribute('aria-expanded','false');render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})}
function legal(q){return Number(q.section[0])===3?'<div class="legal-note">Prüfungsantwort nach deinem Katalog (Hessen: April 2024). Aktuelle und örtliche Regeln können abweichen.</div>':''}
function renderLesson(){const l=LESSONS[lessonId],related=QUESTIONS.filter(q=>q.lesson===l.id);$('#main').innerHTML=`${l.id===0?`<section class="hero"><h1>Die Welt unter<br>Wasser verstehen.</h1><p>Dein Lernbegleiter zur Fischerprüfung in Hessen.</p><button class="primary" data-view="quiz">Quiz starten ${arrow}</button></section>`:''}<article class="article"><div class="eyeline">0${l.group+1} / ${GROUPS[l.group]}</div><h2>${esc(l.title)}</h2><div class="reading-tools"><span>Markierte Wörter: antippen oder mit der Maus berühren.</span><button class="secondary" data-listen="1">Vorlesen / Stopp</button></div>${l.paragraphs.map((p,i)=>`<p>${rich(p)}</p>${l.id===0&&i===2?shapeSketch():''}${l.id===0&&i===3?mouthSketch():''}`).join('')}${l.id===0?camouflageSketch():sketchFor(l.id)}<div class="memory"><div class="inside"><strong>Merksatz</strong>${rich(l.memory)}</div></div><div class="example"><strong>Stell dir vor</strong>${rich(l.example)}</div>${wordHelp(l)}<details class="word-box"><summary>Mehr erfahren · die ausführliche Erklärung</summary>${l.detailParagraphs.map(p=>`<p>${rich(p)}</p>`).join('')}</details>${l.group===2?'<div class="legal-note">Rechtswissen zum bereitgestellten Katalog. Für das Angeln gelten die aktuellen Regeln des jeweiligen Gewässers.</div>':''}<button class="rowlink" data-topicquiz="${l.id}"><span>Passende Prüfungsfragen<small>${related.length} Fragen zu diesem Thema üben</small></span>${arrow}</button><div class="actions"><button class="${read.has(l.id)?'secondary':'primary'}" data-read="${l.id}">${read.has(l.id)?'Als ungelesen markieren':'Lektion als gelesen markieren'}</button>${l.id<LESSONS.length-1?`<button class="secondary" data-lesson="${l.id+1}">Nächste Lektion ${arrow}</button>`:''}</div><details><summary>Fragen und Lösungen zum Nachlesen (${related.length})</summary>${related.map(questionRow).join('')}</details></article>${sources()}`}
function questionRow(q){return `<div class="question-row"><div class="badge">${esc(q.section.replace(/^\d\. /,''))} · Frage ${q.number} · PDF-Seite ${q.page}</div><h3>${esc(q.question)}</h3><details><summary>Lösung & Erklärung anzeigen</summary><p><strong>Richtig: ${'ABC'[q.correct[0]]} · ${esc(q.answers[q.correct[0]])}</strong></p><p>${rich(explanation(q))}</p>${legal(q)}<button class="text-button" data-lesson="${q.lesson}">Im Lehrbuch weiterlesen ${arrow}</button></details><div class="actions"><button class="secondary" data-save="${q.id}">${saved.has(q.id)?'Aus Merkliste entfernen':'Frage merken'}</button><button class="secondary" data-single="${q.id}">Diese Frage üben</button></div></div>`}
function explanation(q){return EXPLANATIONS[q.id]||LESSONS[q.lesson].paragraphs[bestParagraph(q)]}
function bestParagraph(q){let terms=(q.question+' '+q.answers[q.correct[0]]).toLowerCase().match(/[a-zäöüß]{5,}/g)||[];let p=LESSONS[q.lesson].paragraphs;let scores=p.map(t=>terms.reduce((n,w)=>n+(t.toLowerCase().includes(w)?1:0),0));return scores.indexOf(Math.max(...scores))}
function renderCatalog(){const isSaved=view==='saved';$('#main').innerHTML=`<h1 class="page-title">${isSaved?'Deine Merkliste.':'Alle Fragen. Alles auffindbar.'}</h1><p class="intro">${isSaved?'Hier sammelst du, was du noch einmal üben möchtest.':'Suche nach einem Fisch, einem Fachwort oder einer Frage.'}</p><input class="search" id="search" aria-label="Fragen durchsuchen" placeholder="Zum Beispiel: Hecht, Sauerstoff, Schonzeit …" value="${esc(search)}"><div class="fields"><label>Themengebiet<select id="catalogGroup"><option value="all">Alle Themen</option>${GROUPS.map((g,i)=>`<option value="${i}" ${filterGroup==i?'selected':''}>${g}</option>`).join('')}</select></label></div>${isSaved?'<button class="primary" data-action="savedquiz">Merkliste üben</button>':''}<div id="results"></div>${sources()}`;renderResults()}
function filtered(){return QUESTIONS.filter(q=>(view!=='saved'||saved.has(q.id))&&(filterGroup==='all'||Number(q.section[0])-1===Number(filterGroup))&&`${q.question} ${q.answers.join(' ')}`.toLowerCase().includes(search.toLowerCase()))}
function renderResults(){let a=filtered();$('#results').innerHTML=`<p class="small">${a.length} ${a.length===1?'Frage':'Fragen'}</p>${a.length?a.map(questionRow).join(''):'<p class="empty">Hier ist noch nichts. Suche anders oder merke dir Fragen beim Üben.</p>'}`}
function renderQuiz(){if(!quiz){$('#main').innerHTML=`<h1 class="page-title">Wissen wächst<br>mit jeder Frage.</h1><p class="intro">Wähle dein Thema und probiere es aus. Fehler zeigen dir, was du als Nächstes lernen kannst.</p><div class="fields"><label>Thema<select id="quizGroup"><option value="all">Alle fünf Themen</option>${GROUPS.map((g,i)=>`<option value="${i}">${g}</option>`).join('')}</select></label><label>Umfang<select id="quizLength"><option value="10">10 Fragen</option><option value="20">20 Fragen</option><option value="60">60 Fragen</option><option value="all">Alle passenden Fragen</option></select></label><label>So möchtest du üben<select id="quizMode"><option value="practice">Mit direkter Erklärung</option><option value="test">Selbsttest – Lösungen am Ende</option></select></label><label>Auswahl<select id="quizPool"><option value="all">Alle Fragen</option><option value="wrong">Zuletzt falsch beantwortet</option><option value="new">Noch nicht beantwortet</option><option value="saved">Meine Merkliste</option></select></label></div><button class="primary" data-action="start">Runde starten ${arrow}</button><div class="memory"><div class="inside"><strong>So funktioniert's</strong>Eine Antwort pro Frage. Im Lernmodus erfährst du sofort, warum sie stimmt. Im Selbsttest kommt die Auswertung zum Schluss.</div></div><p class="small">Freie Übungsrunden mit Originalfragen. Der Selbsttest bildet keine amtliche Prüfungsbewertung nach.</p>${sources()}`;return}if(quiz.done){renderResult();return}let q=byId(quiz.ids[quiz.index]),chosen=quiz.responses[q.id],answered=chosen!==undefined,reveal=answered&&quiz.mode==='practice';$('#main').innerHTML=`<div class="quiz-top"><span class="small">Frage ${quiz.index+1} von ${quiz.ids.length} · ${quiz.mode==='practice'?'Lernmodus':'Selbsttest'}</span><button class="text-button" data-action="end">Runde beenden</button></div><div class="track"><span style="width:${(quiz.index+(answered?1:0))/quiz.ids.length*100}%"></span></div><div class="eyeline" style="margin-top:28px">${esc(q.section.replace(/^\d\. /,''))} · Originalfrage ${q.number}</div><h2 class="question">${esc(q.question)}</h2><div class="answers">${q.answers.map((a,i)=>`<button class="answer ${answered&&chosen===i?'chosen':''} ${reveal&&i===q.correct[0]?'correct':''} ${reveal&&chosen===i&&i!==q.correct[0]?'wrong':''}" data-answer="${i}" ${answered?'disabled':''}><span class="letter">${'ABC'[i]}</span><span>${esc(a)}${reveal&&i===q.correct[0]?' <strong>✓ Richtig</strong>':''}${reveal&&chosen===i&&i!==q.correct[0]?' <strong>– Deine Antwort</strong>':''}</span></button>`).join('')}</div>${reveal?`<section class="feedback ${chosen===q.correct[0]?'':'wrong'}" aria-live="polite"><h3>${chosen===q.correct[0]?'Richtig – gut verstanden.':'Noch nicht ganz. Schau dir die Erklärung an.'}</h3><p><strong>${esc(q.answers[q.correct[0]])}</strong></p><p>${rich(explanation(q))}</p><p class="small">Merksatz: ${esc(LESSONS[q.lesson].memory)}</p><details><summary>Die passende Lektion lesen</summary>${LESSONS[q.lesson].paragraphs.map(p=>`<p>${rich(p)}</p>`).join('')}<p><strong>Beispiel:</strong> ${esc(LESSONS[q.lesson].example)}</p></details></section>${legal(q)}`:''}<div class="actions"><button class="primary" data-action="next" ${answered?'':'disabled'}>${quiz.index===quiz.ids.length-1?'Ergebnis ansehen':'Nächste Frage'} ${arrow}</button><button class="secondary" data-save="${q.id}">${saved.has(q.id)?'Gemerkt · entfernen':'Frage merken'}</button></div><p class="small">Quelle: dein PDF, Seite ${q.page}. ${quiz.mode==='test'?'Lösungen erscheinen erst in der Auswertung.':'Du kannst schwierige Fragen in deiner Merkliste sammeln.'}</p>`}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(pool,length=10,mode='practice'){if(!pool.length){toast('Dafür sind noch keine Fragen vorhanden. Wähle eine andere Auswahl.');return}quiz={ids:shuffle(pool.map(q=>q.id)).slice(0,length==='all'?pool.length:Number(length)),index:0,responses:{},mode,done:false};go('quiz')}
function answer(i){let q=byId(quiz.ids[quiz.index]);if(quiz.responses[q.id]!==undefined)return;quiz.responses[q.id]=i;let prev=stats[q.id]||{attempts:0,correct:0};stats[q.id]={attempts:prev.attempts+1,correct:prev.correct+(i===q.correct[0]?1:0),last:i===q.correct[0]};store();render();}
function renderResult(){let answered=quiz.ids.filter(id=>quiz.responses[id]!==undefined),right=answered.filter(id=>quiz.responses[id]===byId(id).correct[0]),wrong=answered.filter(id=>!right.includes(id));$('#main').innerHTML=`<h1 class="page-title">Deine Runde ist geschafft.</h1><div class="score">${right.length} / ${answered.length}</div><p class="intro">${answered.length?'richtig beantwortet. '+(wrong.length?'Diese Themen kannst du jetzt gezielt wiederholen.':'Alle beantworteten Fragen richtig – prima!'):'Du hast noch keine Frage beantwortet.'}</p><p class="small">${answered.length} von ${quiz.ids.length} Fragen beantwortet · Keine amtliche Bestehensbewertung</p><div class="actions">${wrong.length?'<button class="primary" data-action="retry">Fehler noch einmal üben</button><button class="secondary" data-action="savewrong">Fehler zur Merkliste</button>':''}<button class="secondary" data-action="newquiz">Neue Runde</button></div><h2>Deine Antworten nachlesen</h2>${answered.map(id=>{let q=byId(id);return `<div class="question-row"><div class="badge">${right.includes(id)?'Richtig':'Noch einmal üben'} · Deine Antwort: ${'ABC'[quiz.responses[id]]}</div><h3>${esc(q.question)}</h3><p><strong>Lösung: ${'ABC'[q.correct[0]]} · ${esc(q.answers[q.correct[0]])}</strong></p><p>${rich(explanation(q))}</p>${legal(q)}<button class="text-button" data-lesson="${q.lesson}">Passende Lektion lesen ${arrow}</button></div>`}).join('')}${sources()}`}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.view){go(d.view);return}if(d.lesson!==undefined){openLesson(d.lesson);return}if(d.group!==undefined){expanded=expanded===Number(d.group)?-1:Number(d.group);sidebar();return}if(d.read!==undefined){let id=Number(d.read);read.has(id)?read.delete(id):read.add(id);store();render();return}if(d.save!==undefined){let id=Number(d.save);saved.has(id)?saved.delete(id):saved.add(id);store();b.textContent=saved.has(id)?'Gemerkt · entfernen':'Frage merken';if(view==='saved')renderResults();return}if(d.topicquiz!==undefined){startQuiz(QUESTIONS.filter(q=>q.lesson===Number(d.topicquiz)),'all');return}if(d.single!==undefined){startQuiz([byId(d.single)],1);return}if(d.answer!==undefined){answer(Number(d.answer));return}switch(d.action){case'home':openLesson(0);break;case'menu':{let open=$('#sidebar').classList.toggle('open');b.setAttribute('aria-expanded',open);b.textContent=open?'Lehrbuch schließen':'Lehrbuch & Themen öffnen';break}case'start':{let g=$('#quizGroup').value,p=$('#quizPool').value;let a=QUESTIONS.filter(q=>(g==='all'||Number(q.section[0])-1===Number(g))&&(p==='all'||p==='saved'&&saved.has(q.id)||p==='wrong'&&stats[q.id]?.last===false||p==='new'&&!stats[q.id]));startQuiz(a,$('#quizLength').value,$('#quizMode').value);break}case'next':if(quiz.responses[quiz.ids[quiz.index]]===undefined)return;if(quiz.index<quiz.ids.length-1)quiz.index++;else quiz.done=true;render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});break;case'end':quiz.done=true;render();window.scrollTo(0,0);break;case'newquiz':quiz=null;go('quiz');break;case'retry':{let wrong=quiz.ids.filter(id=>quiz.responses[id]!==undefined&&quiz.responses[id]!==byId(id).correct[0]);startQuiz(wrong.map(byId),'all');break}case'savedquiz':startQuiz(QUESTIONS.filter(q=>saved.has(q.id)),'all');break;case'savewrong':quiz.ids.filter(id=>quiz.responses[id]!==undefined&&quiz.responses[id]!==byId(id).correct[0]).forEach(id=>saved.add(id));store();toast('Die schwierigen Fragen sind jetzt auf deiner Merkliste.');break;case'reset':if(confirm('Gespeicherte Antworten, gelesene Lektionen und Merkliste wirklich zurücksetzen?')){saved.clear();read.clear();stats={};quiz=null;store();render()}break;case'export':{let data=JSON.stringify({version:1,saved:[...saved],read:[...read],stats},null,2);let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='am-wasser-lernstand.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break}}});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;renderResults()}});
document.addEventListener('change',async e=>{if(e.target.id==='catalogGroup'){filterGroup=e.target.value;renderResults()}if(e.target.id==='import'){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(data.version!==1||!Array.isArray(data.saved)||!Array.isArray(data.read)||!data.stats||typeof data.stats!=='object')throw Error();data.saved.filter(id=>byId(id)).forEach(id=>saved.add(id));data.read.filter(id=>Number.isInteger(id)&&LESSONS[id]).forEach(id=>read.add(id));for(let [id,s] of Object.entries(data.stats)){if(byId(id)&&Number.isInteger(s.attempts)&&s.attempts>=0&&Number.isInteger(s.correct)&&s.correct>=0&&s.correct<=s.attempts&&typeof s.last==='boolean')stats[id]=s}store();render();toast('Lernstand geladen.')}catch{toast('Diese Datei ist kein gültiger Lernstand.')}}});

function mouthSketch(){let panels=[['Nach oben','Oberständig','Futter an der Oberfläche',-25],['Nach vorne','Endständig','Futter vor dem Fisch',0],['Nach unten','Unterständig','Futter am Boden',25]];return `<figure class="sketch"><figcaption>Das Maul zeigt zum Futter</figcaption>${svgStart('Drei Maulstellungen: oberständig nach oben, endständig nach vorne, unterständig nach unten',660,220)}${panels.map(([t,term,sub,dy],i)=>{let x=i*220;return `<g transform="translate(${x} 0)"><path d="M22 84 Q90 35 162 84 Q90 133 22 84L8 101V67Z" fill="#dcedab" stroke="#245647" stroke-width="2.5"/><circle cx="137" cy="69" r="3" fill="#123c34"/><circle cx="${dy?151:161}" cy="${84+dy*.48}" r="6" fill="#fffef9" stroke="#c0692e" stroke-width="3"/><path d="M${dy?158:171} ${84+dy*.6}l25 ${dy}" fill="none" stroke="#c0692e" stroke-width="3"/><circle cx="${dy?195:205}" cy="${84+dy*1.8}" r="4" fill="#c0692e"/><text x="110" y="150" text-anchor="middle" class="svg-title">${t}</text><text x="110" y="173" text-anchor="middle">${term}</text><text x="110" y="198" text-anchor="middle" class="svg-small">${sub}</text></g>`}).join('')}</svg><p class="sketch-note">Orange zeigt Maul und Futter. Die Skizze zeigt die Richtung, keine bestimmte Fischart.</p></figure>`}

function flowSketch(title,items,note){return `<figure class="sketch"><figcaption>${title}</figcaption><div class="learning-flow">${items.map((t,i)=>`<div><span class="flow-number">${i+1}</span>${t}</div>${i<items.length-1?'<span class="flow-arrow" aria-hidden="true">→</span>':''}`).join('')}</div><p class="sketch-note">${note}</p></figure>`}
function sketchFor(id){switch(id){case 0:return shapeSketch()+mouthSketch()+camouflageSketch();case 1:return flowSketch('Drei Aufgaben der Flossen',['Schwanz<br><b>Vorwärts</b>','Brust<br><b>Lenken</b>','Rücken & After<br><b>Gerade halten</b>'],'Die Flossen arbeiten zusammen.');case 2:return flowSketch('So kommt Sauerstoff zum Fisch',['Wasser mit<br>Sauerstoff','Kiemen nehmen<br>Sauerstoff auf','Blut bringt ihn<br>in den Körper'],'Das ist stark vereinfacht. Über die Kiemen wird auch Kohlendioxid abgegeben.');case 4:return flowSketch('Vom Ei zum Fisch',['Ei','Larve mit<br>Dottersack','Jungfisch','Erwachsener<br>Fisch'],'Der Dottersack liefert der Larve anfangs Nahrung.');case 5:return `<figure class="sketch"><figcaption>Zwei Reisen – zwei Richtungen</figcaption><div class="compare"><div><strong>Lachs</strong><p>Meer → Fluss</p><b>Zum Laichen ins Süßwasser</b></div><div><strong>Aal</strong><p>Binnengewässer → Meer</p><b>Zum Laichen ins Meer</b></div></div><p class="sketch-note">Der Aal nutzt auch Küstengewässer. Die Pfeile zeigen die Laichwanderung.</p></figure>`;case 9:return `<figure class="sketch"><figcaption>Was machen Pflanzen bei Tag und Nacht?</figcaption><div class="compare"><div><strong>Tag · Licht</strong><p>Photosynthese bildet Sauerstoff.<br>Atmung verbraucht Sauerstoff.</p></div><div><strong>Nacht · Dunkel</strong><p>Keine Photosynthese.<br>Atmung verbraucht weiter Sauerstoff.</p></div></div></figure>`;case 10:return `<figure class="sketch"><figcaption>Ein See im Sommer · von oben nach unten</figcaption><div class="water-layer" style="background:#edf1c8">Oben: warmes Wasser</div><div class="water-layer" style="background:#c8e0d1">Sprungschicht: rasch kälter</div><div class="water-layer" style="background:#275b56;color:white">Unten: kaltes Wasser</div><p class="sketch-note">Vereinfachte Schichtung. Im Frühjahr und Herbst kann sich das Wasser durchmischen.</p></figure>`;case 11:return flowSketch('Von der Quelle zur Mündung',['Forelle','Äsche','Barbe','Brasse','Kaulbarsch<br>& Flunder'],'Die Flussabschnitte sind nach typischen Fischen benannt.');case 12:return flowSketch('Wer frisst wen?',['Alge','Wasserfloh','Jungfisch','Raubfisch'],'Der Pfeil bedeutet hier: wird gefressen von.');case 13:return flowSketch('Die pH-Skala: drei Bereiche',['Unter 7<br><b>sauer</b>','Genau 7<br><b>neutral</b>','Über 7<br><b>basisch</b>'],'Neutral bedeutet nicht automatisch sauber oder für jede Art geeignet.');case 17:return flowSketch('Vor dem Behalten prüfen',['Welche<br>Fischart?','Ist gerade<br>Schonzeit?','Passt die<br>Größe?','Was gilt<br>vor Ort?'],'Alle Bedingungen müssen passen. Prüfe die aktuellen Regeln mit einem Erwachsenen.');case 21:return flowSketch('Von der Rolle zum Haken',['Rolle','Hauptschnur','Vorfach','Haken'],'Vereinfacht: Je nach Montage kommen weitere Teile hinzu.');default:return ''}}

let events=Array.isArray(persisted.events)?persisted.events:[], sessions=Array.isArray(persisted.sessions)?persisted.sessions:[];

const modeLabel=m=>m==='exam'?'Prüfungssimulation':m==='test'?'Selbsttest':'Lernrunde';

function validRun(r){return r&&typeof r.id==='string'&&['practice','test','exam'].includes(r.mode)&&Array.isArray(r.ids)&&r.ids.length>0&&r.ids.every(id=>byId(id))&&new Set(r.ids).size===r.ids.length&&Number.isInteger(r.index)&&r.index>=0&&r.index<r.ids.length&&r.responses&&typeof r.responses==='object'&&Object.entries(r.responses).every(([id,a])=>r.ids.includes(Number(id))&&Number.isInteger(a)&&a>=0&&a<3)&&Number.isFinite(r.startedAt)&&(r.mode!=='exam'||(Number.isFinite(r.deadline)&&r.deadline===r.startedAt+7200000&&r.ids.length===60&&GROUPS.every((g,i)=>r.ids.filter(id=>groupOf(byId(id))===i).length===12)))}

store=function(){try{localStorage.setItem(KEY,JSON.stringify(stateData()))}catch{toast('Der Speicher ist voll oder gesperrt. Bitte sichere deinen Lernstand als Datei.')}};
const oldRender=render,oldQuiz=renderQuiz,oldResult=renderResult,oldGo=go,oldOpenLesson=openLesson,oldSources=sources;
const examActive=()=>quiz?.mode==='exam'&&!quiz.done;
const recentFor=id=>events.filter(e=>e.questionId===id);
function difficulty(id){let list=recentFor(id),tail=list.slice(-5),streak=0;for(let i=list.length-1;i>=0&&list[i].correct===false;i--)streak++;return {list,tail,streak,wrong:tail.filter(e=>e.correct===false).length}}
function coaching(id){let d=difficulty(id);if(!d.list.length)return '';let last=d.list.at(-1);if(d.streak>=2)return `Diese Frage scheint dir noch schwerzufallen. Du hast sie zuletzt ${d.streak}-mal hintereinander nicht richtig beantwortet. Schau dir die Erklärung an. Dann probieren wir es noch einmal.`;if(last.correct&&d.list.length>=2&&d.list.at(-2).correct===false)return 'Diesmal richtig! Du hast einen Schritt nach vorne gemacht.';if(d.wrong>=3)return `Bei deinen letzten ${d.tail.length} Versuchen war diese Frage ${d.wrong}-mal schwierig. Übe das Thema noch einmal in Ruhe.`;return last.correct?'Richtig beantwortet. Weiter so!':'Das war noch nicht richtig. Mit der Erklärung kannst du es beim nächsten Mal schaffen.'}
function logAnswer(q,chosen,run,at=Date.now()){if(events.some(e=>e.runId===run.id&&e.questionId===q.id))return;let correct=chosen===q.correct[0];events.push({id:uid(),runId:run.id,questionId:q.id,selected:chosen,correct,at,mode:run.mode});let prev=stats[q.id]||{attempts:0,correct:0};stats[q.id]={attempts:prev.attempts+1,correct:prev.correct+(correct?1:0),last:correct}}
function assess(ids,responses){let groups=GROUPS.map((name,i)=>{let qs=ids.map(byId).filter(q=>groupOf(q)===i);return {name,total:qs.length,right:qs.filter(q=>responses[q.id]===q.correct[0]).length}});let right=groups.reduce((s,g)=>s+g.right,0);return {right,groups,passed:ids.length===60&&groups.every(g=>g.total===12&&g.right>=9)&&right>=45}}

function timeLeft(){let seconds=Math.max(0,Math.ceil((quiz.deadline-Date.now())/1000));return `${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`}
function renderExamSetup(){let counts=sessions.filter(s=>s.mode==='exam');$('#main').innerHTML=`<h1 class="page-title">Deine Probeprüfung.</h1><p class="intro">Übe die schriftliche Prüfung nach den Regeln für Hessen.</p><div class="exam-rules"><div><b>60</b>Fragen</div><div><b>12</b>je Themengebiet</div><div><b>120</b>Minuten</div></div><div class="memory"><div class="inside"><strong>Wann hast du bestanden?</strong>Mindestens 45 richtige Antworten insgesamt <b>und mindestens 9 von 12 in jedem Gebiet</b>. Ein starkes Gebiet kann ein schwaches nicht ausgleichen.</div></div><p>Du kannst Fragen überspringen und Antworten ändern. Lösungen und Erklärungen siehst du erst nach der Abgabe. Die Uhr läuft auch weiter, wenn du die Seite schließt. Nach zwei Stunden wird automatisch ausgewertet.</p><p class="small">Simulation, keine staatliche Prüfung und kein amtlicher Prüfungsbogen. Zufällige Auswahl aus deinem bereitgestellten Katalog (Hessen April 2024). Grundlage: <a href="${RULE_URL}" target="_blank" rel="noopener">§§ 23–24 HFischV</a>, amtliche Veröffentlichung. Regeln geprüft am 10.10.2026.</p><div class="actions"><button class="primary" data-v2="exam-start">${examActive()?'Prüfung fortsetzen':'Prüfung starten'}</button><button class="secondary" data-view="history">${counts.length} Prüfungen in der Historie</button></div>${sources()}`}
function renderExam(){let q=byId(quiz.ids[quiz.index]),chosen=quiz.responses[q.id],answered=Object.keys(quiz.responses).length;$('#main').innerHTML=`<div class="quiz-top"><span>Prüfungssimulation · Frage ${quiz.index+1} / 60</span><strong id="exam-clock" aria-label="Verbleibende Zeit">${timeLeft()}</strong></div><p class="small">${answered} beantwortet · ${60-answered} noch offen. Du darfst Antworten ändern.</p><div class="track"><span style="width:${answered/60*100}%"></span></div><div class="eyeline">${GROUPS[groupOf(q)]}</div><h2 class="question">${esc(q.question)}</h2><div class="answers">${q.answers.map((a,i)=>`<button class="answer ${chosen===i?'chosen':''}" aria-pressed="${chosen===i}" data-answer="${i}"><span class="letter">${'ABC'[i]}</span><span>${esc(a)}</span></button>`).join('')}</div><div class="actions"><button class="secondary" data-v2="exam-prev" ${quiz.index===0?'disabled':''}>Zurück</button><button class="primary" data-v2="exam-next">${quiz.index===59?'Zur Übersicht':'Weiter / überspringen'}</button><button class="secondary" data-v2="exam-clear" ${chosen===undefined?'disabled':''}>Antwort löschen</button></div><details id="exam-overview"><summary>Alle 60 Fragen · direkt auswählen</summary><div class="question-grid">${quiz.ids.map((id,i)=>`<button data-jump="${i}" class="${quiz.responses[id]!==undefined?'answered':''}" aria-label="Frage ${i+1}, ${quiz.responses[id]!==undefined?'beantwortet':'offen'}" ${quiz.index===i?'aria-current="step"':''}>${i+1}</button>`).join('')}</div></details><div class="actions"><button class="primary" data-v2="exam-submit">Prüfung abgeben</button><button class="text-button" data-v2="exam-abort">Prüfung abbrechen</button></div><p class="small">Ohne Lernhilfen · Abgabe wertet auch offene Fragen als nicht richtig. Eine abgebrochene Prüfung zählt nicht als bestanden.</p>`}

function confirmExam(reason){let old=document.querySelector('#exam-confirm');if(old)old.remove();let msg=reason==='aborted'?'Möchtest du die Prüfung wirklich abbrechen? Der Versuch wird als abgebrochen gespeichert.':`${60-Object.keys(quiz.responses).length} Fragen sind noch offen. Möchtest du jetzt endgültig abgeben?`;$('#main').insertAdjacentHTML('afterbegin',`<section id="exam-confirm" class="memory" role="alert"><p>${msg}</p><div class="actions"><button class="primary" data-v2="${reason==='aborted'?'exam-confirm-abort':'exam-confirm-submit'}">${reason==='aborted'?'Ja, abbrechen':'Ja, endgültig abgeben'}</button><button class="secondary" data-v2="exam-cancel">Weiterarbeiten</button></div></section>`);window.scrollTo(0,0)}
function renderExamResult(){let s=sessions.find(s=>s.id===quiz.id);if(!s)return;let aborted=s.reason==='aborted';$('#main').innerHTML=`<h1 class="page-title">${aborted?'Prüfung abgebrochen.':s.result.passed?'Probeprüfung bestanden!':'Diesmal noch nicht bestanden.'}</h1><div class="score">${s.result.right} / 60</div><p>${s.reason==='timeout'?'Die zwei Stunden sind vorbei. Deine gespeicherten Antworten wurden ausgewertet.':aborted?'Dieser Versuch bleibt als abgebrochen in deiner Historie.':'Dein Ergebnis ist in der Historie gespeichert.'}</p>${groupTable(s.result)}<p class="small">${dateLabel(s.endedAt)} · ${duration(s)} · Bestehen: mindestens 45 insgesamt und 9 je Gebiet. Simulation nach <a href="${RULE_URL}">§§ 23–24 HFischV</a>.</p><div class="actions"><button class="primary" data-v2="exam-new">Neue Probeprüfung</button><button class="secondary" data-view="history">Zur Historie</button><button class="secondary" data-v2="review-errors">Fehler aus dieser Prüfung üben</button></div><details><summary>Alle Antworten und Erklärungen nachlesen</summary>${reviewRows(s)}</details>${sources()}`}
function duration(s){let secs=Math.max(0,Math.round((s.endedAt-s.startedAt)/1000));return `${Math.floor(secs/60)} Min. ${secs%60} Sek.`}
function reviewRows(s){return s.ids.map(id=>{let q=byId(id),a=s.responses[id],right=a===q.correct[0];return `<div class="question-row"><div class="badge">${right?'Richtig':a===undefined?'Nicht beantwortet':'Noch einmal üben'} · ${GROUPS[groupOf(q)]}</div><h3>${esc(q.question)}</h3><p>Deine Antwort: ${a===undefined?'keine':esc(q.answers[a])}</p><p><b>Richtig: ${esc(q.answers[q.correct[0]])}</b></p><p>${rich(explanation(q))}</p><button class="text-button" data-lesson="${q.lesson}">Erklärung im Lehrbuch</button></div>`}).join('')}
renderQuiz=function(){if(quiz?.mode==='exam'){if(quiz.done)renderExamResult();else renderExam();return}oldQuiz();if(quiz&&!quiz.done&&quiz.responses[quiz.ids[quiz.index]]!==undefined&&quiz.mode==='practice'){let q=byId(quiz.ids[quiz.index]),feedback=$('.feedback');if(feedback){let hint=document.createElement('p');hint.className='coach';hint.textContent=coaching(q.id);feedback.appendChild(hint)}}if(!quiz){let main=$('#main');main.insertAdjacentHTML('afterbegin','<p class="version-line">Fassung 2 · Lernrunden mit Antwort-Historie</p><div class="actions"><button class="secondary" data-view="exam">Prüfung nach Hessen-Regeln</button><button class="secondary" data-v2="hard-quiz">Schwierige Fragen üben</button></div>')}};
renderResult=function(){if(quiz?.mode==='exam'){renderExamResult();return}oldResult();$('#main').insertAdjacentHTML('afterbegin','<p class="version-line">Diese Runde ist in deiner Historie gespeichert.</p>')};
render=function(){if(quiz?.done&&!sessions.some(s=>s.id===quiz.id))finishRun('submitted');if(view==='history'||view==='exam'){sidebar();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='history')renderHistory();else renderExamSetup()}else oldRender();store()};
function historyRows(){let qs=QUESTIONS.filter(q=>recentFor(q.id).length&&(`${q.question} ${GROUPS[groupOf(q)]}`.toLowerCase().includes(historyQuery.toLowerCase()))&&(historyFilter!=='hard'||difficulty(q.id).streak>=2||difficulty(q.id).wrong>=3));qs.sort((a,b)=>recentFor(b.id).at(-1).at-recentFor(a.id).at(-1).at);let count=qs.length;qs=qs.slice(historyPage*25,historyPage*25+25);$('#question-history').innerHTML=`<p class="small">${count} Fragen mit Verlauf · Seite ${historyPage+1} / ${Math.max(1,Math.ceil(count/25))}</p>${qs.length?qs.map(q=>{let d=difficulty(q.id);return `<details class="history-question"><summary>${esc(q.question)} <span class="small">${d.list.filter(e=>e.correct).length} / ${d.list.length} richtig</span></summary><p class="coach">${esc(coaching(q.id))}</p><ol class="event-list">${d.list.slice().reverse().map(e=>`<li><span>${dateLabel(e.at)} · ${modeLabel(e.mode)}</span><strong>${e.correct?'Richtig':'Noch nicht richtig'}</strong><span>Deine Antwort: ${esc(q.answers[e.selected])}</span></li>`).join('')}</ol><div class="actions"><button class="secondary" data-single="${q.id}">Noch einmal üben</button><button class="secondary" data-lesson="${q.lesson}">Erklärung lesen</button></div></details>`}).join(''):'<p>Noch keine passenden Antworten. Deine nächsten Versuche erscheinen hier.</p>'}<div class="actions"><button class="secondary" data-v2="hist-prev" ${historyPage===0?'disabled':''}>Zurück</button><button class="secondary" data-v2="hist-next" ${(historyPage+1)*25>=count?'disabled':''}>Weitere Fragen</button></div>`}
function renderHistory(){let exams=sessions.filter(s=>s.mode==='exam'),passed=exams.filter(s=>s.result.passed&&s.reason!=='aborted');$('#main').innerHTML=`<h1 class="page-title">Dein Lernweg.</h1><p class="intro">Hier siehst du, was schon klappt und was du noch üben kannst.</p><div class="exam-rules"><div><b>${events.length}</b>gespeicherte Antworten</div><div><b>${exams.length}</b>Probeprüfungen</div><div><b>${passed.length}</b>davon bestanden</div></div><p class="small">Nur auf diesem Gerät und in diesem Browser. Alte Zähler aus Fassung 1 haben keine Einzelzeiten; die genaue Historie beginnt mit Fassung 2. Sichere den Verlauf regelmäßig als Datei.</p><div class="actions"><button class="primary" data-v2="hard-quiz">Schwierige Fragen üben</button><button class="secondary" data-action="export">Verlauf sichern</button></div><h2>Prüfungen und Lernrunden</h2>${sessions.length?`<div class="table-scroll"><table><thead><tr><th>Datum</th><th>Art</th><th>Ergebnis</th><th>Dauer</th><th>Details</th></tr></thead><tbody>${sessions.slice().reverse().map(s=>`<tr><td>${dateLabel(s.endedAt)}</td><td>${modeLabel(s.mode)}</td><td>${s.result.right} / ${s.ids.length}<br>${s.reason==='aborted'?'Abgebrochen':s.reason==='abandoned'?'Vorzeitig beendet':s.mode==='exam'?(s.result.passed?'Bestanden':'Nicht bestanden'):'Übungsrunde'}${s.reason==='timeout'?' · Zeit abgelaufen':''}</td><td>${duration(s)}</td><td><button class="text-button" data-session="${esc(s.id)}">Ansehen</button></td></tr>`).join('')}</tbody></table></div>`:'<p>Hier stehen bald deine ersten Ergebnisse.</p>'}<h2>Deine Antworten je Frage</h2><label class="small" for="history-search">Frage suchen</label><input id="history-search" class="search" value="${esc(historyQuery)}" placeholder="Zum Beispiel: Sauerstoff"><label class="small">Anzeigen <select id="history-filter"><option value="all">Alle beantworteten Fragen</option><option value="hard" ${historyFilter==='hard'?'selected':''}>Wiederholt schwierig</option></select></label><div id="question-history"></div>${sources()}`;historyRows()}
function showSession(id){let s=sessions.find(s=>s.id===id);if(!s)return;$('#main').innerHTML=`<h1 class="page-title">${modeLabel(s.mode)}</h1><p>${dateLabel(s.endedAt)} · ${duration(s)} · ${s.reason==='aborted'?'Abgebrochen':s.reason==='timeout'?'Zeit abgelaufen':'Gespeichert'}</p><div class="score">${s.result.right} / ${s.ids.length}</div>${s.mode==='exam'?groupTable(s.result):''}<button class="secondary" data-view="history">Zurück zur Historie</button>${reviewRows(s)}${sources()}`;window.scrollTo(0,0)}
sources=function(){return oldSources()+`<p class="source">Fassung 2 · <a href="https://mhapunkt.github.io/am-wasser/">Zur gesicherten ersten Fassung</a> · <a href="https://github.com/mhapunkt/am-wasser/tree/v1.0-grundlage">Grundlage v1.0</a></p>`};
function exportV2(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(stateData(),null,2)],{type:'application/json'}));a.download='am-wasser-v2-verlauf.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function hardQuiz(){startQuiz(QUESTIONS.filter(q=>difficulty(q.id).streak>=2||difficulty(q.id).wrong>=3),'all')}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;
if(d.action==='export'){e.stopImmediatePropagation();exportV2();return}
if(d.action==='reset'){e.stopImmediatePropagation();if(confirm('Den gesamten Lernstand dieser zweiten Fassung einschließlich Historie löschen? Fassung 1 bleibt erhalten.')){saved.clear();read.clear();stats={};events=[];sessions=[];quiz=null;store();render()}return}
if(d.action==='newquiz'&&quiz&&!quiz.done)finishRun('abandoned');
if(d.action==='end'&&quiz&&!quiz.done){e.stopImmediatePropagation();finishRun('abandoned');render();return}
if(examActive()&&d.action==='next'){e.stopImmediatePropagation();return}
if(d.session){e.stopImmediatePropagation();if(!examActive())showSession(d.session);return}
if(d.jump!==undefined){e.stopImmediatePropagation();if(!expired()){quiz.index=Number(d.jump);store();render()}return}
if(!d.v2)return;e.stopImmediatePropagation();if(d.v2.startsWith('exam-')&&expired())return;
switch(d.v2){case'exam-start':startExam();break;case'exam-new':quiz=null;go('exam');break;case'exam-prev':quiz.index=Math.max(0,quiz.index-1);render();break;case'exam-next':if(quiz.index<59){quiz.index++;render()}else $('#exam-overview').open=true;break;case'exam-clear':delete quiz.responses[quiz.ids[quiz.index]];render();break;case'exam-submit':confirmExam('submitted');break;case'exam-abort':confirmExam('aborted');break;case'exam-confirm-submit':finishRun('submitted');render();break;case'exam-confirm-abort':finishRun('aborted');render();break;case'exam-cancel':render();break;case'hard-quiz':hardQuiz();break;case'review-errors':startQuiz(quiz.ids.filter(id=>quiz.responses[id]!==byId(id).correct[0]).map(byId),'all');break;case'hist-prev':historyPage=Math.max(0,historyPage-1);historyRows();break;case'hist-next':historyPage++;historyRows();break}
},true);
document.addEventListener('input',e=>{if(e.target.id==='history-search'){historyQuery=e.target.value;historyPage=0;historyRows()}});
document.addEventListener('change',e=>{if(e.target.id==='history-filter'){historyFilter=e.target.value;historyPage=0;historyRows()}});
function validateBackup(d){if(!d||![1,2].includes(d.version)||!Array.isArray(d.saved)||!d.saved.every(id=>byId(id))||!Array.isArray(d.read)||!d.read.every(id=>Number.isInteger(id)&&LESSONS[id])||!d.stats||typeof d.stats!=='object')throw Error('Format');for(let [id,s]of Object.entries(d.stats))if(!byId(id)||!Number.isInteger(s.attempts)||s.attempts<0||!Number.isInteger(s.correct)||s.correct<0||s.correct>s.attempts||typeof s.last!=='boolean')throw Error('Zähler');if(d.version===2){if(d.dataVersion!==DATA_VERSION||!Array.isArray(d.events)||!Array.isArray(d.sessions))throw Error('Version');if(new Set(d.events.map(e=>e.id)).size!==d.events.length||new Set(d.events.map(e=>e.runId+':'+e.questionId)).size!==d.events.length||d.events.some(e=>!e||typeof e.id!=='string'||typeof e.runId!=='string'||!byId(e.questionId)||!Number.isInteger(e.selected)||e.selected<0||e.selected>2||e.correct!==(e.selected===byId(e.questionId).correct[0])||!Number.isFinite(e.at)||!['practice','test','exam'].includes(e.mode)))throw Error('Antwort');if(d.sessions.some(s=>!validRun({...s,index:0})||!Number.isFinite(s.endedAt)||!['submitted','timeout','aborted','abandoned'].includes(s.reason)))throw Error('Runde');if(d.active&&!validRun(d.active))throw Error('Aktiv')}}
document.addEventListener('change',async e=>{if(e.target.id!=='import-v2')return;let f=e.target.files[0];if(!f)return;if(examActive()){toast('Beende zuerst deine Prüfung.');return}try{let d=JSON.parse(await f.text());validateBackup(d);if(!confirm('Den aktuellen Verlauf der zweiten Fassung durch diese Sicherung ersetzen?'))return;saved=new Set(d.saved);read=new Set(d.read);stats=d.stats;events=d.version===2?d.events:[];sessions=d.version===2?d.sessions.map(s=>({...s,result:assess(s.ids,s.responses)})):[];quiz=d.version===2&&validRun(d.active)?d.active:null;view=quiz?'quiz':'history';store();if(!expired())render();toast('Sicherung geladen.')}catch{toast('Die Datei enthält keinen passenden, vollständigen Lernstand. Nichts wurde geändert.')}});
setInterval(()=>{if(!examActive())return;if(expired())return;let clock=$('#exam-clock');if(clock)clock.textContent=timeLeft()},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)expired()});
if(quiz&&!quiz.done)view='quiz';
if(examActive()&&Date.now()>=quiz.deadline){finishRun('timeout');view='quiz'}

render();
</script></body></html>
